      </div>
      <div id="admBody"></div>
    `));
    app.querySelectorAll(".navtabs button").forEach(b => b.onclick = () => { adminTab = b.dataset.t; renderAdmin(u); });
    if (adminTab === "overview") renderAdminOverview();
    else if (adminTab === "locations") renderAdminLocations(u);
    else if (adminTab === "products") renderAdminProducts(u);

  // Pontaj (admin): timpii de lucru ai tuturor Agenților Cleaning
  function renderAdminTime() {
    const body = $("#admBody");
    const sessions = S.allWorkSessions();
    // rezumat pe Agent Cleaning
    const byExec = {};
    sessions.forEach(s => {
      if (!byExec[s.executorId]) byExec[s.executorId] = { name: s.executorName, count: 0, minutes: 0 };
      if (s.minutes != null) { byExec[s.executorId].count++; byExec[s.executorId].minutes += s.minutes; }
    });
    const totalMin = sessions.reduce((a, s) => a + (s.minutes || 0), 0);
    body.appendChild(el(`<p class="hint" style="margin:0 0 16px">Fiecare lucrare este cronometrată din momentul în care Agentul Cleaning apasă <strong>«Începe lucrul»</strong> până la <strong>«locația e gata»</strong>.</p>`));
    if (!sessions.length) { body.appendChild(el(`<p class="hint">Nicio activitate cronometrată încă.</p>`)); return; }
    body.appendChild(el(`
      <div class="section-title" style="margin-top:0">Rezumat pe Agent Cleaning</div>
      <div class="grid cols-3" style="margin-bottom:8px">
        ${Object.values(byExec).map(e => `<div class="card stat"><span class="label">${esc(e.name)}</span><span class="value">${fmtDur(e.minutes)}</span><span class="hint">${e.count} lucrări · medie ${fmtDur(e.count ? Math.round(e.minutes / e.count) : 0)}</span></div>`).join("")}
      </div>
      <div class="hint" style="margin:0 0 16px">Timp total lucrat (toți): <strong>${fmtDur(totalMin)}</strong></div>`));
    body.appendChild(el(`
      <div class="card">
        <div class="section-title" style="margin-top:0">Toate sesiunile</div>
        <div class="timesheet">
          <div class="ts-row ts-head ts-6"><span>Data</span><span>Agent Cleaning</span><span>Adresă</span><span>Început</span><span>Terminat</span><span>Durată</span></div>
          ${sessions.map(s => `
            <div class="ts-row ts-6">
              <span>${esc(s.date || "—")}</span>
              <span>${esc(s.executorName)}</span>
              <span class="ts-addr">${esc(s.address)}</span>
              <span>${fmtClock(s.startedAt)}</span>
              <span>${s.finishedAt ? fmtClock(s.finishedAt) : `<span class="pill" style="border-color:var(--warn);color:var(--warn)">în lucru</span>`}</span>
              <span class="ts-dur">${s.inProgress ? "—" : fmtDur(s.minutes)}</span>
            </div>`).join("")}
        </div>
      </div>`));
  }

  /* =========================================================
     CARD SOLICITARE (reutilizabil)
     ========================================================= */
  function requestCard(r, ctx, u) {
    const p = S.priceOf(r);
    const b = S.breakdown(r);
    const isExec = ctx.startsWith("executant");
    const requester = S.userById(r.requesterId);
    const cleaner = r.executorId ? S.userById(r.executorId) : null;
    const linenExec = r.linenExecutorId ? S.userById(r.linenExecutorId) : null;

    const amCleaner = isExec && r.executorId === u.id;
    const amLinen = isExec && r.linenExecutorId === u.id;
    // detaliile de check-in: vizibile adminului mereu, iar Agentului Cleaning doar după ce a preluat
    const loc = S.locationById(r.locationId);
    const showCheckin = ctx === "admin" || (isExec && (amCleaner || amLinen));
    const cleaningAvailable = !r.executorId && r.status === S.STATUS.PLATIT;
    const linenAvailable = r.linens && !r.linenExecutorId &&
      [S.STATUS.PLATIT, S.STATUS.ACCEPTAT, S.STATUS.IN_PROGRES].includes(r.status);

    const rel = `<span class="badge payout-released">eliberată</span>`;
    const pend = `<span class="badge payout-pending">la finalizare</span>`;
    const cleaningBadge = r.payoutStatus === "released" ? rel : pend;
    const linenBadge = r.linenPayoutStatus === "released" ? rel : pend;

    // caseta cu împărțirea banilor
    let payoutBox = "";
    if (isExec) {
      const cleaningRow = amCleaner
        ? `<div class="prow"><span>Curățenie — tu primești</span><span>${money(b.cleaningPayout)} ${cleaningBadge}</span></div>`
        : cleaner
          ? `<div class="prow"><span>Curățenie — ${esc(cleaner.name)}</span><span>${money(b.cleaningPayout)}</span></div>`
          : `<div class="prow"><span>Curățenie — disponibilă</span><span>poți primi ${money(b.cleaningPayout)}</span></div>`;
      let linenRow;
      if (!r.linens) linenRow = `<div class="prow"><span>Lenjerie</span><span>fără (a clientului)</span></div>`;
      else if (r.linenExecutorId === u.id) linenRow = `<div class="prow"><span>Lenjerie — tu primești</span><span>${money(b.linenPayout)} ${linenBadge}</span></div>`;
      else if (amCleaner) linenRow = `<div class="prow"><span>Lenjerie (${r.linenSets} seturi)</span><span>${r.linenDeclined ? "preia Serviciul de lenjerie" : "o poți prelua +" + money(b.linenPayout)}</span></div>`;
      else linenRow = `<div class="prow"><span>Lenjerie (${r.linenSets} seturi)</span><span>o decide Agentul Cleaning de curățenie</span></div>`;
      const consRow = (b.consExecutantPayout > 0 && amCleaner)
        ? `<div class="prow"><span>Consumabile (${C.consumableSplit.executant}% din adaos)</span><span>+${money(b.consExecutantPayout)}</span></div>` : "";
      payoutBox = `<div class="payout">
        <div class="prow"><span>Client plătește</span><span>${money(b.total)}</span></div>
        <div class="prow comm"><span>Comision platformă (${b.pct}%)</span><span>−${money(b.commission)}</span></div>
        ${cleaningRow}${linenRow}${consRow}
      </div>`;
    } else if (ctx === "admin") {
      payoutBox = `<div class="payout">
        <div class="prow"><span>Încasat de la client</span><span>${money(b.total)}</span></div>
        ${r.linens && r.linenSets > 0 ? `<div class="prow"><span>din care lenjerie (${r.linenSets} × ${C.linenSetPriceRon} lei)</span><span>${b.linenRon} lei ≈ ${money(b.linenEur)}</span></div>` : ""}
        <div class="prow comm"><span>Comision platformă (${b.pct}%)</span><span>${money(b.commission)}</span></div>
        <div class="prow"><span>Curățenie → ${cleaner ? esc(cleaner.name) : "neatribuit"}</span><span>${money(b.cleaningPayout)} ${r.executorId ? cleaningBadge : ""}</span></div>
        ${r.linens ? `<div class="prow"><span>Lenjerie → ${linenExec ? esc(linenExec.name) : "nepreluat"}</span><span>${b.linenTaken ? money(b.linenPayout) + " " + linenBadge : money(b.linenPayout) + " · platformă"}</span></div>` : ""}
      </div>`;
    }

    // lista Agenților Cleaning înscriși — solicitantul alege (când e plătită și neatribuită)
    let applicantsBox = "";
    if (ctx === "solicitant" && r.status === S.STATUS.PLATIT && !r.executorId) {
      const apps = S.applicantsOf(r.id);
      applicantsBox = `<div class="applicants">
        <div class="ap-title">🧹 Agenți Cleaning înscriși (${apps.length}) — alege pe cine dorești</div>
        ${apps.length ? apps.map(a => `
          <div class="ap-row">
            <div class="ap-who">${avatarHtml(a, 34)}<span><strong>${esc(a.name)}</strong> ${ratingInline(a.id)}<br><small class="hint">${esc((a.business && a.business.name) || "")}</small></span></div>
            <button class="btn btn-ok btn-sm" data-choose="${a.id}">Alege</button>
          </div>`).join("")
          : `<p class="hint" style="margin:0">Se așteaptă înscrieri de la Agenții Cleaning din zona ta…</p>`}
      </div>`;
    }

    // widget de recenzie (solicitant → Agent Cleaning, după finalizare) — doar cu ≥5 solicitări/lună
    let reviewBox = "";
    if (ctx === "solicitant" && r.status === S.STATUS.FINALIZAT && cleaner) {
      const existing = S.reviewByRequest(r.id, u.id);
      const elig = S.canReview(u.id, r);
      reviewBox = existing
        ? `<div class="review-box done">⭐ Evaluarea ta pentru ${esc(cleaner.name)}: ${starsHtml(existing.stars)} ${existing.comment ? "· „" + esc(existing.comment) + "”" : ""}</div>`
        : !elig.ok
          ? `<div class="review-box done">🔒 Recenziile sunt disponibile clienților cu <strong>minim ${elig.need} solicitări pe lună</strong>. În ${elig.ym} ai ${elig.count} — mai fă ${elig.need - elig.count} ca să poți evalua.</div>`
          : `<div class="review-box" data-review-to="${cleaner.id}">
              <div class="rv-title">Evaluează Agentul Cleaning <strong>${esc(cleaner.name)}</strong> — acuratețea serviciului</div>
              <div class="star-pick">${[1, 2, 3, 4, 5].map(n => `<span class="star pick" data-star="${n}">★</span>`).join("")}</div>
              <input class="rv-comment" placeholder="Comentariu (opțional)" />
              <button class="btn btn-sm" data-act="submitReview" disabled>Trimite evaluarea</button>
            </div>`;
    }

    let actions = "";
    if (ctx === "solicitant") {
      if (r.status === S.STATUS.NOU) actions = `<button class="btn btn-ok btn-sm" data-act="pay">Plătește ${money(p.total)}</button>
        <button class="btn btn-soft btn-sm" data-act="cancel">Anulează</button>`;
      else {
        const parts = [cleaner ? `<span class="pill">${avatarHtml(cleaner, 20)} ${esc(cleaner.name)} ${ratingInline(cleaner.id)}</span>` : `<span class="pill">🧹 în așteptare / alegere Agent Cleaning</span>`];
        if (r.linens) {
          parts.push(linenExec ? `<span class="pill">🧺 lenjerie: ${esc(linenExec.name)}</span>`
            : r.linenDeclined ? `<span class="pill">🧺 lenjerie: la spălătorie</span>`
            : `<span class="pill">🧺 lenjerie: în decizia Agentului Cleaning</span>`);
        }
        actions = parts.join("");
      }
    } else if (isExec) {
      const acts = [];
      if (cleaningAvailable) {
        acts.push(S.hasApplied(r.id, u.id)
          ? `<span class="pill">✅ Te-ai înscris · în așteptarea alegerii</span> <button class="btn btn-soft btn-sm" data-act="withdraw">Retrage</button>`
          : `<button class="btn btn-ok btn-sm" data-act="apply">✋ Înscrie-mă la această solicitare</button>`);
      }
      if (amCleaner) {
        if (r.status === S.STATUS.ACCEPTAT) acts.push(`<button class="btn btn-sm" data-act="start">Începe lucrul</button>`);
        else if (r.status === S.STATUS.IN_PROGRES) acts.push(`<button class="btn btn-ok btn-sm" data-act="ready">🔔 Anunță: locația e gata pentru oaspeți</button>`);
        else if (r.status === S.STATUS.FINALIZAT) acts.push(`<span class="pill">✅ Locația e gata · client anunțat</span>`);

        // decizia pentru lenjerie — independentă de finalizarea curățeniei:
        // rămâne disponibilă până când lenjeria e preluată sau refuzată (chiar și după «gata»)
        if (r.linens && r.status !== S.STATUS.ANULAT) {
          if (r.linenExecutorId === u.id) {
            acts.push(r.linenDone ? `<span class="pill">✅ Lenjerie gata</span>` : `<button class="btn btn-ok btn-sm" data-act="finishLinen">🧺 Lenjerie gata</button>`);
          } else if (r.linenExecutorId) {
            // preluată de un Serviciu de lenjerie → arată contactul pentru coordonare
            const lu = S.userById(r.linenExecutorId);
            acts.push(`<span class="pill">🧺 Lenjeria — preluată de ${esc(lu ? lu.name : "Serviciul de lenjerie")}</span>`);
            if (r.linenPickup) acts.push(`<span class="pill">📍 Ridicare: ${esc(r.linenPickup.address)}</span>`);
            if (lu) acts.push(contactPill(lu, "Serviciu lenjerie"));
          } else if (r.linenDeclined) {
            acts.push(`<span class="pill">🧺 Lenjeria — trimisă la Serviciul de lenjerie (în așteptarea preluării)</span> <button class="btn btn-soft btn-sm" data-act="takeLinen">preiau totuși (+${money(b.linenPayout)})</button>`);
            if (r.linenPickup) acts.push(`<span class="pill">📍 Ridicare: ${esc(r.linenPickup.address)}</span>`);
          } else {
            acts.push(`<button class="btn btn-soft btn-sm" data-act="takeLinen">🧺 Preiau lenjeria la spălat (+${money(b.linenPayout)})</button>
              <button class="btn btn-soft btn-sm" data-act="declineLinen">Nu preiau lenjeria</button>`);
          }
        }
      }
      actions = acts.join("");
    } else if (ctx === "admin") {
      actions = `<span class="pill">Solicitant: ${esc(requester ? requester.name : "?")}</span>
        ${cleaner ? `<span class="pill">🧹 ${esc(cleaner.name)}</span>` : ""}
        ${linenExec ? `<span class="pill">🧺 ${esc(linenExec.name)}</span>` : ""}`;
    }

    // adresa completă apare doar după ce Agentul Cleaning preia (curățenie sau lenjerie)
    const showFullAddress = !isExec || amCleaner || amLinen;
    const addr = showFullAddress ? esc(r.address) : "Adresa completă apare după preluare";

    const card = el(`
      <div class="req-item">
        <div class="req-top">
          <div>
            <h3>Curățenie · ${r.sqm} m² <span class="badge ${r.status}">${S.STATUS_LABEL[r.status]}</span></h3>
            <div class="req-meta">
              <span>📍 ${esc(r.area)}</span>
              <span>🏠 ${addr}</span>
              ${showFullAddress && r.mapsUrl ? `<span>${mapsLink(r.mapsUrl)}</span>` : ""}
              <span>📅 ${esc(r.date)} · ${esc(r.startTime || r.time || "")}${r.endTime ? "–" + esc(r.endTime) : ""}</span>
              <span>🛏️ ${r.linens ? r.linenSets + " set lenjerie" : "fără lenjerie (proprie)"}</span>
              ${b.discPct ? `<span class="pill">−${b.discPct}% interval</span>` : ""}
              ${b.surPct ? `<span class="pill" style="border-color:var(--warn);color:var(--warn)">+${b.surPct}% weekend/sărbătoare</span>` : ""}
            </div>
          </div>
          <div class="req-price">
            <span class="big">${money(p.total)}</span>
            <small>${money(p.cleaningNet)} curățenie${p.linenIncluded && p.linenSets > 0 ? " + " + money(p.linenEur) + " lenjerie" : ""}</small>
          </div>
        </div>
        ${r.readyNotified ? `<div class="ready-banner">🎉 Locația este gata pentru oaspeți!${cleaner ? ` Anunțat de <strong>${esc(cleaner.name)}</strong>` : ""}${r.readyAt ? ` · ${fmtWhen(r.readyAt)}` : ""}</div>` : ""}
        ${r.notes ? `<div class="req-notes">📝 ${esc(r.notes)}</div>` : ""}
        ${showCheckin && loc ? checkinBox(loc.checkin) : ""}
        ${(ctx === "solicitant" || ctx === "admin" || amCleaner) ? shoppingBox(r, amCleaner ? "exec" : "other") : ""}
        ${payoutBox}
        ${applicantsBox}
        ${reviewBox}
        <div class="req-body">
          <div class="btn-row">${actions}</div>
        </div>
      </div>
    `);

    // widget de recenzie: alegerea stelelor
    let pickedStars = 0;
    const stars = card.querySelectorAll(".star.pick");
    stars.forEach(st => st.onclick = () => {
      pickedStars = Number(st.dataset.star);
      stars.forEach(x => x.classList.toggle("on", Number(x.dataset.star) <= pickedStars));
      const btn = card.querySelector('[data-act="submitReview"]');
      if (btn) btn.disabled = false;
    });

    // handlers
    card.querySelectorAll("[data-act]").forEach(btn => btn.onclick = () => {
      const act = btn.dataset.act;
      if (act === "pay") openPayment(r.id, u);
      else if (act === "cancel") { S.cancelRequest(r.id); toast("Solicitare anulată.", ""); renderApp(); }
      else if (act === "apply") {
        const res = S.applyToRequest(r.id, u.id);
        if (res.ok) { toast("Te-ai înscris! Solicitantul te poate alege.", "ok"); renderApp(); }
        else toast("Nu te poți înscrie la această solicitare.", "err");
      }
      else if (act === "withdraw") { S.withdrawApplication(r.id, u.id); toast("Ți-ai retras înscrierea.", ""); renderApp(); }
      else if (act === "takeLinen") {
        const res = S.takeLinenService(r.id, u.id);
        if (res.ok) { toast("Ai preluat lenjeria la spălat (+plată).", "ok"); renderApp(); }
        else toast("Nu poți prelua lenjeria pentru această lucrare.", "err");
      }
      else if (act === "declineLinen") { declineLinenModal(r, u); }
      else if (act === "finishLinen") { S.finishLinenService(r.id); toast("Lenjerie finalizată. Plata se eliberează.", "ok"); renderApp(); }
      else if (act === "start") { S.startWork(r.id, u.id); toast("Ai început lucrul — cronometrul pornește.", "ok"); renderApp(); }
      else if (act === "ready") { S.markReady(r.id); toast("Ai anunțat clientul: locația e gata pentru oaspeți!", "ok"); renderApp(); }
      else if (act === "submitReview") {
        if (!pickedStars) return toast("Alege numărul de stele.", "err");
        const comment = (card.querySelector(".rv-comment") || {}).value || "";
        const res = S.addReview({ requestId: r.id, fromId: u.id, toId: cleaner.id, stars: pickedStars, comment });
        if (!res.ok) return toast(res.error, "err");
        toast("Mulțumim pentru evaluare!", "ok"); renderApp();
      }
    });
    // solicitantul alege un Agent Cleaning înscris
    card.querySelectorAll("[data-choose]").forEach(btn => btn.onclick = () => {
      const res = S.chooseExecutor(r.id, btn.dataset.choose);
      if (res.ok) { const ex = S.userById(btn.dataset.choose); toast("L-ai ales pe " + (ex ? ex.name : "Agent Cleaning") + "!", "ok"); renderApp(); }
      else toast(res.error || "Nu s-a putut alege Agentul Cleaning.", "err");
    });
    return card;
  }

  function emptyState(title, sub) {
    return el(`<div class="empty card"><span class="ico">📭</span><h3 style="margin:0 0 6px">${esc(title)}</h3><p style="margin:0">${esc(sub)}</p></div>`);
  }

  /* ---------- start ---------- */
  // Inițializează stocarea (server Railway sau localStorage), apoi randează.
  // onRemote = re-randare când alt utilizator schimbă datele (polling).
  S.init(() => { try { renderApp(); } catch (e) {} }).then(() => renderApp()).catch(() => renderApp());
})();

</script>
</body>
</html>
