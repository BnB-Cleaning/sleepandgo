    // zonele în care activează un utilizator (Serviciul de lenjerie poate avea mai multe)
    areasOf(u) { const x = u && u.areas; return (Array.isArray(x) && x.length) ? x : (u && u.area ? [u.area] : []); },
    // rolurile unui utilizator (poate avea mai multe: ex. Solicitant + Serviciu lenjerie)
    rolesOf(u) { const x = u && u.roles; return (Array.isArray(x) && x.length) ? x : (u && u.role ? [u.role] : []); },
    hasRole(u, r) { return this.rolesOf(u).includes(r); },

    hasActiveExecutorInArea(area) { return db.users.some(u => this.hasRole(u, "executant") && this.areasOf(u).includes(area)); },

    // ---- Circuit lenjerie (per proprietar): locație ↔ spălătorie ↔ Agent Cleaning ----
    linenCircuitOf(ownerId) {
      const u = this.userById(ownerId);
      const c = (u && u.linenCircuit) || {};
      let received = Number(c.received || 0), atLocation = Number(c.atLocation || 0),
        atLaundry = Number(c.atLaundry || 0), atExecutor = Number(c.atExecutor || 0);
      // auto-init: seturi primite dar nedistribuite → toate „în locație" (le pune proprietarul)
      if (u && received > 0 && (atLocation + atLaundry + atExecutor) === 0) {
        atLocation = received;
        u.linenCircuit = { received, atLocation, atLaundry, atExecutor };
        save(db);
      }
      return { received, atLocation, atLaundry, atExecutor };
    },
    // mută automat k seturi între stări (k = lenjeriile solicitării), pentru proprietarul locației
    moveLinenForRequest(req, from, to) {
      if (!req || !req.linens) return;
      const loc = this.locationById(req.locationId);
      const ownerId = loc && loc.ownerId; if (!ownerId) return;
      const k = Number(req.linenSets) || 0; if (k <= 0) return;
      const u = this.userById(ownerId); if (!u) return;
      const c = this.linenCircuitOf(ownerId);   // asigură și inițializarea
      const move = Math.min(k, c[from]); if (move <= 0) return;
      c[from] -= move; c[to] += move;
      u.linenCircuit = { received: c.received, atLocation: c.atLocation, atLaundry: c.atLaundry, atExecutor: c.atExecutor };
      save(db);
    },
    setLinenCircuit(ownerId, patch) {
      const u = this.userById(ownerId); if (!u) return { ok: false };
      const c = this.linenCircuitOf(ownerId);
      const next = { ...c, ...patch };
      ["received", "atLocation", "atLaundry", "atExecutor"].forEach(k => next[k] = Math.max(0, Number(next[k]) || 0));
      u.linenCircuit = next; save(db); return { ok: true, circuit: next };
    },
    solicitants() { return db.users.filter(u => u.role === "solicitant"); },

    },
    _ensureNewsletter() {
      if (!db.newsletter) db.newsletter = {};
      const n = db.newsletter;
      if (!Array.isArray(n.subs)) n.subs = [];
      if (!n.seq || typeof n.seq !== "object") n.seq = this._defaultNewsletterSeq();
      else this.NEWSLETTER_CATEGORIES.forEach(c => { if (!Array.isArray(n.seq[c])) n.seq[c] = this._defaultNewsletterSeq()[c]; });
      if (!(n.intervalDays > 0)) n.intervalDays = 2;
      return n;
    },
    newsletter() { return this._ensureNewsletter(); },
    newsletterSubs(category) {
      const subs = this._ensureNewsletter().subs.slice().sort((a, b) => b.createdAt - a.createdAt);
      return category && category !== "all" ? subs.filter(s => s.category === category) : subs;
    },
    async subscribeNewsletter(data) {
      const category = data && data.category;
      const email = String((data && data.email) || "").trim().toLowerCase();
      if (!this.NEWSLETTER_CATEGORIES.includes(category)) return { ok: false, error: "Categorie invalidă." };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok: false, error: "Introdu un email valid." };
      if (MODE === "api") {
        let r; try { r = await apiPOST("/api/newsletter", { category, email, name: data.name || "", phone: data.phone || "" }); }
        catch (e) { return { ok: false, error: "Eroare de rețea." }; }
        if (r && r.ok) { try { await refreshState(); } catch (e) {} }
        return r || { ok: false, error: "A eșuat." };
      }
      const n = this._ensureNewsletter();
      let sub = n.subs.find(s => s.category === category && s.email === email);
      if (sub && !sub.unsubscribed) return { ok: true, already: true };
      if (sub) { sub.unsubscribed = false; sub.done = false; sub.step = 0; }
      else n.subs.push({ id: uid("sub"), category, email, name: data.name || "", phone: data.phone || "", createdAt: Date.now(), step: 0, nextSendAt: Date.now(), lastSentAt: null, done: false, unsubscribed: false });
      save(db); return { ok: true };
    },
    // admin — editează secvențele / intervalul
    updateNewsletterSeq(category, steps) {
      const n = this._ensureNewsletter();
      n.seq[category] = (steps || []).map(s => ({ subject: String(s.subject || ""), body: String(s.body || "") }));
      save(db); return { ok: true };
    },
    setNewsletterInterval(days) {
      const n = this._ensureNewsletter(); n.intervalDays = Math.max(1, Number(days) || 2); save(db); return { ok: true };
    },
    async removeSubscriber(id) {
      if (MODE === "api") {
        let r; try { r = await apiPOST("/api/newsletter/remove", { id }); } catch (e) { return { ok: false, error: "Eroare de rețea." }; }
        if (r && r.ok) { try { await refreshState(); } catch (e) {} }
        return r || { ok: false };
      }
      const n = this._ensureNewsletter(); n.subs = n.subs.filter(s => s.id !== id); save(db); return { ok: true };
    },
    async broadcastNewsletter(category, subject, body) {
      if (MODE === "api") {
        let r; try { r = await apiPOST("/api/newsletter/broadcast", { category, subject, body }); } catch (e) { return { ok: false, error: "Eroare de rețea." }; }
        return r || { ok: false, error: "A eșuat." };
      }
      // local: simulăm trimiterea (fără server email)
      const targets = this.newsletterSubs(category).filter(s => !s.unsubscribed);
      return { ok: true, sent: 0, total: targets.length, local: true };
    },

    // ---- Referral (recomandă și câștigă) ----
    REF_PCT: 10, REF_CAP: 3, REF_PAYOUT_EUR: 50,
    _ensureReferrals() {
      if (!db.referrals || typeof db.referrals !== "object") db.referrals = {};
      const r = db.referrals;
      if (!r.clicks || typeof r.clicks !== "object") r.clicks = {};
      if (!Array.isArray(r.ledger)) r.ledger = [];
      if (!r.paid || typeof r.paid !== "object") r.paid = {};
      if (!r.spent || typeof r.spent !== "object") r.spent = {};
      return r;
    },
    _genRefCode() {
      const AL = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const used = new Set((db.users || []).map(u => u.refCode).filter(Boolean));
      let c; do { c = Array.from({ length: 6 }, () => AL[Math.floor(Math.random() * AL.length)]).join(""); } while (used.has(c));
      return c;
    },
    myRefCode(u) {
      if (!u) return "";
      if (!u.refCode) {   // fallback (mod local / conturi vechi)
        if (MODE !== "api") { u.refCode = this._genRefCode(); save(db); }
      }
      return u.refCode || "";
    },
    refLink(u) {
      let o = "https://www.sleepandgocleaning.com";
      try { o = location.origin; if (/sleepandgocleaning\.com/i.test(o)) o = o.replace("://", "://www.").replace("www.www.", "www."); } catch (e) {}
      return o.replace(/\/$/, "") + "/?ref=" + this.myRefCode(u);
    },
    refStats(u) {
      const R = this._ensureReferrals();
      const mine = R.ledger.filter(e => e.referrerId === u.id);
      const earned = round2(mine.reduce((s, e) => s + (Number(e.amountEur) || 0), 0));
      const paid = round2(R.paid[u.id] || 0);
      const spent = round2(R.spent[u.id] || 0);
      const available = round2(earned - paid - spent);   // sold de folosit (cash la 50€ sau credit servicii)
      return {
        code: this.myRefCode(u), link: this.refLink(u), iban: this.refIban(u),
        clicks: R.clicks[this.myRefCode(u)] || 0,
        earned, paid, spent, available, pending: available, credits: mine.length,
        eligible: available >= this.REF_PAYOUT_EUR, threshold: this.REF_PAYOUT_EUR,
      };
    },
    refAvailable(u) { return u ? this.refStats(u).available : 0; },
    // IBAN pentru virarea câștigurilor din recomandări (fallback: IBAN-ul firmei, dacă există)
    refIban(u) { return (u && (u.refIban || (u.business && u.business.iban))) || ""; },
    async setRefIban(iban) {
      const u = this.currentUser(); if (!u) return { ok: false, error: "Neautentificat." };
      const clean = String(iban || "").replace(/\s+/g, "").toUpperCase();
      if (clean && !/^RO\d{2}[A-Z0-9]{16,30}$/.test(clean)) return { ok: false, error: "IBAN invalid (format: RO urmat de 22–32 caractere)." };
      this.updateUser(u.id, { refIban: clean });
      if (MODE === "api") { try { await this.flush(); } catch (e) {} }
      return { ok: true, iban: clean };
    },
    refClicksTotal() { const R = this._ensureReferrals(); return Object.values(R.clicks).reduce((s, n) => s + (Number(n) || 0), 0); },
    // solicitantul folosește creditul din recomandări pt. o solicitare (parțial/integral)
    async redeemReferral(reqId) {
      if (MODE === "api") {
        let r; try { r = await apiPOST("/api/ref/redeem", { reqId }); } catch (e) { return { ok: false, error: "Eroare de rețea." }; }
        if (r && r.ok) { try { await refreshState(); } catch (e) {} }
        return r || { ok: false, error: "A eșuat." };
      }
      const req = this.requestById(reqId);
      if (!req) return { ok: false, error: "Solicitare inexistentă." };
      if (req.status !== STATUS.NOU) return { ok: false, error: "Solicitarea nu mai poate fi plătită." };
      const u = this.currentUser(); if (!u) return { ok: false, error: "Neautentificat." };
      const R = this._ensureReferrals();
      const available = this.refAvailable(u);
      if (available <= 0) return { ok: false, error: "Nu ai credit din recomandări disponibil." };
      const total = round2(priceOf(req).total - (Number(req.refCreditUsed) || 0));
      const creditUsed = round2(Math.min(available, total));
      if (creditUsed <= 0) return { ok: false, error: "Nimic de acoperit din credit." };
      R.spent[u.id] = round2((Number(R.spent[u.id]) || 0) + creditUsed);
      req.refCreditUsed = round2((Number(req.refCreditUsed) || 0) + creditUsed);
      const remaining = round2(total - creditUsed);
      let fullyPaid = false;
      if (remaining <= 0.009) { req.status = STATUS.PLATIT; req.paidAt = Date.now(); fullyPaid = true; }
      save(db);
      return { ok: true, creditUsed, fullyPaid, remainingEur: Math.max(0, remaining), available: this.refAvailable(u) };
    },
    async recordRefClick(code) {
      code = String(code || "").toUpperCase(); if (!code) return;
      if (MODE === "api") { try { await apiPOST("/api/ref/click", { code }); } catch (e) {} return; }
      const R = this._ensureReferrals();
      if ((db.users || []).some(u => u.refCode === code)) { R.clicks[code] = (R.clicks[code] || 0) + 1; save(db); }
    },
    // apelat la încărcarea aplicației: prinde ?ref=COD din URL, îl reține și numără clicul (o dată/browser)
    async refCaptureFromUrl() {
      try {
        const p = new URLSearchParams(location.search);
        const code = (p.get("ref") || "").trim().toUpperCase();
        if (!code) return;
        localStorage.setItem("sgc_ref", code);
        const flag = "sgc_refclk_" + code;
        if (!localStorage.getItem(flag)) { await this.recordRefClick(code); localStorage.setItem(flag, "1"); }
      } catch (e) {}
    },
    // admin: toți cei cu câștiguri SAU cu clicuri pe link (pentru statistici complete)
    referrers() {
      const R = this._ensureReferrals();
      const earners = R.ledger.map(e => e.referrerId);
      const clickers = (db.users || []).filter(u => u.refCode && (R.clicks[u.refCode] || 0) > 0).map(u => u.id);
      const ids = [...new Set([...earners, ...clickers])];
      return ids.map(id => {
        const u = this.userById(id);
        const st = u ? this.refStats(u) : { earned: 0, paid: 0, spent: 0, pending: 0, clicks: 0, credits: 0, eligible: false, iban: "" };
        return { id, name: u ? u.name : id, email: u ? u.email : "", role: u ? u.role : "", ...st };
      }).sort((a, b) => (b.pending - a.pending) || (b.clicks - a.clicks));
    },
    async refPayout(userId) {
      if (MODE === "api") {
        let r; try { r = await apiPOST("/api/ref/payout", { userId }); } catch (e) { return { ok: false, error: "Eroare de rețea." }; }
        if (r && r.ok) { try { await refreshState(); } catch (e) {} }
        return r || { ok: false };
      }
      // local: virează doar soldul disponibil (după creditul cheltuit pe servicii)
      const R = this._ensureReferrals(); const u = this.userById(userId);
      const avail = u ? this.refStats(u).available : 0;
      R.paid[userId] = round2((Number(R.paid[userId]) || 0) + Math.max(0, avail)); save(db); return { ok: true };
    },

    // ---- VIP Member (abonament, per locație) ----
    vipConfig() { return CONFIG.vip; },
    vipMonthlyRon(locations) { const c = CONFIG.vip; return c.baseRon + c.extraRon * (Math.max(1, Number(locations) || 1) - 1); },
    vipLocationsFor(u) { return Math.max(1, this.approvedLocationsOfOwner(u.id).length); },
    isVipActive(u) { return !!(u && u.vip && u.vip.active && (!u.vip.until || u.vip.until > Date.now())); },
    vipLocationIds(u) { return (u && u.vip && Array.isArray(u.vip.locationIds)) ? u.vip.locationIds.slice() : []; },
    // discountul VIP se aplică DOAR pentru locațiile înscrise în abonament
    isVipLocation(u, locId) { return this.isVipActive(u) && this.vipLocationIds(u).includes(locId); },
    vipInfo(u) {
      const c = CONFIG.vip;
      const v = (u && u.vip) || null;
      const active = this.isVipActive(u);
      const locationIds = this.vipLocationIds(u);
      const locations = (v && Array.isArray(v.locationIds)) ? v.locationIds.length : this.vipLocationsFor(u);
      const monthlyRon = this.vipMonthlyRon(Math.max(1, locations));
      const daysLeft = (v && v.until) ? Math.max(0, Math.ceil((v.until - Date.now()) / 86400000)) : 0;
      return { active, since: v ? v.since : null, until: v ? v.until : null, locations, locationIds, monthlyRon, monthlyEur: round2(this.ronToEur(monthlyRon)), daysLeft, discountPct: c.discountPct };
    },
    // activează abonamentul (după plata simulată / mod local; pe server real se face din verify Stripe)
    activateVip(locationIds) {
      const u = this.currentUser(); if (!u) return { ok: false, error: "Neautentificat." };
      const c = CONFIG.vip;
      let ids = Array.isArray(locationIds) ? locationIds.filter(Boolean) : [];
      // dacă nu s-au trimis locații, înscrie toate locațiile aprobate (min. implicit)
      if (!ids.length) ids = this.approvedLocationsOfOwner(u.id).map(l => l.id);
      ids = [...new Set(ids)];
      const now = Date.now();
      const prevUntil = (u.vip && u.vip.until && u.vip.until > now) ? u.vip.until : now;
      u.vip = { active: true, since: (u.vip && u.vip.since) || now, until: prevUntil + c.periodDays * 86400000, locationIds: ids, locations: ids.length, monthlyRon: this.vipMonthlyRon(Math.max(1, ids.length)), lastPaymentAt: now };
      this.updateUser(u.id, { vip: u.vip });
      return { ok: true, vip: u.vip };
    },
    // adaugă/scoate locații din abonamentul VIP activ
    async setVipLocations(ids) {
      const u = this.currentUser(); if (!u) return { ok: false, error: "Neautentificat." };
      if (!this.isVipActive(u)) return { ok: false, error: "Abonamentul VIP nu este activ." };
      const clean = [...new Set((Array.isArray(ids) ? ids : []).filter(Boolean))];
      if (!clean.length) return { ok: false, error: "Selectează cel puțin o locație." };
      u.vip = { ...u.vip, locationIds: clean, locations: clean.length, monthlyRon: this.vipMonthlyRon(Math.max(1, clean.length)) };
      this.updateUser(u.id, { vip: u.vip });
      if (MODE === "api") { try { await this.flush(); } catch (e) {} }
      return { ok: true, vip: u.vip };
    },
    async payVipCheckout(locationIds) {
      if (MODE !== "api") return { ok: false, error: "demo" };
      try { return await apiPOST("/api/pay/vip/checkout", { locationIds }); }
      catch (e) { return { ok: false, error: String(e.message || e) }; }
    },
    vipMembers() { return (db.users || []).filter(u => u.vip && u.vip.active).map(u => ({ id: u.id, name: u.name, email: u.email, ...this.vipInfo(u) })); },

    // ---- Investiție în sistemul de închiriere lenjerii ----
    investmentConfig() {
      const c = CONFIG.investment;
      const items = Array.isArray(c.budgetItems) ? c.budgetItems : [];
      // capitalul de demarare = suma liniilor din bugetul detaliat (sursă unică de adevăr)
      const startupEur = items.length
        ? items.reduce((s, i) => s + (Number(i.eur) || 0), 0)
        : (Number(c.startupEur) || 0);
      // ținta de strâns = capitalul de demarare + marja de siguranță (recalculată, ca să rămână coerentă)
      const budgetEur = Math.round(startupEur * (1 + (Number(c.marginPct) || 0) / 100)) || c.budgetEur;
      return { ...c, startupEur, budgetEur, budgetItems: items };
    },
    // liniile bugetului de demarare + total + țintă (pentru statistici și planul de business)
    budgetBreakdown() {
      const c = this.investmentConfig();
      return { items: c.budgetItems, startupEur: c.startupEur, marginPct: c.marginPct, budgetEur: c.budgetEur };
    },
    // statistici pentru investitori: câte persoane s-au înscris la închiriere, câte lenjerii, evoluția lunară
    rentalStats() {
      const leads = db.rentalLeads || [];
      const people = leads.length;
      const linens = leads.reduce((s, l) => s + (Number(l.locations) || 0), 0);
      const byMonth = {};
      leads.forEach(l => {
        const d = new Date(l.createdAt || Date.now());
        const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        if (!byMonth[key]) byMonth[key] = { month: key, people: 0, linens: 0 };
        byMonth[key].people += 1; byMonth[key].linens += (Number(l.locations) || 0);
      });
      const monthly = Object.values(byMonth).sort((a, b) => a.month.localeCompare(b.month));
      // listă ANONIMIZATĂ a cererilor (doar nr. lenjerii + data), pentru investitori
      const requests = leads.map(l => ({ locations: Number(l.locations) || 0, createdAt: l.createdAt || 0 }))
        .sort((a, b) => b.createdAt - a.createdAt);
      return { people, linens, monthly, requests };
    },
    // admin: importă/adaugă solicitanți (leads) în baza de date (ex. din CSV)
    adminAddRentalLeads(leads) {
      if (!Array.isArray(leads) || !leads.length) return { ok: false, error: "Niciun rând valid." };
      if (!db.rentalLeads) db.rentalLeads = [];
      leads.forEach(l => db.rentalLeads.push({
        id: uid("lead"), name: l.name || "—", phone: l.phone || "", email: l.email || "",
        locations: Number(l.locations) || 0, note: l.note || "", city: l.city || "", address: l.address || "",
        source: l.source || "import", createdAt: l.createdAt || Date.now(),
      }));
      save(db); return { ok: true, added: leads.length };
    },
    isInvestor(u) { return !!(u && u.investment && u.investment.active); },
    // comisionul total încasat de platformă din serviciile de spălătorie (lenjerie spălată & returnată)
    laundryCommissionTotal() {
      const pct = this.commissionPct();
      let ron = 0;
      (db.requests || []).forEach(r => {
        // lenjerie preluată de un serviciu de lenjerie ȘI procesată (dus/luat/spălat)
        if (r.linens && r.linenExecutorId && r.linenDone) ron += (Number(r.linenSets) || 0) * CONFIG.linenSetPriceRon * pct / 100;
      });
      return round2(this.ronToEur(ron));
    },
    // venitul din chiria lenjeriei (întreg tariful de lenjerie generat de seturile procesate)
    linenRentalRevenue() {
      let ron = 0;
      (db.requests || []).forEach(r => {
        if (r.linens && r.linenExecutorId && r.linenDone) ron += (Number(r.linenSets) || 0) * CONFIG.linenSetPriceRon;
      });
      return round2(this.ronToEur(ron));
    },
    investorPoolEur() {
      const c = CONFIG.investment;
      return round2(this.laundryCommissionTotal() * (c.laundryCommissionSharePct / 100) + this.linenRentalRevenue() * (c.linenRentalSharePct / 100));
    },
    investmentInfo(u) {
      const c = this.investmentConfig();
      const inv = (u && u.investment) || null;
      const totalPledged = this.totalInvested();
      const pool = this.investorPoolEur();
      const myShare = (totalPledged > 0 && inv && inv.active) ? round2(pool * ((Number(inv.amountEur) || 0) / totalPledged)) : 0;
      return {
        active: this.isInvestor(u),
        amountEur: inv ? (Number(inv.amountEur) || 0) : 0,
        since: inv ? inv.since : null,
        status: inv ? (inv.status || "guarantee") : null,
        sharePct: c.laundryCommissionSharePct, rentalSharePct: c.linenRentalSharePct,
        budgetEur: c.budgetEur, startupEur: c.startupEur, marginPct: c.marginPct, minEur: c.minEur,
        totalPledged, targetReached: totalPledged >= c.budgetEur,
        laundryCommissionTotal: this.laundryCommissionTotal(), linenRentalTotal: this.linenRentalRevenue(),
        investorPool: pool, myShare,
      };
    },
    // total garanții depuse (angajamente), NU bani colectați
    totalInvested() { return round2((db.users || []).reduce((s, u) => s + (u.investment && u.investment.active ? (Number(u.investment.amountEur) || 0) : 0), 0)); },
    investors() {
      return (db.users || []).filter(u => u.role === "investitor" || (u.investment && u.investment.active))
        .map(u => ({ id: u.id, name: u.name, email: u.email, phone: u.phone || "",
          amountEur: (u.investment && u.investment.active) ? (Number(u.investment.amountEur) || 0) : 0,
          active: this.isInvestor(u), status: u.investment ? (u.investment.status || "guarantee") : null,
          since: u.investment ? u.investment.since : null }))
        .sort((a, b) => b.amountEur - a.amountEur);
    },
    // depune garanția bancară (angajament) — banii se colectează abia când se atinge ținta
    activateInvestment(amountEur) {
      const u = this.currentUser(); if (!u) return { ok: false, error: "Neautentificat." };
      const amt = round2(Number(amountEur) || 0);
      if (amt < CONFIG.investment.minEur) return { ok: false, error: "Suma minimă a garanției este " + CONFIG.investment.minEur + " €." };
      const now = Date.now();
      const prev = (u.investment && u.investment.active) ? (Number(u.investment.amountEur) || 0) : 0;
      u.investment = { active: true, status: "guarantee", amountEur: round2(prev + amt), since: (u.investment && u.investment.since) || now, lastPledgeAt: now };
      this.updateUser(u.id, { investment: u.investment });
      return { ok: true, investment: u.investment };
    },
    // admin: activează (marchează plătit) / revocă VIP pentru un cont, fără Stripe
    async adminSetVip(userId, active, locationIds) {
      if (MODE === "api") {
        let r; try { r = await apiPOST("/api/vip/admin-set", { userId, active, locationIds }); } catch (e) { return { ok: false, error: "Eroare de rețea." }; }
        if (r && r.ok) { try { await refreshState(); } catch (e) {} }
        return r || { ok: false };
      }
      const u = this.userById(userId); if (!u) return { ok: false, error: "Cont inexistent." };
      if (active === false) { if (u.vip) u.vip.active = false; save(db); return { ok: true }; }
      const c = CONFIG.vip;
      let ids = Array.isArray(locationIds) && locationIds.length ? locationIds : this.approvedLocationsOfOwner(userId).map(l => l.id);
      ids = [...new Set(ids)];
      const now = Date.now();
      const prevUntil = (u.vip && u.vip.until && u.vip.until > now) ? u.vip.until : now;
      u.vip = { active: true, since: (u.vip && u.vip.since) || now, until: prevUntil + c.periodDays * 86400000, locationIds: ids, locations: ids.length, monthlyRon: this.vipMonthlyRon(Math.max(1, ids.length)), grantedByAdmin: true };
      save(db); return { ok: true };
    },

    // ---- Consumabile (catalog gestionat de admin) ----
    products() { return (db.products || []).slice(); },
    activeProducts() { return this.products().filter(p => p.active); },
    productById(id) { return (db.products || []).find(p => p.id === id) || null; },
    addProduct({ name, unit, priceRon, lowAt }) {
      if (!name || !(Number(priceRon) >= 0)) return { ok: false, error: "Completează denumirea și prețul." };
      if (!db.products) db.products = [];
      const p = { id: uid("p"), name, unit: unit || "buc", priceRon: Number(priceRon), lowAt: Number(lowAt) >= 0 ? Number(lowAt) : CONFIG.lowStockDefault, active: true };
      db.products.push(p); save(db); return { ok: true, p };
    },
    lowAtOf(product) { return (product && Number(product.lowAt) >= 0) ? Number(product.lowAt) : CONFIG.lowStockDefault; },
    updateProduct(id, patch) { const p = this.productById(id); if (!p) return; Object.assign(p, patch); save(db); return p; },
    setProductActive(id, active) { const p = this.productById(id); if (!p) return; p.active = !!active; save(db); return p; },
    // lista de cumpărături dintr-o solicitare (produs + cantitate + preț)
    consumablesList(req) {
      return (req.consumables || []).map(c => {
        const p = this.productById(c.productId);
        return p ? { name: p.name, unit: p.unit, qty: c.qty, priceRon: p.priceRon, lineRon: p.priceRon * c.qty } : null;
      }).filter(Boolean);
    },

    // ---- Stoc Agenți Cleaning (bază comună admin ↔ Agent Cleaning) ----
    executors() { return db.users.filter(u => u.role === "executant"); },
    // stocul unui Agent Cleaning, pentru toate produsele active
    stockList(executorId) {
      const u = this.userById(executorId); const stock = (u && u.stock) || {};
      return this.activeProducts().map(p => {
        const qty = Number(stock[p.id] || 0), low = this.lowAtOf(p);
        return { productId: p.id, name: p.name, unit: p.unit, qty, low, isLow: qty <= low };
      });
    },
    stockQty(executorId, productId) {
      const u = this.userById(executorId); return Number((u && u.stock && u.stock[productId]) || 0);
    },
    // valoarea stocului curent (lei) — plătită de Agent Cleaning (el cumpără produsele)
    stockValueRon(executorId) {
      return this.stockList(executorId).reduce((s, x) => {
        const p = this.productById(x.productId); return s + (p ? p.priceRon * x.qty : 0);
      }, 0);
    },
    // alerte de stoc scăzut către admin: Agent Cleaning × produs unde stocul ≤ pragul produsului
    stockAlerts() {
      const alerts = [];
      this.executors().forEach(ex => {
        this.activeProducts().forEach(p => {
          const qty = this.stockQty(ex.id, p.id);
          const low = this.lowAtOf(p);
          if (qty <= low) alerts.push({ executorId: ex.id, executorName: ex.name, productId: p.id, productName: p.name, qty, low });
        });
      });
      return alerts;
    },
    // adminul reaprovizionează stocul unui Agent Cleaning (+cantitate)
    supplyStock(executorId, productId, qty) {
      const u = this.userById(executorId); if (!u) return { ok: false };
      if (!u.stock) u.stock = {};
      u.stock[productId] = Number(u.stock[productId] || 0) + Number(qty || 0);
      u.stockSuppliedAt = Date.now();
      save(db); return { ok: true, qty: u.stock[productId] };
    },
    // scade din stoc consumabilele folosite la o lucrare
    deductStock(executorId, consumables) {
      const u = this.userById(executorId); if (!u || !consumables) return;
      if (!u.stock) u.stock = {};
      consumables.forEach(c => {
        u.stock[c.productId] = Math.max(0, Number(u.stock[c.productId] || 0) - Number(c.qty || 0));
      });
      save(db);
    },

    // ---- Recenzii (solicitant → Agent Cleaning, 1–5 stele) ----
    reviews() { return (db.reviews || []).slice(); },
    reviewsForExecutor(execId) { return this.reviews().filter(r => r.toId === execId).sort((a, b) => b.createdAt - a.createdAt); },
    ratingOf(execId) {
      const rs = this.reviews().filter(r => r.toId === execId);
      if (!rs.length) return { avg: 0, count: 0 };
      const sum = rs.reduce((s, r) => s + Number(r.stars || 0), 0);
      return { avg: Math.round((sum / rs.length) * 10) / 10, count: rs.length };
    },
    reviewByRequest(requestId, fromId) {
      return this.reviews().find(r => r.requestId === requestId && r.fromId === fromId) || null;
    },
    // câte solicitări (necanulate) are un solicitant într-o lună „AAAA-LL"
    requestsInMonth(requesterId, ym) {
      return db.requests.filter(r => r.requesterId === requesterId && r.status !== STATUS.ANULAT && String(r.date || "").slice(0, 7) === ym).length;
    },
    // eligibilitate recenzie: ≥ reviewMinPerMonth solicitări în luna lucrării
    canReview(requesterId, req) {
      const ym = String((req && req.date) || "").slice(0, 7);
      const count = this.requestsInMonth(requesterId, ym);
      const need = CONFIG.reviewMinPerMonth;
      return { ok: count >= need, count, need, ym };
    },
    addReview({ requestId, fromId, toId, stars, comment }) {
      if (!toId || !stars) return { ok: false, error: "Alege numărul de stele." };
      if (requestId && this.reviewByRequest(requestId, fromId)) return { ok: false, error: "Ai evaluat deja această lucrare." };
      const req = requestId ? this.requestById(requestId) : null;
      if (req) {
        const el = this.canReview(fromId, req);
        if (!el.ok) return { ok: false, error: `Poți lăsa recenzii doar cu minim ${el.need} solicitări în luna respectivă (ai ${el.count}).` };
      }
      if (!db.reviews) db.reviews = [];
      const rev = { id: uid("rev"), requestId: requestId || null, fromId, toId, stars: Number(stars), comment: comment || "", createdAt: Date.now() };
      db.reviews.push(rev); save(db); return { ok: true, rev };
    },

    // ---- Solicitări ----
    // ---- Blog (editabil din admin; fiecare articol are slug propriu → URL /blog/<slug>) ----
    _slugify(s) {
      return String(s || "").toLowerCase()
        .replace(/ă|â/g, "a").replace(/î/g, "i").replace(/ș|ş/g, "s").replace(/ț|ţ/g, "t")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "articol";
    },
    _uniqueSlug(title, ignoreId) {
      const base = this._slugify(title); let slug = base, i = 2;
      const list = db.blog || [];
      while (list.some(p => p.slug === slug && p.id !== ignoreId)) slug = base + "-" + (i++);
      return slug;
    },
    // Injectează articolele de start dacă starea de pe server nu are încă blog.
    _ensureBlog() { if (!Array.isArray(db.blog)) { db.blog = STARTER_BLOG(); save(db); } return db.blog; },
    blogAll() { return this._ensureBlog().slice().sort((a, b) => (b.publishAt || b.createdAt || 0) - (a.publishAt || a.createdAt || 0)); },
    // Public: publicat ȘI (fără programare SAU momentul programat a trecut).
    blogPublished() { return this.blogAll().filter(p => p.published !== false && (!p.publishAt || p.publishAt <= Date.now())); },
    // Programat = publicat, dar cu data de publicare în viitor.
    blogIsScheduled(p) { return p && p.published !== false && p.publishAt && p.publishAt > Date.now(); },
    // Data efectivă (programată sau de creare) — pentru afișare și SEO.
    blogEffectiveDate(p) { return (p && (p.publishAt || p.createdAt)) || Date.now(); },
    blogBySlug(slug) { return this._ensureBlog().find(p => p.slug === slug) || null; },
    blogById(id) { return this._ensureBlog().find(p => p.id === id) || null; },
    // FAQ pentru AEO/GEO: perechi întrebare/răspuns, folosite și în JSON-LD FAQPage.
    _normFaq(faq) {
      if (!Array.isArray(faq)) return [];
      return faq.map(x => ({ q: String((x && x.q) || "").trim(), a: String((x && x.a) || "").trim() }))
        .filter(x => x.q && x.a).slice(0, 12);
    },
    // Normalizează o dată de programare (ms, ISO sau "YYYY-MM-DDTHH:MM") → ms sau null.
    _normTs(v) {
      if (v == null || v === "") return null;
      const t = (typeof v === "number") ? v : Date.parse(v);
      return isFinite(t) ? t : null;
    },
    addBlogPost(data) {
      this._ensureBlog();
      const title = String(data.title || "").trim() || "Articol fără titlu";
      const post = {
        id: uid("blog"), slug: this._uniqueSlug(title), title,
        excerpt: String(data.excerpt || "").trim(),
        body: String(data.body || "").trim(),
        cover: data.cover || "🧽",
        author: String(data.author || "Sleep & Go Cleaning").trim(),
        published: data.published !== false,
        // ── SEO / AEO / GEO ──
        seoTitle: String(data.seoTitle || "").trim(),
        metaDescription: String(data.metaDescription || "").trim(),
        keywords: String(data.keywords || "").trim(),
        faq: this._normFaq(data.faq),
        publishAt: this._normTs(data.publishAt),   // null = imediat; viitor = programat
        createdAt: Date.now(), updatedAt: Date.now(),
      };
      db.blog.push(post); save(db); return post;
    },
    updateBlogPost(id, data) {
      const p = this.blogById(id); if (!p) return null;
      if (data.title != null) { p.title = String(data.title).trim() || p.title; p.slug = this._uniqueSlug(p.title, id); }
      if (data.excerpt != null) p.excerpt = String(data.excerpt).trim();
      if (data.body != null) p.body = String(data.body).trim();
      if (data.cover != null) p.cover = data.cover;
      if (data.author != null) p.author = String(data.author).trim();
      if (data.published != null) p.published = !!data.published;
      if (data.seoTitle != null) p.seoTitle = String(data.seoTitle).trim();
      if (data.metaDescription != null) p.metaDescription = String(data.metaDescription).trim();
      if (data.keywords != null) p.keywords = String(data.keywords).trim();
      if (data.faq != null) p.faq = this._normFaq(data.faq);
      if ("publishAt" in data) p.publishAt = this._normTs(data.publishAt);
      p.updatedAt = Date.now(); save(db); return p;
    },
    deleteBlogPost(id) { this._ensureBlog(); db.blog = db.blog.filter(p => p.id !== id); save(db); },

    requests() { return db.requests.slice().sort((a, b) => b.createdAt - a.createdAt); },
    requestById(id) { return db.requests.find(r => r.id === id) || null; },

    // Termen de trimitere = ora 21:00 cu o zi înainte de data curățeniei.
    bookingDeadlineTs(dateStr) {
      const d = new Date((dateStr || "") + "T00:00:00");
      if (isNaN(d.getTime())) return NaN;
      d.setDate(d.getDate() - (CONFIG.bookingLeadDays || 1));
      d.setHours(CONFIG.bookingLeadHour || 21, 0, 0, 0);
      return d.getTime();
    },
    // cea mai apropiată dată pentru care termenul (21:00 cu o zi înainte) nu a trecut încă
    minBookableDate() {
      const base = new Date(); base.setHours(0, 0, 0, 0);
      for (let i = 1; i <= 60; i++) {
        const c = new Date(base); c.setDate(base.getDate() + i);
        const iso = `${c.getFullYear()}-${String(c.getMonth() + 1).padStart(2, "0")}-${String(c.getDate()).padStart(2, "0")}`;
        if (Date.now() < this.bookingDeadlineTs(iso)) return iso;
      }
      return "";
    },
    createRequest(data) {
      // Termen de trimitere: urgent = minim 5h înainte de începere; altfel = 21:00 cu o zi înainte.
      if (data.urgent) {
        const startTs = new Date((data.date || "") + "T" + (data.startTime || "00:00") + ":00").getTime();
        if (!isFinite(startTs) || (startTs - Date.now()) < CONFIG.urgentMinLeadHours * 3600000)
          return { ok: false, error: `Solicitarea de urgență trebuie plasată cu minim ${CONFIG.urgentMinLeadHours} ore înainte de ora de începere.` };
      } else {
        const dl = this.bookingDeadlineTs(data.date);
        if (isFinite(dl) && Date.now() >= dl)
          return { ok: false, error: `Solicitările pentru ziua aleasă se pot trimite până la ora ${CONFIG.bookingLeadHour}:00 cu ${(CONFIG.bookingLeadDays || 1) === 1 ? "o zi" : (CONFIG.bookingLeadDays + " zile")} înainte. Alege o dată mai îndepărtată sau folosește opțiunea de urgență.` };
      }
      // suprafața și locația provin dintr-o locație APROBATĂ (cu document validat de admin)
      const loc = this.locationById(data.locationId);
      if (!loc || loc.status !== "approved") return { ok: false, error: "Alege o locație aprobată." };
      const slot = validateSlot(data.startTime, data.endTime);
      if (!slot.ok) return { ok: false, error: slot.error };
      // discount: VIP (10% doar pt. locațiile înscrise în abonament) SAU ofertă de lansare — nu se cumulează
      const requester = this.currentUser();
      let vipDiscountPct = 0, launchDiscountPct = 0;
      if (this.isVipLocation(requester, loc.id)) {
        vipDiscountPct = (CONFIG.vip || {}).discountPct || 0;
      } else {
        const lo = CONFIG.launchOffer || {};
        if (lo.active) {
          const granted = db.requests.filter(r => (Number(r.launchDiscountPct) || 0) > 0).length;
          if (granted < (lo.maxActions || 0)) launchDiscountPct = lo.discountPct || 0;
        }
      }
      const req = {
        id: uid("r"),
        requesterId: db.session,
        launchDiscountPct,   // discount ofertă de lansare (0 dacă nu se mai aplică)
        vipDiscountPct,      // discount VIP (10% dacă are abonament activ)
        executorId: null,
        locationId: loc.id,
        area: loc.area,
        address: loc.address,
        mapsUrl: loc.mapsUrl || "",   // snapshot link Google Maps
        sqm: Number(loc.sqm),      // exact din documentul aprobat
        linens: !!data.linens,     // cu lenjerie (tarif) / fără (lenjeria proprie a clientului)
        linenSets: Number(data.linenSets || 0),
        urgent: !!data.urgent,           // opțiune urgență (+40%): plasată cu minim 5h înainte de începere
        refundable: !!data.refundable && !data.urgent,   // rambursabilă (+20%) — EXCLUSIVĂ cu urgența
        refundedAt: null,
        // serviciul de lenjerie poate fi preluat separat de un Agent Cleaning
        linenExecutorId: null, linenDone: false, linenPayoutStatus: "pending",
        date: data.date,
        startTime: data.startTime,
        endTime: data.endTime,
        notes: data.notes || "",
        status: STATUS.NOU,
        createdAt: Date.now(),
        paidAt: null,
        payoutStatus: "pending",   // pending → released (după finalizarea curățeniei)
        releasedAt: null,
        readyNotified: false, readyAt: null,  // Agentul Cleaning a anunțat că locația e gata pentru oaspeți
        workStartedAt: null, workFinishedAt: null,  // pontaj: început/terminat efectiv de Agent Cleaning
        applicants: [],   // Agenți Cleaning înscriși la curățenie; solicitantul alege unul
        // consumabile cerute de solicitant: [{productId, qty}] — Agentul Cleaning le cumpără
        consumables: (data.consumables || []).filter(c => Number(c.qty) > 0).map(c => ({ productId: c.productId, qty: Number(c.qty) })),
      };
      db.requests.push(req); save(db); return { ok: true, req };
    },

    payRequest(id) {
      const r = this.requestById(id); if (!r) return;
      r.status = STATUS.PLATIT; r.paidAt = Date.now(); save(db); return r;
    },

    // Agentul Cleaning se ÎNSCRIE la o solicitare (nu o preia direct — solicitantul alege)
    applyToRequest(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.status !== STATUS.PLATIT || r.executorId) return { ok: false };
      if (!this.areasOf(this.userById(executorId)).includes(r.area)) return { ok: false };
      if (!r.applicants) r.applicants = [];
      if (!r.applicants.includes(executorId)) r.applicants.push(executorId);
      save(db); return { ok: true, r };
    },
    withdrawApplication(id, executorId) {
      const r = this.requestById(id); if (!r || !r.applicants) return;
      r.applicants = r.applicants.filter(x => x !== executorId); save(db); return r;
    },
    hasApplied(id, executorId) {
      const r = this.requestById(id); return !!(r && r.applicants && r.applicants.includes(executorId));
    },
    applicantsOf(id) {
      const r = this.requestById(id); return (r && r.applicants ? r.applicants : []).map(eid => this.userById(eid)).filter(Boolean);
    },
    // solicitantul ALEGE un Agent Cleaning dintre cei înscriși
    chooseExecutor(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.status !== STATUS.PLATIT || r.executorId) return { ok: false };
      if (!r.applicants || !r.applicants.includes(executorId)) return { ok: false, error: "Agentul Cleaning nu mai este disponibil." };
      r.executorId = executorId; r.status = STATUS.ACCEPTAT;
      // circuit lenjerie: agentul aduce seturile curate din stocul lui în locație (📦 → 🏠)
      this.moveLinenForRequest(r, "atExecutor", "atLocation");
      save(db); return { ok: true, r };
    },
    setStatus(id, status) {
      const r = this.requestById(id); if (!r) return;
      r.status = status;
      // la finalizare, plata Agentului Cleaning este eliberată din suma încasată în avans
      if (status === STATUS.FINALIZAT && r.payoutStatus !== "released") {
        r.payoutStatus = "released"; r.releasedAt = Date.now();
      }
      save(db); return r;
    },
    cancelRequest(id) { return this.setStatus(id, STATUS.ANULAT); },

    // ---- Rambursare (opțiunea rambursabilă +20%) ----
    // eligibilitate: opțiune activă, lucrarea neîncepută (plătită/acceptată), înainte de 9:00 în ziua curățeniei
    refundDeadlineTs(req) {
      const hh = String(CONFIG.refundDeadlineHour).padStart(2, "0");
      const d = new Date((req && req.date ? req.date : "") + "T" + hh + ":00:00");
      return d.getTime();
    },
    canRefund(req) {
      if (!req || !req.refundable) return { ok: false, reason: "no_option" };
      if (req.refundedAt) return { ok: false, reason: "already" };
      if (![STATUS.PLATIT, STATUS.ACCEPTAT].includes(req.status)) return { ok: false, reason: "started" };
      const dl = this.refundDeadlineTs(req);
      if (!(isFinite(dl) && Date.now() < dl)) return { ok: false, reason: "deadline" };
      return { ok: true, deadline: dl };
    },
    refundInfo(req) {
      const p = priceOf(req);
      const retainPct = CONFIG.refundRetainPct;
      const refundEur = round2(p.total * (100 - retainPct) / 100);
      const retainedEur = round2(p.total - refundEur);
      return { totalEur: p.total, retainPct, refundEur, retainedEur };
    },
    _applyRefund(r) {
      const info = this.refundInfo(r);
      // dacă un Agent Cleaning fusese ales, lenjeria se întoarce în stocul lui (🏠 → 📦)
      if (r.status === STATUS.ACCEPTAT) this.moveLinenForRequest(r, "atLocation", "atExecutor");
      r.status = STATUS.ANULAT; r.refundedAt = Date.now();
      r.refundEur = info.refundEur; r.refundRetainedEur = info.retainedEur; r.refundRetainPct = info.retainPct;
      save(db);
      return { refundEur: info.refundEur, retainedEur: info.retainedEur };
    },
    async requestRefund(id) {
      const r = this.requestById(id); if (!r) return { ok: false, error: "Solicitare inexistentă." };
      const el = this.canRefund(r);
      if (!el.ok) {
        const errs = {
          no_option: "Solicitarea nu are opțiunea rambursabilă.",
          already: "Solicitarea a fost deja rambursată.",
          started: "Rambursarea nu mai e posibilă (lucrarea a început sau e finalizată).",
          deadline: `Termenul de rambursare (ora ${CONFIG.refundDeadlineHour}:00 în ziua curățeniei) a trecut.`,
        };
        return { ok: false, error: errs[el.reason] || "Rambursare indisponibilă." };
      }
      if (MODE === "api") {
        await this.flush();
        let resp;
        try { resp = await apiPOST("/api/pay/refund", { reqId: id }); }
        catch (e) { return { ok: false, error: "Eroare de rețea la rambursare." }; }
        if (!resp || !resp.ok) return { ok: false, error: (resp && resp.error) || "Rambursarea a eșuat." };
        try { await refreshState(); } catch (e) {}
        return { ok: true, refundEur: resp.refundEur, retainedEur: resp.retainedEur };
      }
      return { ok: true, ...this._applyRefund(r) };
    },

    // ---- Video înainte/după (dovadă pentru despăgubiri) ----
    _vidField(kind) { return kind === "after" ? "videoAfter" : "videoBefore"; },
    hasVideo(req, kind) { return !!(req && req[this._vidField(kind)]); },
    // URL/sursă pentru redare: pe server = endpoint; local (demo) = data URL stocat pe solicitare
    videoUrl(reqId, kind) {
      if (MODE === "api") return "/api/video/" + encodeURIComponent(reqId) + "/" + kind;
      const r = this.requestById(reqId); const v = r && r[this._vidField(kind)];
      return (v && v.dataUrl) ? v.dataUrl : null;
    },
    async uploadVideo(reqId, kind, dataUrl) {
      if (kind !== "before" && kind !== "after") return { ok: false, error: "Tip invalid." };
      if (MODE === "api") {
        let resp;
        try { resp = await apiPOST("/api/video/" + encodeURIComponent(reqId) + "/" + kind, { dataUrl }); }
        catch (e) { return { ok: false, error: "Eroare de rețea la încărcarea video." }; }
        if (!resp || !resp.ok) return { ok: false, error: (resp && resp.error) || "Încărcarea a eșuat." };
        try { await refreshState(); } catch (e) {}
        return { ok: true };
      }
      // local/demo: stochează pe solicitare (doar pentru testare)
      const r = this.requestById(reqId); if (!r) return { ok: false, error: "Solicitare inexistentă." };
      r[this._vidField(kind)] = { at: Date.now(), by: db.session, dataUrl };
      save(db); return { ok: true };
    },
    // Agentul Cleaning PORNEȘTE lucrul → status în progres + pontaj (ora de început)
    startWork(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.executorId !== executorId) return { ok: false };
      r.status = STATUS.IN_PROGRES;
      if (!r.workStartedAt) r.workStartedAt = Date.now();
      save(db); return { ok: true, r };
    },
    // Agentul Cleaning finalizează curățenia ȘI anunță clientul că locația e gata pentru oaspeți
    markReady(id) {
      const r = this.requestById(id); if (!r) return;
      this.setStatus(id, STATUS.FINALIZAT);   // finalizează + eliberează plata
      try { r.commissionEur = breakdown(r).commission; } catch (e) {}  // pt. calculul recomandărilor (10% din comision)
      r.readyNotified = true; r.readyAt = Date.now();
      r.workFinishedAt = Date.now();          // pontaj: ora de terminare
      if (!r.workStartedAt) r.workStartedAt = r.workFinishedAt;  // fallback dacă n-a apăsat «Începe lucrul»
      // scade consumabilele folosite din stocul Agentului Cleaning de curățenie
      if (r.executorId && r.consumables && r.consumables.length) this.deductStock(r.executorId, r.consumables);
      // circuit lenjerie: lenjeria folosită pleacă la spălat (🏠 → 🧺)
      this.moveLinenForRequest(r, "atLocation", "atLaundry");
      save(db); return r;
    },
    // ---- Pontaj Agent Cleaning (statistici de timp) ----
    workSessionsOf(executorId) {
      return this.requests()
        .filter(r => r.executorId === executorId && r.workStartedAt)
        .map(r => ({
          id: r.id, address: r.address, area: r.area, date: r.date,
          startedAt: r.workStartedAt, finishedAt: r.workFinishedAt || null,
          minutes: r.workFinishedAt ? Math.max(0, Math.round((r.workFinishedAt - r.workStartedAt) / 60000)) : null,
          inProgress: !r.workFinishedAt,
        }))
        .sort((a, b) => b.startedAt - a.startedAt);
    },
    workStatsOf(executorId) {
      const done = this.workSessionsOf(executorId).filter(s => s.minutes != null);
      const totalMinutes = done.reduce((a, s) => a + s.minutes, 0);
      return { count: done.length, totalMinutes, avgMinutes: done.length ? Math.round(totalMinutes / done.length) : 0 };
    },
    // pentru admin: toate sesiunile de lucru, cu numele Agentului Cleaning
    allWorkSessions() {
      return this.requests()
        .filter(r => r.executorId && r.workStartedAt)
        .map(r => {
          const ex = this.userById(r.executorId);
          return {
            id: r.id, executorId: r.executorId, executorName: ex ? ex.name : "?",
            address: r.address, area: r.area, date: r.date,
            startedAt: r.workStartedAt, finishedAt: r.workFinishedAt || null,
            minutes: r.workFinishedAt ? Math.max(0, Math.round((r.workFinishedAt - r.workStartedAt) / 60000)) : null,
            inProgress: !r.workFinishedAt,
          };
        })
        .sort((a, b) => b.startedAt - a.startedAt);
    },

    // curățenii disponibile: plătite, fără Agent Cleaning de curățenie, în zona lui
    availableForExecutor(executor) {
      const areas = this.areasOf(executor);
      return this.requests().filter(r =>
        r.status === STATUS.PLATIT && !r.executorId && areas.includes(r.area));
    },
    // solicitări de curățenie la care se pot înscrie Agenții Cleaning din zonă (nu sunt deja atribuite mie)
    openForExecutor(executor) {
      return this.availableForExecutor(executor)
        .filter(r => r.executorId !== executor.id)
        .sort((a, b) => b.createdAt - a.createdAt);
    },
    // lucrările mele: unde sunt Agent Cleaning de curățenie SAU de lenjerie
    jobsOfExecutor(executorId) {
      return this.requests().filter(r => r.executorId === executorId || r.linenExecutorId === executorId);
    },
    requestsOfRequester(requesterId) {
      return this.requests().filter(r => r.requesterId === requesterId);
    },

    // ---- Locații (cu document + aprobare admin) ----
    locations() { return (db.locations || []).slice().sort((a, b) => b.createdAt - a.createdAt); },
    locationById(id) { return (db.locations || []).find(l => l.id === id) || null; },
    locationsOfOwner(ownerId) { return this.locations().filter(l => l.ownerId === ownerId); },
    approvedLocationsOfOwner(ownerId) { return this.locations().filter(l => l.ownerId === ownerId && l.status === "approved"); },
    // locații aprobate ȘI cu Agent Cleaning activ în zonă (utilizabile pentru solicitări)
    usableLocationsOfOwner(ownerId) { return this.approvedLocationsOfOwner(ownerId).filter(l => this.hasActiveExecutorInArea(l.area)); },
    pendingLocations() { return this.locations().filter(l => l.status === "pending"); },

    createLocation(data) {
      if (!data.name || !data.address || !data.sqm) return { ok: false, error: "Completează denumirea, adresa și suprafața." };
      if (!data.doc || !data.doc.name) return { ok: false, error: "Atașează dovada suprafeței (extras CF / contract / declarație pe propria răspundere)." };
      if (!data.mapsUrl) return { ok: false, error: "Adaugă linkul Google Maps al locației." };
      const ci = data.checkin || {};
      if (!ci.interfon || !ci.lockbox) return { ok: false, error: "Completează detaliile de check-in: cod interfon și cod lockbox / yală electrică." };
      const loc = {
        id: uid("loc"), ownerId: db.session,
        name: data.name, address: data.address, area: data.area,
        mapsUrl: data.mapsUrl,     // link Google Maps (obligatoriu) — vizibil Agentului Cleaning și serviciului de lenjerie
        listingUrl: data.listingUrl || "",   // link anunț Booking/Airbnb — cum trebuie să arate locația la final
        sqm: Number(data.sqm),
        // document unic: dovada dreptului asupra locației (extras CF / contract vânzare / închiriere), care confirmă și suprafața
        doc: { name: data.doc.name, type: data.doc.type || "", dataUrl: data.doc.dataUrl || null },
        checkin: { interfon: ci.interfon, lockbox: ci.lockbox, notes: ci.notes || "" },
        status: "pending", createdAt: Date.now(), reviewedAt: null, rejectReason: "",
      };
      if (!db.locations) db.locations = [];
      db.locations.push(loc); save(db); return { ok: true, loc };
    },
    approveLocation(id) {
      const l = this.locationById(id); if (!l) return;
      l.status = "approved"; l.reviewedAt = Date.now(); l.rejectReason = ""; save(db); return l;
    },
    rejectLocation(id, reason) {
      const l = this.locationById(id); if (!l) return;
      l.status = "rejected"; l.reviewedAt = Date.now(); l.rejectReason = reason || ""; save(db); return l;
    },

    // câștigurile unui executant: curățenie (unde e executorId) + lenjerie (unde e linenExecutorId)
    earningsOfExecutor(executorId) {
      let released = 0, pending = 0;
      this.requests().filter(r => r.status !== STATUS.ANULAT).forEach(r => {
        const b = breakdown(r);
        if (r.executorId === executorId) {
          // curățenie + 50% adaos consumabile — Agentul Cleaning de curățenie
          const part = b.cleaningPayout + b.consExecutantPayout;
          if (r.payoutStatus === "released") released += part; else pending += part;
        }
        if (r.linens && r.linenExecutorId === executorId) {
          if (r.linenPayoutStatus === "released") released += b.linenPayout; else pending += b.linenPayout;
        }
        // serviciul de lenjerie primește și partea de consumabile (achiziție + 30% adaos)
        if (r.linenExecutorId === executorId && b.consLaundryPayout > 0) {
          if (r.payoutStatus === "released") released += b.consLaundryPayout; else pending += b.consLaundryPayout;
        }
      });
      return { released: round2(released), pending: round2(pending), total: round2(released + pending) };
    },

    // ---- Statistici admin ----
    stats() {
      const rs = db.requests;
      const paid = rs.filter(r => r.status !== STATUS.NOU && r.status !== STATUS.ANULAT);
      let revenue = 0, commission = 0, payoutReleased = 0, payoutPending = 0;
      paid.forEach(r => {
        const b = breakdown(r);
        revenue += b.total;
        commission += b.commission;
        // partea de curățenie + 50% adaos consumabile — doar dacă e preluată de un Agent Cleaning
        if (r.executorId) {
          const part = b.cleaningPayout + b.consExecutantPayout;
          if (r.payoutStatus === "released") payoutReleased += part; else payoutPending += part;
        }
        // partea de lenjerie — doar dacă a fost preluată de un Agent Cleaning
        if (b.linenTaken) {
          if (r.linenPayoutStatus === "released") payoutReleased += b.linenPayout; else payoutPending += b.linenPayout;
        }
        // consumabile preluate de serviciul de lenjerie (achiziție + 30% adaos)
        if (b.consLaundryPayout > 0) {
          if (r.payoutStatus === "released") payoutReleased += b.consLaundryPayout; else payoutPending += b.consLaundryPayout;
        }
      });
      return {
        totalRequests: rs.length,
        active: rs.filter(r => [STATUS.PLATIT, STATUS.ACCEPTAT, STATUS.IN_PROGRES].includes(r.status)).length,
        completed: rs.filter(r => r.status === STATUS.FINALIZAT).length,
        revenue: round2(revenue),
        commission: round2(commission),
        payoutReleased: round2(payoutReleased),
        payoutPending: round2(payoutPending),
        commissionPct: commissionPct(),
        executors: db.users.filter(u => u.role === "executant").length,
        requesters: db.users.filter(u => u.role === "solicitant").length,
      };
    },

    resetDemo() { if (MODE === "api") return { ok: false, error: "Indisponibil pe server." }; db = seed(); save(db); return { ok: true }; },
  };

  window.Store = Store;
})();

<script>
/* =========================================================
   Sleep & Go Cleaning — UI / logica aplicației
   ========================================================= */
(function () {
  const app = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  const S = window.Store;
  const C = S.CONFIG;

  /* ---------- helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (html) => {
    const t = document.createElement("template"); t.innerHTML = html.trim();
    // return the whole fragment when the template has several top-level nodes,
    // otherwise return the single root element
    return t.content.childElementCount > 1 ? t.content : t.content.firstElementChild;
  };
  const money = (n) => `${C.currency}${Number(n).toFixed(2)}`;
  const leiOf = (eur) => Math.round((Number(eur) || 0) * S.ronPerEur());       // € → lei (curs admin)
  const moneyBoth = (eur) => `${money(eur)} · ≈ ${leiOf(eur)} lei`;             // afișare dublă € + lei
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  // ilustrație decorativă (SVG self-contained: bule + sclipici) cu un emoji tematic în centru
  function sparkleArt(emoji) {
    return `<div class="pv-art" aria-hidden="true">
      <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <circle cx="26" cy="42" r="13" fill="#bfe4fb"/>
        <circle cx="114" cy="30" r="7" fill="#d7defb"/>
        <circle cx="102" cy="106" r="10" fill="#cdeafb"/>
        <circle cx="40" cy="110" r="6" fill="#d7defb"/>
        <path d="M70 6 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 z" fill="#009FE3" opacity=".9"/>
        <path d="M120 68 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#3D66AE" opacity=".8"/>
      </svg>
      <span class="pv-art-emoji">${emoji}</span>
    </div>`;
  }

  // Secțiune reutilizabilă: cele 3 modalități de a trimite o solicitare + cum se plătește
  function bookingModesSection(soft) {
    return `<section class="h-section${soft === false ? "" : " soft"}" id="modalitati"><div class="wrap">
      <div class="h-section-head">
        <div class="eyebrow">📋 Cum rezervi</div>
        <h2>Modalități de solicitare</h2>
        <p>Alegi <strong>una</strong> dintre variante (sau niciuna) — nu se cumulează. Vezi termenul și costul fiecăreia.</p>
      </div>
      <div class="modes-grid">
        <div class="mode-card">
          <div class="mode-ico">🗓️</div>
          <h3>Standard</h3>
          <div class="mode-price">Preț normal</div>
          <p>Trimiți solicitarea <strong>până la ora ${C.bookingLeadHour}:00 cu o zi înainte</strong> de ziua curățeniei.</p>
        </div>
        <div class="mode-card feature">
          <div class="mode-ico">⚡</div>
          <h3>Urgentă</h3>
          <div class="mode-price">+${C.urgentSurchargePct}%</div>
          <p>Rezervi cu <strong>minim ${C.urgentMinLeadHours} ore înainte</strong> de ora de începere — chiar și în aceeași zi.</p>
        </div>
        <div class="mode-card">
          <div class="mode-ico">🔓</div>

      return;
    }
    const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";

    try { document.execCommand("copy"); toast("Link copiat!", "ok"); } catch (e) { toast(text, ""); }

  // citește o poză și o REDIMENSIONEAZĂ pe client (max ~600px, JPEG) → dataUrl mic,
  // ca să meargă și pozele mari de pe telefon fără a îngreuna baza de date.
  function readAvatarFile(file, cb) {
    if (!file) return;
    if (file.size > C.maxAvatarBytes) return toast("Poza e prea mare (max " + Math.round(C.maxAvatarBytes / 1024 / 1024) + " MB).", "err");
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 600;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        const scale = Math.min(1, MAX / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
        try {
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          cb(cv.toDataURL("image/jpeg", 0.82));
        } catch (e) { cb(reader.result); }
      };
      img.onerror = () => cb(reader.result);
      img.src = reader.result;
    };
    reader.onerror = () => toast("Nu s-a putut citi poza.", "err");
    reader.readAsDataURL(file);
  }

  // citește un document (poză/PDF): imaginile se comprimă (~1400px JPEG) ca să meargă și pozele de pe telefon
  function readDocFile(file, cb) {
    if (!file) return cb(null);
    if (file.size > C.maxDocBytes) { toast("Fișierul e prea mare (max " + Math.round(C.maxDocBytes / 1024 / 1024) + " MB).", "err"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      if (!/^image\//.test(file.type || "")) {
        // PDF etc. — nu se comprimă; limită mai mică ca să nu îngreuneze salvarea
        if (file.size > 5 * 1024 * 1024) { toast("PDF prea mare (max 5 MB). Fotografiază documentul pentru un fișier mai mic.", "err"); return; }
        return cb({ name: file.name, type: file.type || "", dataUrl: reader.result });
      }
      const img = new Image();
      img.onload = () => {
        const MAX = 1400;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        const s = Math.min(1, MAX / Math.max(w, h)); w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
        try {
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          cb({ name: file.name.replace(/\.(png|jpe?g|webp|heic|heif)$/i, "") + ".jpg", type: "image/jpeg", dataUrl: cv.toDataURL("image/jpeg", 0.85) });
        } catch (e) { cb({ name: file.name, type: file.type || "", dataUrl: reader.result }); }
      };
      img.onerror = () => cb({ name: file.name, type: file.type || "", dataUrl: reader.result });
      img.src = reader.result;
    };
    reader.onerror = () => toast("Nu s-a putut citi fișierul.", "err");
    reader.readAsDataURL(file);
  }

      <div class="btn-row"><button class="btn btn-block" id="raSave" disabled>Salvează și continuă</button></div>
    `);
    // nu se poate închide prin click în afară — poza e obligatorie
    document.getElementById("modalOverlay").onclick = null;
    let dataUrl = null;
    $("#raFile").onchange = (e) => readAvatarFile(e.target.files[0], (durl) => {
      if (!durl) return;
      dataUrl = durl;
      const pv = $("#raPreview"); if (pv) pv.innerHTML = `<img src="${dataUrl}" style="width:72px;height:72px;border-radius:50%;object-fit:cover" alt="">`;
      const sv = $("#raSave"); if (sv) sv.disabled = false;
    });
    $("#raSave").onclick = async () => {
      if (!dataUrl) return toast("Alege o poză de profil.", "err");
      S.setAvatar(u.id, dataUrl);
      await S.flush();
      toast("Poză de profil salvată.", "ok");
      closeModal(); renderApp();
    };
  }

    const readSim = () => {
      const linens = ($('input[name="simLinen"]:checked') || {}).value !== "without";

    function recalcSim() {
      if (!$("#simTotal")) return;
      const d = readSim();
      const wrap = $("#simSetsWrap"); if (wrap) wrap.style.display = d.linens ? "" : "none";
      const q = S.quote(d);
      const rows = [];
      rows.push(`<div class="sb-row"><span>Curățenie (${Number(d.sqm) || 0} m²)</span><span>${money(q.cleaning)}</span></div>`);
      if (q.peakPct) rows.push(`<div class="sb-row sur"><span>Adaos interval de vârf (+${q.peakPct}%)</span><span>+${money(q.peakAdd)}</span></div>`);
      if (q.surPct) rows.push(`<div class="sb-row sur"><span>Weekend / sărbătoare (+${q.surPct}%)</span><span>+${money(q.surcharge)}</span></div>`);
      if (q.linenIncluded && q.linenSets > 0) rows.push(`<div class="sb-row"><span>Lenjerie (${q.linenSets} × ${C.linenSetPriceRon} lei)</span><span>≈ ${money(q.linenEur)}</span></div>`);
      if (q.consumablesRon > 0) rows.push(`<div class="sb-row"><span>Consumabile (+${q.markupPct}% adaos)</span><span>≈ ${money(q.consumablesEur)}</span></div>`);
      if (q.urgentAdd) rows.push(`<div class="sb-row sur"><span>⚡ Urgență (+${q.urgentSurchargePct}%)</span><span>+${money(q.urgentAdd)}</span></div>`);
      if (q.refundableAdd) rows.push(`<div class="sb-row"><span>🔓 Rambursabil (+${q.refundableSurchargePct}%)</span><span>+${money(q.refundableAdd)}</span></div>`);
      if (q.launchDiscount) rows.push(`<div class="sb-row disc"><span>${q.discountKind === "vip" ? "👑 Reducere VIP" : "🎉 Ofertă lansare"} (−${q.launchDiscountPct}%)</span><span>−${money(q.launchDiscount)}</span></div>`);
      $("#simBreakdown").innerHTML = rows.join("");
      $("#simTotal").innerHTML = `${money(q.total)} <small style="font-size:14px;color:var(--h-muted);font-weight:600">≈ ${leiOf(q.total)} lei</small>`;
      const peak = S.isPeak(d.startTime), wh = S.isWeekendOrHoliday(d.date);
      $("#simNote").textContent = (peak ? `Interval de vârf — +${C.schedule.peakSurchargePct}%.` : "În afara orelor de vârf — preț de bază.") + (wh ? ` Weekend/sărbătoare — +${C.weekendHolidaySurchargePct}%.` : "");
    }
    const simSection = $("#heroSim");
    if (simSection) {
      // forțează consumabilele la 0 la încărcare (unele browsere restaurează valori vechi)
      document.querySelectorAll(".simCons").forEach(i => { i.value = "0"; });
      // Urgență / Rambursabil — exclusive (nu se cumulează)
      const su = $("#simUrgent"), sr = $("#simRefundable");
      if (su && sr) {
        su.addEventListener("change", () => { if (su.checked) sr.checked = false; });
        sr.addEventListener("change", () => { if (sr.checked) su.checked = false; });
      }
      ["input", "change"].forEach(ev => simSection.addEventListener(ev, recalcSim));
      recalcSim();
    }

    const offerForm = $("#offerForm");
    if (offerForm) offerForm.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const d = readSim();
      const q = S.quote(d);

        name: f.name.value, phone: f.phone.value, email: f.email ? f.email.value : "", note: f.note ? f.note.value : "",

      });
      if (!res.ok) return toast(res.error, "err");
      toast("Cerere de ofertă trimisă! Te contactăm în curând.", "ok");
      f.reset();
    };
  }

      </div>
    </a>`;

  // corp articol: format simplu — paragrafe, „## " subtitlu, „- " listă
  function blogBodyHtml(text) {
    const blocks = String(text || "").split(/\n{2,}/);
    let html = "", listOpen = false;
    const closeList = () => { if (listOpen) { html += "</ul>"; listOpen = false; } };
    for (const raw of blocks) {
      const b = raw.trim(); if (!b) continue;
      if (b.startsWith("## ")) { closeList(); html += `<h2>${esc(b.slice(3).trim())}</h2>`; continue; }
      const lines = b.split(/\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length && lines.every(l => l.startsWith("- "))) {
        closeList();
        html += "<ul>" + lines.map(l => `<li>${esc(l.slice(2).trim())}</li>`).join("") + "</ul>";
        continue;
      }
      closeList();
      html += `<p>${esc(b).replace(/\n/g, "<br>")}</p>`;
    }
    closeList();
    return html;
  }

  function wireNewsletterForms() {

        e.preventDefault();
        const category = f.dataset.newsletter;
        const val = (n) => { const el = f.querySelector(`[name="${n}"]`); return el ? el.value.trim() : ""; };
        const note = f.parentElement.querySelector("[data-fnnote]");

        if (btn) { btn.disabled = false; btn.textContent = "Abonează-te"; }

      if (res && res.ok && res.url) { window.location.href = res.url; return; }
      if (res && res.error && !["stripe_unconfigured", "demo"].includes(res.error)) return toast(res.error, "err");

    cvc.oninput = () => { cvc.value = cvc.value.replace(/\D/g, "").slice(0, 4); };

  async function openInvestPledge(u) {
    const c = S.investmentConfig();
    modal(`
      <h3 style="margin:0 0 10px">📈 Contract & garanție bancară — acționariat lenjerii</h3>
      <div class="invest-contract">
        <p><strong>Părțile:</strong> S.C. GlobalApps S.R.L. („Platforma") și investitorul <strong>${esc(u.name)}</strong>.</p>
        <p><strong>Obiect:</strong> participarea la acționariatul sistemului de închiriere lenjerii Sleep &amp; Go (buget-țintă ${c.budgetEur.toLocaleString("ro-RO")} €).</p>
        <p><strong>Angajament:</strong> investitorul <strong>NU trimite banii în avans</strong>. Depune o <strong>garanție bancară</strong> egală cu suma angajată, care se activează (fondurile se colectează) <strong>abia când se strânge întreaga sumă-țintă</strong> de ${c.budgetEur.toLocaleString("ro-RO")} € (capital de demarare ${c.startupEur.toLocaleString("ro-RO")} € + marjă de siguranță ${c.marginPct}%).</p>
        <p><strong>Randament:</strong> <strong>${c.linenRentalSharePct}% din chiria lenjeriei</strong> + <strong>${c.laundryCommissionSharePct}% din comisionul</strong> încasat de Platformă pentru serviciile de spălătorie (dus/luat/spălat), proporțional cu aportul, pe durata acționariatului.</p>
        <p><strong>Destinația fondurilor:</strong> achiziția de lenjerii și prosoape, cipuri de etichetare și sisteme de scanare a lenjeriilor.</p>
        <p><strong>Retragere:</strong> condițiile de retragere și eliberarea garanției se stabilesc prin actul adițional semnat cu Platforma.</p>
      </div>
      <div class="field" style="max-width:240px"><label>Suma garanției bancare (€)</label><input id="invAmount" type="number" min="${c.minEur}" step="100" value="${c.minEur}" /></div>
      <div class="field"><label>IBAN / bancă emitentă a garanției (opțional)</label><input id="invIban" placeholder="RO49 BANK 0000 0000 0000 0000" /></div>
      <label class="inv-accept"><input type="checkbox" id="invAccept" /> <span>Am citit și accept contractul. Mă angajez să depun garanția bancară; banii se colectează doar la atingerea sumei-țintă.</span></label>
      <button class="btn btn-block" id="invPayBtn" style="margin-top:14px">📄 Semnează &amp; depune garanția</button>

      <p class="stripe-foot">🔒 Nicio sumă nu se încasează acum. Garanția bancară se blochează până la strângerea întregului capital, apoi te contactăm pentru activare.</p>
    `);
    $("#invPayBtn").onclick = async () => {
      const amt = Number($("#invAmount").value) || 0;
      if (!$("#invAccept").checked) return toast("Bifează acceptul contractului.", "err");
      if (amt < c.minEur) return toast("Suma minimă a garanției este " + c.minEur + " €.", "err");
      const btn = $("#invPayBtn"); btn.disabled = true; btn.textContent = "Se înregistrează…";
      const res = S.activateInvestment(amt);
      const iban = $("#invIban").value.trim();
      if (iban) { const cu = S.currentUser(); if (cu && cu.investment) { cu.investment.iban = iban; S.updateUser(cu.id, { investment: cu.investment }); } }
      if (S.mode && S.mode() === "api") { try { await S.flush(); } catch (e) {} }
      closeModal();
      if (res && res.ok) { toast("Contract semnat și garanție înregistrată! 📈", "ok"); renderInvestor(u); }
      else { btn.disabled = false; btn.textContent = "📄 Semnează & depune garanția"; toast((res && res.error) || "Eroare.", "err"); }
    };
  }

  /* ---------- SEO / AEO / GEO: meta tags + Open Graph + JSON-LD ---------- */
  const SITE_NAME = "Sleep & Go Cleaning";
  function siteOrigin() {
    try {
      const o = location.origin;
      // canonic pe www (domeniul principal)
      if (/^https?:\/\/sleepandgocleaning\.com/i.test(o)) return o.replace("://", "://www.");
      return o;
    } catch (e) { return "https://www.sleepandgocleaning.com"; }
  }
  function setMeta(attr, key, content) {
    let m = document.head.querySelector(`meta[${attr}="${key}"][data-seo]`);
    if (!content) { if (m) m.remove(); return; }
    if (!m) { m = document.createElement("meta"); m.setAttribute(attr, key); m.setAttribute("data-seo", "1"); document.head.appendChild(m); }
    m.setAttribute("content", content);
  }
  function setLinkRel(rel, href) {
    let l = document.head.querySelector(`link[rel="${rel}"][data-seo]`);
    if (!href) { if (l) l.remove(); return; }
    if (!l) { l = document.createElement("link"); l.setAttribute("rel", rel); l.setAttribute("data-seo", "1"); document.head.appendChild(l); }
    l.setAttribute("href", href);
  }
  function setJsonLd(id, obj) {
    let s = document.getElementById(id);
    if (!obj) { if (s) s.remove(); return; }
    if (!s) { s = document.createElement("script"); s.type = "application/ld+json"; s.id = id; document.head.appendChild(s); }
    s.textContent = JSON.stringify(obj);
  }
  function clearSeo() {
    document.head.querySelectorAll("meta[data-seo],link[data-seo]").forEach(n => n.remove());
    ["ldArticle", "ldFaq", "ldBreadcrumb"].forEach(id => { const s = document.getElementById(id); if (s) s.remove(); });
  }
  const metaDescOf = (p) => (p.metaDescription || p.excerpt || "").slice(0, 300);
  const seoTitleOf = (p) => (p.seoTitle || p.title || "").slice(0, 70);
  const plainText = (md) => String(md || "").replace(/^##\s+/gm, "").replace(/^-\s+/gm, "").replace(/\s+/g, " ").trim();

  function applyArticleSeo(p) {
    clearSeo();
    const url = siteOrigin() + "/blog/" + encodeURIComponent(p.slug);
    const title = seoTitleOf(p), desc = metaDescOf(p);
    const img = (typeof p.cover === "string" && /^https?:/i.test(p.cover)) ? p.cover : "";
    try { document.title = title + " — " + SITE_NAME; } catch (e) {}
    setMeta("name", "description", desc);
    if (p.keywords) setMeta("name", "keywords", p.keywords);
    setMeta("name", "robots", "index,follow,max-image-preview:large");
    setLinkRel("canonical", url);
    setMeta("property", "og:type", "article");
    setMeta("property", "og:site_name", SITE_NAME);
    setMeta("property", "og:title", title);
    setMeta("property", "og:description", desc);
    setMeta("property", "og:url", url);
    setMeta("property", "og:locale", "ro_RO");
    if (img) setMeta("property", "og:image", img);
    setMeta("property", "article:published_time", new Date(p.publishAt || p.createdAt || Date.now()).toISOString());
    setMeta("property", "article:modified_time", new Date(p.updatedAt || p.publishAt || p.createdAt || Date.now()).toISOString());
    setMeta("name", "twitter:card", img ? "summary_large_image" : "summary");
    setMeta("name", "twitter:title", title);
    setMeta("name", "twitter:description", desc);
    if (img) setMeta("name", "twitter:image", img);
    const article = {
      "@context": "https://schema.org", "@type": "Article",
      headline: title, description: desc,
      datePublished: new Date(p.publishAt || p.createdAt || Date.now()).toISOString(),
      dateModified: new Date(p.updatedAt || p.publishAt || p.createdAt || Date.now()).toISOString(),
      author: { "@type": "Organization", name: SITE_NAME, url: siteOrigin() },
      publisher: { "@type": "Organization", name: SITE_NAME, url: siteOrigin() },
      mainEntityOfPage: { "@type": "WebPage", "@id": url },
      inLanguage: "ro-RO", articleBody: plainText(p.body),
    };
    if (p.keywords) article.keywords = p.keywords;
    if (img) article.image = [img];
    setJsonLd("ldArticle", article);
    setJsonLd("ldBreadcrumb", {
      "@context": "https://schema.org", "@type": "BreadcrumbList",
      itemListElement: [
        { "@type": "ListItem", position: 1, name: "Acasă", item: siteOrigin() + "/" },
        { "@type": "ListItem", position: 2, name: "Blog", item: siteOrigin() + "/blog" },
        { "@type": "ListItem", position: 3, name: p.title, item: url },
      ],
    });
    if (Array.isArray(p.faq) && p.faq.length) {
      setJsonLd("ldFaq", {
        "@context": "https://schema.org", "@type": "FAQPage",
        mainEntity: p.faq.map(f => ({ "@type": "Question", name: f.q, acceptedAnswer: { "@type": "Answer", text: f.a } })),
      });
    } else setJsonLd("ldFaq", null);
  }
  function applyBasicSeo(title, desc, path) {
    clearSeo();
    const url = siteOrigin() + (path || "/");
    try { document.title = title; } catch (e) {}
    setMeta("name", "description", desc);
    setMeta("name", "robots", "index,follow,max-image-preview:large");
    setLinkRel("canonical", url);
    setMeta("property", "og:type", "website");
    setMeta("property", "og:site_name", SITE_NAME);
    setMeta("property", "og:title", title);
    setMeta("property", "og:description", desc);
    setMeta("property", "og:url", url);
    setMeta("property", "og:locale", "ro_RO");
  }

  // Secțiune „Întrebări frecvente" (acordeon) + schema FAQPage (JSON-LD) pentru SEO/AEO/GEO.
  // items: [{q, a}] — răspunsul (a) poate conține HTML; în schema se folosește textul curat.
  function faqSection(eyebrow, heading, intro, items, opts) {
    opts = opts || {};
    try {
      setJsonLd("ldFaq", {
        "@context": "https://schema.org", "@type": "FAQPage",
        mainEntity: (items || []).map(f => ({
          "@type": "Question", name: f.q,
          acceptedAnswer: { "@type": "Answer", text: String(f.a).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim() },
        })),
      });
    } catch (e) {}
    const img = opts.image ? `
        <figure class="faq-shot">
          <div class="faq-shot-frame">
            <div class="faq-shot-bar"><span></span><span></span><span></span></div>
            <img src="${opts.image}" alt="${esc(opts.imageAlt || "Interfața aplicației")}" loading="lazy" />
          </div>
          ${opts.imageCaption ? `<figcaption>📱 ${opts.imageCaption}</figcaption>` : ""}
        </figure>` : "";
    return `
      <section class="h-section${opts.soft ? " soft" : ""} h-faq-sec" id="faq"><div class="wrap">
        <div class="h-section-head">
          <div class="eyebrow">❓ ${eyebrow}</div>
          <h2>${heading}</h2>
          ${intro ? `<p>${intro}</p>` : ""}
        </div>
        ${img}
        <div class="h-faq">
          ${(items || []).map((f, i) => `
            <details class="faq-item"${i === 0 ? " open" : ""}>
              <summary><span class="faq-q">${f.q}</span><span class="faq-chev" aria-hidden="true"></span></summary>
              <div class="faq-a">${f.a}</div>
            </details>`).join("")}
        </div>
      </div></section>`;
  }

  // tabel cu bugetul detaliat de demarare (linii + total + marjă + țintă)
  function budgetTable(c, opts) {
    opts = opts || {};
    const items = (c.budgetItems || []);
    const margin = Math.round(c.startupEur * (c.marginPct / 100));
    const rows = items.map(i => `<tr><td>${esc(i.label)}</td><td class="num">${(Number(i.eur) || 0).toLocaleString("ro-RO")} €</td></tr>`).join("");
    return `<div class="inv-budget ${opts.dark ? "dark" : ""}">
      <div class="tbl-wrap"><table class="budget-tbl">
        <thead><tr><th>Componentă</th><th class="num">Cost estimat</th></tr></thead>
        <tbody>
          ${rows}
          <tr class="sub"><td>Capital de demarare</td><td class="num">${c.startupEur.toLocaleString("ro-RO")} €</td></tr>
          <tr class="sub"><td>Marjă de siguranță (+${c.marginPct}%)</td><td class="num">${margin.toLocaleString("ro-RO")} €</td></tr>
          <tr class="tot"><td>Țintă totală de strâns</td><td class="num">${c.budgetEur.toLocaleString("ro-RO")} €</td></tr>
        </tbody>
      </table></div>
      <p class="bt-note">Estimări de lucru, ajustabile pe baza ofertelor reale (echipamente noi/second-hand, spațiu, tarife). Capitalul de lucru acoperă lansarea de ~3 luni și perioada până la primele contracte.</p>
    </div>`;
  }

        <h2>3. Hoteluri: fork strategic pe care trebuie să-l decizi acum</h2>
        <p>Hotelurile schimbă economia în bine (volum predictibil, contracte anuale, o adresă pentru 40–200 piese/zi) dar sparg ipoteza standardizării pe un singur SKU. Un hotel de 3–4 stele are dimensiuni proprii, adesea brodate cu logo. Două variante incompatibile:</p>
