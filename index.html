  function wireInvestCalc() {
    const box = $("#investCalc");
    if (!box) return;
    const c = S.investmentConfig();
    const EUR = 5;                 // lei → € (curs orientativ)
    const num = (id) => { const v = parseFloat(($("#" + id) || {}).value); return isFinite(v) ? v : 0; };
    const recalc = () => {
      const invest  = num("ic_invest");
      const sets    = num("ic_sets");
      const rot     = num("ic_rot");
      const rentLei = num("ic_rent");
      const comLei  = num("ic_com");
      let salary    = num("ic_salary");
      const salaryMin = c.operationalSalaryEur || 1500;
      if (salary < salaryMin) salary = salaryMin; // minim net impus
      const opex    = num("ic_opex");

      const turnovers  = sets * rot;                       // rotații / lună
      const rentRev    = turnovers * rentLei / EUR;        // venit chirie (€)
      const comRev     = turnovers * comLei / EUR;         // venit comision spălătorie (€)
      const revenue    = rentRev + comRev;                 // venit lunar total (€)
      // fondul investitorilor = share% din chirie + share% din comision
      const pool       = rentRev * (c.linenRentalSharePct / 100) + comRev * (c.laundryCommissionSharePct / 100);
      const budget     = c.budgetEur || 1;
      const myFrac     = Math.min(invest / budget, 1);     // cota ta din capital
      const myShare    = pool * myFrac;                    // partea ta / lună (€)
      const annual     = myShare * 12;
      const payback    = myShare > 0 ? invest / myShare : 0; // luni până la amortizare
      const salaryTot  = salary * 1.74;                    // cost total angajator (net → total ~×1,74)
      // profitul platformei = ce rămâne din venit după fondul investitorilor, minus angajat + logistică
      const platformNet = (revenue - pool) - salaryTot - opex;

      const fmt = (n) => Math.round(n).toLocaleString("ro-RO");
      const set = (id, txt) => { const e = $("#" + id); if (e) e.textContent = txt; };
      set("ico_turnovers", turnovers.toLocaleString("ro-RO"));
      set("ico_revenue", fmt(revenue) + " €");
      set("ico_pool", fmt(pool) + " €");
      set("ico_share", fmt(myShare) + " €");
      set("ico_annual", fmt(annual) + " €");
      set("ico_payback", payback > 0 ? (payback < 1 ? "< 1 lună" : Math.round(payback) + " luni") : "—");
      set("ico_salaryTotal", fmt(salaryTot) + " €");
      const pn = $("#ico_platformNet");
      if (pn) {
        pn.textContent = (platformNet >= 0 ? "+" : "") + fmt(platformNet) + " €";
        pn.style.color = platformNet >= 0 ? "var(--h-blue, #009FE3)" : "#d64545";
      }
    };
    box.querySelectorAll("input").forEach((inp) => {
      inp.addEventListener("input", recalc);
      inp.addEventListener("change", recalc);
    });
    recalc();
  }

  function wireRentalForm() {
    const rentalForm = $("#rentalForm");
    if (!rentalForm) return;
    rentalForm.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const payload = { name: f.name.value, phone: f.phone.value, email: f.email.value, locations: f.locations.value, note: f.note.value };
      const res = await S.addRentalLead(payload);
      if (!res.ok) return toast(res.error, "err");
      // Trimite emailul către administrator (funcționează pe domeniu, prin send-rental.php)
      try {
        fetch("send-rental.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).catch(() => {});
      } catch (err) { /* fără backend — rămâne salvat local */ }
      toast("Înregistrare trimisă! Te contactăm în curând.", "ok");
      f.reset();
    };
  }

    const exReadCons = () => [...document.querySelectorAll(".exCons")]
      .map(i => ({ productId: i.dataset.pid, qty: Number(i.value) || 0 })).filter(c => c.qty > 0);
    const exRead = () => {
      const linens = ($('input[name="exLinen"]:checked') || {}).value !== "without";
      return {
        sqm: $("#exSqm") ? $("#exSqm").value : 0,
        date: $("#exDate") ? $("#exDate").value : "",
        startTime: $("#exStart") ? $("#exStart").value : "10:00",
        linens, linenExecutorId: linens ? "sim" : null,
        linenSets: $("#exSets") ? $("#exSets").value : 0,
        consumables: exReadCons(),
        urgent: !!($("#exUrgent") && $("#exUrgent").checked),
        refundable: !!($("#exRefundable") && $("#exRefundable").checked),
      };
    };
    function exRecalc() {
      if (!$("#exTotal")) return;
      const d = exRead();
      const wrap = $("#exSetsWrap"); if (wrap) wrap.style.display = d.linens ? "" : "none";
      const b = S.breakdown({
        sqm: Number(d.sqm) || 0, startTime: d.startTime, date: d.date,
        linens: d.linens, linenExecutorId: d.linenExecutorId,
        linenSets: Number(d.linenSets) || 0, consumables: d.consumables,
        urgent: d.urgent, refundable: d.refundable,
      });
      const commissionCleaning = b.cleaningNet - b.cleaningPayout;
      const rows = [];
      // Sursa 1 — Curățenie: prețul plătit de client, minus comisionul, = partea ta
      rows.push(`<div class="sb-row"><span>🧹 Curățenie (${Number(d.sqm) || 0} m²) — client plătește</span><span>${money(b.cleaningNet)}</span></div>`);
      rows.push(`<div class="sb-row sur"><span>− Comision platformă (${b.pct}%)</span><span>−${money(commissionCleaning)}</span></div>`);
      rows.push(`<div class="sb-row" style="font-weight:700;border-top:1px dashed var(--h-line);padding-top:8px"><span>= Curățenie, partea ta (${cleanPct}%)</span><span>${money(b.cleaningPayout)}</span></div>`);
      // Sursa 2 — Lenjerie (dacă o preiei tu)
      if (b.linenTaken && b.linenSets > 0) rows.push(`<div class="sb-row"><span>+ 🧺 Lenjerie preluată (${b.linenSets} × ${C.linenSetPriceRon} lei · ${cleanPct}%)</span><span>+${money(b.linenPayout)}</span></div>`);
      // Sursa 3 — Consumabile (partea ta din adaos)
      if (b.consExecutantPayout > 0) rows.push(`<div class="sb-row"><span>+ 🧴 Consumabile (${C.consumableSplit.executant}% din adaos)</span><span>+${money(b.consExecutantPayout)}</span></div>`);
      // Opțiunile clientului (⚡/🔓) — clientul plătește în plus, iar TU primești partea ta (restul e comisionul platformei)
      if (b.urgentAdd) rows.push(`<div class="sb-row"><span>+ ⚡ Urgență (client +${money(b.urgentAdd)} · partea ta ${cleanPct}%)</span><span>+${money(b.urgentAgent)}</span></div>`);
      if (b.refundableAdd) rows.push(`<div class="sb-row"><span>+ 🔓 Rambursabil (client +${money(b.refundableAdd)} · partea ta ${cleanPct}%)</span><span>+${money(b.refundableAgent)}</span></div>`);
      $("#exBreakdown").innerHTML = rows.join("");
      $("#exTotal").innerHTML = `${money(b.payout)} <small style="font-size:14px;color:var(--h-muted);font-weight:600">≈ ${leiOf(b.payout)} lei</small>`;
      const peak = S.isPeak(d.startTime), wh = S.isWeekendOrHoliday(d.date);
      let note = (peak ? "Interval de vârf — clientul plătește mai mult, deci încasezi mai mult." : "În afara orelor de vârf — preț de bază.") + (wh ? " Weekend/sărbătoare — încasezi în plus." : "");
      if (b.urgentAdd || b.refundableAdd) note += " Opțiunile ⚡/🔓 alese de client îți cresc și ție câștigul.";
      $("#exNote").textContent = note;
    }
    const exSection = $("#exSim");
    if (exSection) {
      // forțează consumabilele la valorile implicite (unele browsere restaurează valori vechi)
      document.querySelectorAll(".exCons").forEach(i => { i.value = i.dataset.def || "0"; });
      // Urgență / Rambursabil — exclusive (ca la client)
      const eu = $("#exUrgent"), er = $("#exRefundable");
      if (eu && er) {
        eu.addEventListener("change", () => { if (eu.checked) er.checked = false; });
        er.addEventListener("change", () => { if (er.checked) eu.checked = false; });
      }
      ["input", "change"].forEach(ev => exSection.addEventListener(ev, exRecalc));
      exRecalc();
    }
  }

  // opțiuni de oră pentru sloturi
  const hourOpts = (from, to, sel) => {
    let s = "";
    for (let h = from; h <= to; h++) {
      const v = String(h).padStart(2, "0") + ":00";
      s += `<option value="${v}" ${v === sel ? "selected" : ""}>${v}</option>`;
    }
    return s;
  };

  function renderNewRequest(u) {
    const body = $("#solBody");
    const sch = C.schedule;
    // data implicită = prima zi disponibilă (respectă termenul: 21:00 cu o zi înainte)
    const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    const minBook = S.minBookableDate() || tomorrow;
    const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
    const approved = S.usableLocationsOfOwner(u.id);   // aprobate ȘI cu Agent Cleaning activ în zonă
    const waiting = S.approvedLocationsOfOwner(u.id).filter(l => !S.hasActiveExecutorInArea(l.area));

    if (!approved.length) {
      body.appendChild(emptyState(
        "Nicio locație disponibilă pentru solicitare.",
        waiting.length
          ? "Locațiile tale sunt în așteptare — momentan nu avem Agenți Cleaning activi în zonele lor. Vei putea trimite solicitări imediat ce apare un Agent Cleaning."
          : "Adaugă o locație cu documentul de suprafață în tabul «Locațiile mele». După ce administratorul o aprobă, poți trimite o solicitare."));
      return;
    }

    const lastStart = sch.close - sch.minHours; // ultima oră de început validă
    body.appendChild(el(`
      <div class="grid cols-2">
        <div class="card">
          <form id="reqForm">
            <div class="field">
              <label>Locație (aprobată)</label>
              <select name="locationId" required>
                ${approved.map(l => `<option value="${l.id}" data-sqm="${l.sqm}">${esc(l.name)} — ${l.sqm} m² · ${esc(l.area)}</option>`).join("")}
              </select>
              <div class="hint">Suprafața provine din documentul aprobat de administrator.</div>
            </div>
            <div class="field">
              <label>Data dorită</label>
              <input type="date" name="date" required value="${minBook}" min="${minBook}" />
            </div>
            <div class="row-2">
              <div class="field">
                <label>Ora început</label>
                <select name="startTime">${hourOpts(sch.open, lastStart, "10:00")}</select>
              </div>
              <div class="field">
                <label>Ora sfârșit</label>
                <select name="endTime">${hourOpts(sch.open + sch.minHours, sch.close, "14:00")}</select>
              </div>
            </div>
            <div class="field">
              <label>Lenjerie</label>
              <div class="role-picker" id="linenMode">
                <div class="role-opt ${reqLinenMode === "with" ? "active" : ""}" data-linen="with">
                  <strong>Cu lenjerie</strong><br><small>${money(S.ronToEur(C.linenSetPriceRon))}/set (${C.linenSetPriceRon} lei) · spălat &amp; călcat</small>
                </div>
                <div class="role-opt ${reqLinenMode === "without" ? "active" : ""}" data-linen="without">
                  <strong>Fără lenjerie</strong><br><small>folosesc lenjeria mea</small>
                </div>
              </div>
              <div class="linen-compo">🧺 O lenjerie (set) = ${C.linenComposition.join(" · ")}</div>
            </div>
            <div class="field">
              <label>Câte lenjerii (seturi)</label>
              <input type="number" name="linenSets" min="0" value="1" />
              <div class="hint" id="linenNote"></div>
            </div>
            <div class="field">
              <label>Alimentare consumabile (opțional)</label>
              <div class="consumables-pick">
                ${S.activeProducts().map(p => `
                  <div class="cp-row">
                    <div class="cp-info"><strong>${esc(p.name)}</strong><small>${esc(p.unit)} · ${p.priceRon} lei</small></div>
                    <input type="number" name="cons_${p.id}" min="0" value="0" class="cp-qty" />
                  </div>`).join("")}
              </div>
              <div class="hint">Agentul Cleaning le cumpără și le reaprovizionează la intervenție. Costul e plătit în avans.</div>
            </div>
            <div class="field">
              <label>Observații (opțional)</label>
              <textarea name="notes" rows="2" placeholder="Detalii utile pentru Agent Cleaning"></textarea>
            </div>
            <div class="field" style="border:1px solid var(--warn);border-radius:10px;padding:12px">
              <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin:0">
                <input type="checkbox" name="urgent" id="reqUrgent" style="width:18px;height:18px;flex:0 0 auto;margin-top:2px" />
                <span>
                  <strong>⚡ Solicitare de urgență (+${C.urgentSurchargePct}%)</strong><br>
                  <small class="hint">Poți plasa o solicitare cu minim <strong>${C.urgentMinLeadHours} ore</strong> înainte de ora de începere (inclusiv azi), în programul ${C.schedule.open}:00–${C.schedule.close}:00.</small>
                </span>
              </label>
            </div>
            <div class="field" style="border:1px solid var(--line);border-radius:10px;padding:12px">
              <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin:0">
                <input type="checkbox" name="refundable" id="reqRefundable" style="width:18px;height:18px;flex:0 0 auto;margin-top:2px" />
                <span>
                  <strong>🔓 Rezervare rambursabilă (+${C.refundableSurchargePct}%)</strong><br>
                  <small class="hint">Poți anula și primești banii înapoi (se reține ${C.refundRetainPct}%) până la ora <strong>${C.refundDeadlineHour}:00</strong> în ziua curățeniei. Fără opțiune, plata nu se returnează.</small>
                </span>
              </label>
            </div>
            <button class="btn btn-block" type="submit">Continuă spre plată →</button>
          </form>
        </div>
        <div>
          <div class="card">
            <div class="section-title" style="margin-top:0">Rezumat cost</div>
            <div class="summary" id="summary"></div>
            <div class="pricing-legend">
              <div class="pl-row"><span class="pl-dot off"></span> Înainte de ${sch.peakStart}:00 sau de la ${sch.peakEnd}:00 · <strong>${money(S.pricePerSqm())}/m²</strong> (preț de bază)</div>
              <div class="pl-row"><span class="pl-dot peak"></span> Vârf ${sch.peakStart}:00–${sch.peakEnd}:00 · <strong>${money(Math.round(S.pricePerSqm() * (100 + sch.peakSurchargePct)) / 100)}/m²</strong> (+${sch.peakSurchargePct}%)</div>
              <div class="pl-row"><span class="pl-dot" style="background:var(--warn)"></span> Weekend / sărbători legale · <strong>+${C.weekendHolidaySurchargePct}%</strong></div>
            </div>
            <p class="hint" style="margin-top:12px">Program ${sch.open}:00–${sch.close}:00 · interval minim ${sch.minHours} ore. ⏰ Solicitările pentru o dată se trimit până la ora <strong>${C.bookingLeadHour}:00</strong> cu o zi înainte. Plata în avans; solicitarea devine vizibilă Agenților Cleaning din zonă după confirmare.</p>
          </div>
        </div>
      </div>

    const form = $("#reqForm");
    const readConsumables = () => S.activeProducts()
      .map(pr => ({ productId: pr.id, qty: Number((form["cons_" + pr.id] || {}).value) || 0 }))
      .filter(c => c.qty > 0);
    const updateSummary = () => {
      const f = new FormData(form);
      const opt = form.locationId.selectedOptions[0];
      const sqm = opt ? Number(opt.dataset.sqm) : 0;
      const linenSets = Number(f.get("linenSets")) || 0;
      const withLinen = reqLinenMode === "with";
      const startTime = f.get("startTime");
      const consumables = readConsumables();
      const reqDate = f.get("date");
      const refundable = !!(form.reqRefundable && form.reqRefundable.checked);
      const urgent = !!(form.reqUrgent && form.reqUrgent.checked);
      const loInfo = S.launchOfferInfo();
      const isVip = S.isVipActive(u);
      const draft = { sqm, linens: withLinen, linenSets, startTime, consumables, date: reqDate, refundable, urgent,
        vipDiscountPct: isVip ? S.vipConfig().discountPct : 0,
        launchDiscountPct: (!isVip && loInfo.active) ? loInfo.discountPct : 0 };
      const p = S.priceOf(draft);
      $("#linenNote").textContent = withLinen
        ? `Se plătește ${C.linenSetPriceRon} lei/set. Agentul Cleaning o poate spăla și călca.`
        : "Lenjeria proprie trebuie găsită de Agent Cleaning la începerea activității; altfel nu se pune pe pat.";
      $("#summary").innerHTML = `
        <div class="line"><span>Curățenie (${sqm} m²)</span><span>${money(p.cleaning)}</span></div>
        ${p.peakPct ? `<div class="line" style="color:var(--warn)"><span>Adaos interval de vârf (+${p.peakPct}%)</span><span>+${money(p.peakAdd)}</span></div>`
          : `<div class="line"><span>În afara orelor de vârf</span><span class="pill">preț de bază</span></div>`}
        ${p.surPct ? `<div class="line" style="color:var(--warn)"><span>Weekend / sărbătoare (+${p.surPct}%)</span><span>+${money(p.surcharge)}</span></div>` : ""}
        ${withLinen && linenSets > 0
          ? `<div class="line"><span>Lenjerie (${linenSets} × ${C.linenSetPriceRon} lei)</span><span>${p.linenRon} lei ≈ ${money(p.linenEur)}</span></div>`
          : `<div class="line"><span>Lenjerie</span><span class="pill">${withLinen ? "0 seturi" : "fără (proprie)"}</span></div>`}
        ${p.consumablesRon > 0 ? `<div class="line"><span>Consumabile (achiziție ${p.consumablesCostRon} + ${p.markupPct}% adaos)</span><span>${p.consumablesRon} lei ≈ ${money(p.consumablesEur)}</span></div>` : ""}
        ${p.urgentAdd ? `<div class="line" style="color:var(--warn)"><span>⚡ Urgență (+${p.urgentSurchargePct}%)</span><span>+${money(p.urgentAdd)}</span></div>` : ""}
        ${p.refundableAdd ? `<div class="line" style="color:var(--brand)"><span>🔓 Opțiune rambursabilă (+${p.refundableSurchargePct}%)</span><span>+${money(p.refundableAdd)}</span></div>` : ""}
        ${p.launchDiscount ? `<div class="line" style="color:#0a7d3f"><span>${p.discountKind === "vip" ? "👑 Reducere VIP" : "🎉 Ofertă de lansare"} (−${p.launchDiscountPct}%)</span><span>−${money(p.launchDiscount)}</span></div>` : ""}
        <div class="line total"><span>Total de plată</span><span class="amt">${moneyBoth(p.total)}</span></div>`;
    };

    body.querySelectorAll("#linenMode .role-opt").forEach(o => o.onclick = () => {
      reqLinenMode = o.dataset.linen;
      body.querySelectorAll("#linenMode .role-opt").forEach(x => x.classList.toggle("active", x.dataset.linen === reqLinenMode));
      updateSummary();
    });
    // opțiunile Urgență / Rambursabil sunt EXCLUSIVE (nu se cumulează) + urgența permite ziua de azi
    if (form.reqUrgent && form.reqRefundable) {
      form.reqUrgent.addEventListener("change", () => {
        if (form.reqUrgent.checked) form.reqRefundable.checked = false;   // exclusiv
        if (form.date) {
          if (form.reqUrgent.checked) { form.date.min = today; }
          else { form.date.min = minBook; if (form.date.value < minBook) form.date.value = minBook; }
        }
      });
      form.reqRefundable.addEventListener("change", () => {
        if (form.reqRefundable.checked) {
          form.reqUrgent.checked = false;   // exclusiv
          if (form.date) { form.date.min = minBook; if (form.date.value < minBook) form.date.value = minBook; }
        }
      });
    }
    form.addEventListener("input", updateSummary);
    form.addEventListener("change", updateSummary);
    updateSummary();

    form.onsubmit = (e) => {
      e.preventDefault();
      const f = new FormData(form);
      const res = S.createRequest({
        locationId: f.get("locationId"),
        linens: reqLinenMode === "with", linenSets: f.get("linenSets"),
        date: f.get("date"), startTime: f.get("startTime"), endTime: f.get("endTime"),
        notes: f.get("notes"), consumables: readConsumables(),
        refundable: !!(form.reqRefundable && form.reqRefundable.checked),
        urgent: !!(form.reqUrgent && form.reqUrgent.checked),
      });
      if (!res.ok) return toast(res.error, "err");
      openPayment(res.req.id, u);
    };
  }

      $("#zoneWarn").innerHTML = S.hasActiveExecutorInArea(area) ? ""
        : `<div class="zone-warn">⚠️ Momentan nu avem Agenți Cleaning activi în <strong>${esc(area)}</strong>. Poți înregistra locația, dar va rămâne <strong>în așteptare</strong> până când un Agent Cleaning devine activ în zonă.</div>`;

          <button class="btn btn-danger btn-sm" data-act="reject">Respinge</button>
        </div></div>` : ""}
      </div>
    `);

      if (act === "viewdoc") { const w = window.open(); if (w) w.document.write(`<iframe src="${l.doc.dataUrl}" style="border:0;width:100%;height:100%"></iframe>`); }

    });
    return card;
  }

  /* ===== Calendar lunar de sume (cheltuieli client / încasări agent) ===== */
  let calOffset = 0;   // 0 = luna curentă, -1 = luna trecută, etc.
  const CAL_MONTHS = ["ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie", "august", "septembrie", "octombrie", "noiembrie", "decembrie"];
  // entries: [{date:'YYYY-MM-DD', amount:Number}]; cfg:{totalLabel, accent, rerender}
  function expenseCalendarEl(entries, cfg) {
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
    const y = target.getFullYear(), m = target.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    let firstWd = new Date(y, m, 1).getDay();      // 0=duminică
    firstWd = (firstWd + 6) % 7;                    // luni = 0
    const byDay = {}; let monthTotal = 0, monthCount = 0;
    (entries || []).forEach(e => {
      if (!e.date) return;
      const d = new Date(e.date + "T00:00:00");
      if (d.getFullYear() === y && d.getMonth() === m) {
        const day = d.getDate();
        byDay[day] = (byDay[day] || 0) + (Number(e.amount) || 0);
        monthTotal += Number(e.amount) || 0; monthCount++;
      }
    });
    const wk = ["L", "Ma", "Mi", "J", "V", "S", "D"];
    const todayD = (now.getFullYear() === y && now.getMonth() === m) ? now.getDate() : -1;
    let cells = "";
    for (let i = 0; i < firstWd; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const amt = byDay[d];
      cells += `<div class="cal-cell${d === todayD ? " today" : ""}${amt ? " has" : ""}"><span class="cal-day">${d}</span>${amt ? `<span class="cal-amt">${money(amt)}</span>` : ""}</div>`;
    }
    const wrap = el(`
      <div class="cal-wrap">
        <div class="cal-head">
          <button class="btn btn-soft cal-nav" type="button" data-cal="-1">‹</button>
          <div class="cal-title">${CAL_MONTHS[m]} ${y}</div>
          <button class="btn btn-soft cal-nav" type="button" data-cal="1">›</button>
        </div>
        <div class="card stat" style="margin:10px 0"><span class="label">${cfg.totalLabel} (${monthCount})</span><span class="value ${cfg.accent || ""}">${money(monthTotal)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(monthTotal)} lei</small></span></div>
        <div class="cal-weekdays">${wk.map(w => `<div>${w}</div>`).join("")}</div>
        <div class="cal-grid">${cells}</div>
      </div>`);
    wrap.querySelectorAll("[data-cal]").forEach(b => b.onclick = () => { calOffset += Number(b.dataset.cal); cfg.rerender(); });
    return wrap;
  }
  // câștigul unui agent dintr-o solicitare (curățenie + consumabile + lenjerie, dacă e cazul)
  function agentEarnOf(r, uid) {
    const b = S.breakdown(r);
    let amt = 0;
    if (r.executorId === uid) amt += b.cleaningPayout + b.consExecutantPayout;
    if (r.linens && r.linenExecutorId === uid) amt += b.linenPayout;
    if (r.linenExecutorId === uid && b.consLaundryPayout > 0) amt += b.consLaundryPayout;
    return Math.round(amt * 100) / 100;
  }

  // Agentul Cleaning refuză lenjeria → alege de unde o ridică Serviciul de lenjerie
  function declineLinenModal(r, u) {
    const myAddr = u.address || "";
    // următoarea adresă programată a Agentului Cleaning (alt job viitor)
    const nextJob = S.jobsOfExecutor(u.id)
      .filter(j => j.id !== r.id && j.address && j.executorId === u.id)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .find(j => j.date >= r.date);
    const nextAddr = nextJob ? nextJob.address : "";
    modal(`
      <h2>De unde se ridică lenjeria?</h2>
      <p class="sub">Nu preiei lenjeria la spălat — Serviciul de lenjerie o va ridica de la adresa indicată (cele ${r.linenSets} seturi).</p>
      <div class="field pk-opts">
        <label class="pk-opt"><input type="radio" name="pk" value="executant" checked> <span><strong>Adresa mea (Agent Cleaning)</strong><small>${esc(myAddr || "necompletată — scrie mai jos")}</small></span></label>
        <label class="pk-opt"><input type="radio" name="pk" value="next"> <span><strong>Următoarea adresă programată</strong><small>${esc(nextAddr || "nicio lucrare viitoare — scrie mai jos")}</small></span></label>
        <label class="pk-opt"><input type="radio" name="pk" value="other"> <span><strong>Altă adresă</strong><small>o completezi tu</small></span></label>
      </div>
      <div class="field"><label>Adresa de ridicare</label><input id="pkAddr" placeholder="Stradă, nr., oraș" value="${esc(myAddr)}" /></div>
      <div class="btn-row"><button class="btn btn-soft" onclick="_closeModal()">Renunță</button>
      <button class="btn" style="flex:1" id="pkConfirm">Confirmă · trimite la spălătorie</button></div>
    `);
    const addrInput = $("#pkAddr");
    const prefill = { executant: myAddr, next: nextAddr, other: "" };
    document.querySelectorAll('input[name="pk"]').forEach(radio => radio.onchange = () => {
      if (radio.checked) addrInput.value = prefill[radio.value] || "";
    });
    $("#pkConfirm").onclick = () => {
      const type = (document.querySelector('input[name="pk"]:checked') || {}).value || "other";
      const address = addrInput.value.trim();
      if (!address) return toast("Completează adresa de ridicare.", "err");
      const res = S.declineLinenService(r.id, u.id, { type, address });
      if (!res.ok) return toast(res.error || "Nu s-a putut trimite.", "err");
      closeModal(); toast("Lenjeria a fost trimisă către Serviciul de lenjerie.", "ok"); renderApp();
    };
  }

  // grilă de checkbox-uri cu zone (bifate cele curente)
  function areaChecksHtml(current) {
    return C.areas.map(a => `<label class="area-check"><input type="checkbox" value="${esc(a)}" ${(current || []).includes(a) ? "checked" : ""}/> <span>${a}</span></label>`).join("");
  }
  // limitează numărul de zone bifate (ex. agenții: max 2) — dezactivează restul când s-a atins maximul
  function wireAreaMax(max) {
    if (!max || max >= 99) return;
    const boxes = [...document.querySelectorAll(".area-check input")];
    const apply = () => { const n = boxes.filter(b => b.checked).length; boxes.forEach(b => { if (!b.checked) b.disabled = n >= max; }); };
    boxes.forEach(b => b.addEventListener("change", apply)); apply();
  }
  // numărul maxim de zone per rol: Agent Cleaning 4, Serviciu lenjerie nelimitat
  const maxAreasFor = (role) => role === "executant" ? 4 : (role === "spalatorie" ? 99 : 1);

  function changeAreaModal(u) {
    const max = maxAreasFor(u.role);
    const current = S.areasOf(u);
    modal(`
      <h2>${u.role === "executant" ? `Zonele tale (max ${max})` : "Zonele tale de activitate"}</h2>
      <p class="sub">${u.role === "executant" ? `Poți activa în cel mult ${max} zone.` : "Poți prelua lenjerie din mai multe zone simultan."} Bifează zonele dorite.</p>
      <div class="field"><div class="area-checks">${areaChecksHtml(current)}</div></div>
      <div class="btn-row"><button class="btn btn-soft" onclick="_closeModal()">Renunță</button>
      <button class="btn" style="flex:1" id="saveArea">Salvează</button></div>
    `);
    wireAreaMax(max);
    $("#saveArea").onclick = () => {
      const areas = [...document.querySelectorAll(".area-check input:checked")].map(i => i.value);
      if (!areas.length) return toast("Alege cel puțin o zonă.", "err");
      if (areas.length > max) return toast(`Maxim ${max} zone.`, "err");
      S.updateUser(u.id, { areas, area: areas[0] });
      closeModal(); toast("Zone actualizate.", "ok"); renderApp();
    };
  }

  /* Parser CSV (gestionează ghilimele, virgule și newline-uri în câmpuri) */
  function parseCsv(text) {
    const rows = []; let row = [], field = "", inQ = false;
    text = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQ) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else field += ch;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.length && r.some(c => c.trim() !== ""));
  }
  // estimează câte lenjerii a cerut cineva din textul liber
  function parseLinenCount(text) {
    if (!text) return 0;
    const t = String(text).toLowerCase(); let total = 0, found = false;
    const re = /(\d+)\s*(?:de\s+)?(lenjerii|lenjerie|seturi|set|buc|bucati|bucăți|camere|camera|paturi|pat)\b/g;
    let m; while ((m = re.exec(t))) { total += parseInt(m[1], 10); found = true; }
    if (found) return total;
    const lead = t.match(/^\s*(\d+)\b/); return lead ? parseInt(lead[1], 10) : 0;
  }
  // importă CSV-ul „Cerere ofertă închiriere lenjerii" (Nume, Prenume, Email, Telefon, Cate lenjerii…, Adresă, Oraș)
  function importRentalCsv(text) {
    const rows = parseCsv(text);
    if (rows.length < 2) return { ok: false, error: "CSV gol sau invalid." };
    const header = rows[0].map(h => h.trim().toLowerCase());
    const col = (names) => header.findIndex(h => names.some(n => h.includes(n)));
    const iDate = col(["submission", "data", "date"]), iNume = col(["nume"]), iPren = col(["prenume"]),
      iEmail = col(["email"]), iTel = col(["telefon", "phone"]), iNeed = col(["cate lenjerii", "lenjerii ai nevoie", "dimensiuni"]),
      iAddr = col(["street", "adres"]), iCity = col(["city", "oraș", "oras"]);
    const leads = [];
    for (let r = 1; r < rows.length; r++) {
      const c = rows[r]; if (!c || !c.length) continue;
      const nume = (iNume >= 0 ? c[iNume] : "").trim(), pren = (iPren >= 0 ? c[iPren] : "").trim();
      const name = [pren, nume].filter(Boolean).join(" ") || [nume, pren].filter(Boolean).join(" ") || "—";
      const phone = (iTel >= 0 ? c[iTel] : "").trim(), email = (iEmail >= 0 ? c[iEmail] : "").trim();
      const need = (iNeed >= 0 ? c[iNeed] : "").trim();
      if (!phone && !email && name === "—") continue;
      const dRaw = (iDate >= 0 ? c[iDate] : "").trim();
      const ts = dRaw ? (new Date(dRaw).getTime() || Date.now()) : Date.now();
      leads.push({ name, phone, email, note: need, locations: parseLinenCount(need),
        address: (iAddr >= 0 ? c[iAddr] : "").trim(), city: (iCity >= 0 ? c[iCity] : "").trim(),
        source: "csv", createdAt: ts });
    }
    if (!leads.length) return { ok: false, error: "Niciun rând valid găsit." };
    return S.adminAddRentalLeads(leads);
  }

        reader.onerror = () => toast("Nu s-a putut citi fișierul.", "err");
        reader.readAsText(f, "utf-8");
      };
    }
  }

  function blogEditModal(post) {

      <h3 style="margin:0 0 12px">${post ? "Editează articol" : "Articol nou"}</h3>

      <div class="field">

          <label class="btn btn-soft btn-sm" style="cursor:pointer">🖼️ Încarcă imagine<input type="file" id="blImg" accept="image/*" hidden></label>

        <p class="hint" style="color:var(--muted,#8aa);font-size:12px;margin-top:4px">Lasă emoji sau încarcă o poză (max 15 MB, se redimensionează automat).</p>

      <div class="field"><label>Conținut</label>
        <textarea id="blBody" rows="12" placeholder="Scrie articolul aici.&#10;&#10;Rând gol = paragraf nou.&#10;## Subtitlu&#10;- element de listă">${esc(p.body || "")}</textarea>
        <p class="hint" style="color:var(--muted,#8aa);font-size:12px;margin-top:4px">Format simplu: rând gol = paragraf; „## " = subtitlu; „- " = listă.</p>
      </div>

      <div style="border-top:1px solid var(--line,#2b3648);margin:16px 0 12px;padding-top:14px">
        <strong>🔎 SEO / AEO / GEO</strong>
        <p class="hint" style="color:var(--muted,#8aa);font-size:12px;margin:2px 0 12px">Cum apare articolul în Google și în motoarele AI (ChatGPT, Perplexity, Google AI). Dacă lași gol titlul SEO/meta, folosim automat titlul și rezumatul.</p>
        <div class="field"><label>Titlu SEO <small style="color:var(--muted,#8aa)">(ideal 50–60 caractere)</small></label><input id="blSeoTitle" value="${esc(p.seoTitle || "")}" placeholder="Ex: Curățenie regim hotelier București — turnover Airbnb la timp" /></div>
        <div class="field"><label>Meta descriere <small id="blMdCount" style="color:var(--muted,#8aa)"></small></label><textarea id="blMeta" rows="2" placeholder="Descrierea din rezultatele Google (ideal 150–160 caractere), cu cuvântul-cheie principal.">${esc(p.metaDescription || "")}</textarea></div>
        <div class="field"><label>Cuvinte cheie <small style="color:var(--muted,#8aa)">(separate prin virgulă)</small></label><input id="blKw" value="${esc(p.keywords || "")}" placeholder="curățenie regim hotelier București, curățenie Airbnb, turnover check-out" /></div>
        <div class="field">
          <label>Întrebări frecvente (FAQ) <small style="color:var(--muted,#8aa)">— apar pe pagină și în datele structurate FAQPage (AEO)</small></label>

        <p class="hint" style="color:var(--muted,#8aa);font-size:12px;margin-top:4px">Gol = se publică imediat. O dată în viitor = articolul devine public automat la acel moment.</p>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin:6px 0 14px"><input type="checkbox" id="blPub" ${p.published === false ? "" : "checked"}> Publicat (dacă e programat, apare la data setată)</label>

    const emojiInp = box.querySelector("#blEmoji");
    emojiInp.oninput = () => { if (emojiInp.value.trim()) { cover = emojiInp.value.trim(); prev.innerHTML = esc(cover); } };
    box.querySelector("#blImg").onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      readDocFile(f, (res) => {
        const dataUrl = res && res.dataUrl;
        if (!dataUrl) return;
        cover = dataUrl; emojiInp.value = "";
        prev.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
      });
    };
    // contor meta descriere
    const md = box.querySelector("#blMeta"), mdc = box.querySelector("#blMdCount");
    const updCount = () => { const n = md.value.length; mdc.textContent = n + " car." + (n >= 120 && n <= 160 ? " ✓" : ""); };
    md.oninput = updCount; updCount();
    // repetor FAQ
    const faqWrap = box.querySelector("#blFaq");
    const wireDel = () => faqWrap.querySelectorAll(".faqDel").forEach(b => b.onclick = () => b.closest(".faq-row").remove());
    wireDel();
    box.querySelector("#blFaqAdd").onclick = () => { faqWrap.insertAdjacentHTML("beforeend", faqRow("", "")); wireDel(); };

    box.querySelector("#blCancel").onclick = closeModal;
    box.querySelector("#blSave").onclick = async () => {
      const title = box.querySelector("#blTitle").value.trim();
      if (!title) return toast("Pune un titlu.", "err");
      const faq = [...faqWrap.querySelectorAll(".faq-row")].map(r => ({
        q: r.querySelector(".faqQ").value, a: r.querySelector(".faqA").value,
      }));
      const data = {
        title,
        excerpt: box.querySelector("#blExcerpt").value,
        body: box.querySelector("#blBody").value,
        cover,
        published: box.querySelector("#blPub").checked,
        seoTitle: box.querySelector("#blSeoTitle").value,
        metaDescription: box.querySelector("#blMeta").value,
        keywords: box.querySelector("#blKw").value,
        faq,
        publishAt: box.querySelector("#blSchedule").value || null,
      };
      if (post) S.updateBlogPost(post.id, data); else S.addBlogPost(data);
      await S.flush();
      const sched = data.publishAt && Date.parse(data.publishAt) > Date.now();
      closeModal(); toast(sched ? "Articol programat." : (post ? "Articol salvat." : "Articol publicat."), "ok");
      renderAdmin(S.currentUser());
    };
  }

  // Pontaj (admin): timpii de lucru ai tuturor Agenților Cleaning
  function renderAdminTime() {
    const body = $("#admBody");
    const sessions = S.allWorkSessions();
    // rezumat pe Agent Cleaning
    const byExec = {};
    sessions.forEach(s => {
      if (!byExec[s.executorId]) byExec[s.executorId] = { name: s.executorName, count: 0, minutes: 0 };
      if (s.minutes != null) { byExec[s.executorId].count++; byExec[s.executorId].minutes += s.minutes; }
    });
    const totalMin = sessions.reduce((a, s) => a + (s.minutes || 0), 0);
    body.appendChild(el(`<p class="hint" style="margin:0 0 16px">Fiecare lucrare este cronometrată din momentul în care Agentul Cleaning apasă <strong>«Începe lucrul»</strong> până la <strong>«locația e gata»</strong>.</p>`));
    if (!sessions.length) { body.appendChild(el(`<p class="hint">Nicio activitate cronometrată încă.</p>`)); return; }
    body.appendChild(el(`
      <div class="section-title" style="margin-top:0">Rezumat pe Agent Cleaning</div>
      <div class="grid cols-3" style="margin-bottom:8px">
        ${Object.values(byExec).map(e => `<div class="card stat"><span class="label">${esc(e.name)}</span><span class="value">${fmtDur(e.minutes)}</span><span class="hint">${e.count} lucrări · medie ${fmtDur(e.count ? Math.round(e.minutes / e.count) : 0)}</span></div>`).join("")}
      </div>
      <div class="hint" style="margin:0 0 16px">Timp total lucrat (toți): <strong>${fmtDur(totalMin)}</strong></div>`));
    body.appendChild(el(`
      <div class="card">
        <div class="section-title" style="margin-top:0">Toate sesiunile</div>
        <div class="timesheet">
          <div class="ts-row ts-head ts-6"><span>Data</span><span>Agent Cleaning</span><span>Adresă</span><span>Început</span><span>Terminat</span><span>Durată</span></div>

              <span class="ts-addr">${esc(s.address)}</span>

              <span class="ts-dur">${s.inProgress ? "—" : fmtDur(s.minutes)}</span>

        </div>
      </div>`));
  }

    const wrap = el(`<div class="req"></div>`);
    owners.forEach(o => {
      const c = S.linenCircuitOf(o.id);
      const sum = c.atLocation + c.atLaundry + c.atExecutor;
      const card = el(`
        <div class="req-item">

              <label>🧺 La spălătorie<input type="number" name="atLaundry" min="0" value="${c.atLaundry}"/></label>

        toast("Circuit lenjerie actualizat.", "ok"); renderAdminLinen(u);

  /* Panou de statistici grafice (admin): cifra de afaceri, comision platformă, comision parteneri */
  function renderAdminCharts() {
    const body = $("#admBody");
    const rs = S.requests().filter(r => r.status !== S.STATUS.NOU && r.status !== S.STATUS.ANULAT);
    const M = {};
    let revenue = 0, commission = 0, partners = 0;
    rs.forEach(r => {
      const b = S.breakdown(r);
      let p = 0;
      if (r.executorId) p += b.cleaningPayout + b.consExecutantPayout;
      if (b.linenTaken) p += b.linenPayout;
      if (b.consLaundryPayout > 0) p += b.consLaundryPayout;
      revenue += b.total; commission += b.commission; partners += p;
      const k = String(r.date || "").slice(0, 7);
      if (k) { (M[k] = M[k] || { rev: 0, com: 0, part: 0 }); M[k].rev += b.total; M[k].com += b.commission; M[k].part += p; }
    });
    const retained = Math.max(0, Math.round((revenue - commission - partners) * 100) / 100);
    const now = new Date();
    const months = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`, label: CAL_MONTHS[d.getMonth()].slice(0, 3) }); }
    const maxRev = Math.max(1, ...months.map(m => (M[m.key] || {}).rev || 0));
    const W = 580, H = 230, pad = 30, gap = (W - pad * 2) / months.length, bw = gap * 0.5;
    const bars = months.map((m, i) => {
      const d = M[m.key] || { rev: 0, com: 0, part: 0 };
      const ret = Math.max(0, d.rev - d.com - d.part);
      const x = pad + i * gap + (gap - bw) / 2;
      let acc = 0; const segs = [];
      [["#22d3ee", d.com], ["#f59e0b", d.part], ["#64748b", ret]].forEach(([c, val]) => {
        const h = (val / maxRev) * (H - pad * 2);
        if (h > 0.5) { segs.push(`<rect x="${x.toFixed(1)}" y="${(H - pad - acc - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" rx="2"/>`); acc += h; }
      });
      return segs.join("") +
        `<text x="${(x + bw / 2).toFixed(1)}" y="${H - pad + 14}" text-anchor="middle" font-size="11" fill="#94a3b8">${m.label}</text>` +
        (d.rev > 0 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(H - pad - acc - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="#cbd5e1">${leiOf(d.rev)}</text>` : "");
    }).join("");
    const tot = Math.max(1, revenue);
    const pc = v => Math.round(v / tot * 1000) / 10;
    body.innerHTML = "";
    body.appendChild(el(`
      <div class="grid cols-4">
        <div class="card stat"><span class="label">💰 Cifra de afaceri</span><span class="value">${money(revenue)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(revenue)} lei</small></span></div>
        <div class="card stat"><span class="label">🏦 Încasări (avans)</span><span class="value">${money(revenue)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(revenue)} lei</small></span></div>
        <div class="card stat"><span class="label">🏛️ Comision platformă</span><span class="value brand">${money(commission)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(commission)} lei</small></span></div>
        <div class="card stat"><span class="label">🤝 Comision către parteneri</span><span class="value" style="color:var(--warn)">${money(partners)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(partners)} lei</small></span></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="section-title" style="margin-top:0">Cifra de afaceri pe luni (lei)</div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:640px">${bars}</svg>
        <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:6px">
          <span><span style="display:inline-block;width:12px;height:12px;background:#22d3ee;border-radius:3px;vertical-align:-1px"></span> Comision platformă</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#f59e0b;border-radius:3px;vertical-align:-1px"></span> Către parteneri</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#64748b;border-radius:3px;vertical-align:-1px"></span> Reținut platformă</span>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="section-title" style="margin-top:0">Cum se împarte cifra de afaceri</div>
        <div style="display:flex;height:34px;border-radius:8px;overflow:hidden;margin:8px 0 10px;background:rgba(255,255,255,.06)">
          <div style="width:${pc(commission)}%;background:#22d3ee"></div>
          <div style="width:${pc(partners)}%;background:#f59e0b"></div>
          <div style="width:${pc(retained)}%;background:#64748b"></div>
        </div>
        <div style="font-size:13.5px;line-height:1.9">
          🏛️ <strong>Comision platformă</strong>: ${money(commission)} (${pc(commission)}%)<br>
          🤝 <strong>Comision către parteneri</strong> (Agenți + lenjerie): ${money(partners)} (${pc(partners)}%)<br>
          🏦 <strong>Reținut platformă</strong> (nealocat): ${money(retained)} (${pc(retained)}%)
        </div>
      </div>
      ${revenue === 0 ? `<p class="hint" style="margin-top:12px">Încă nu există încasări. Graficele se populează pe măsură ce clienții plătesc solicitări.</p>` : ""}
    `));
  }

  /* Admin: editează categoria (rolul) + firma/IBAN + zona unui utilizator.
     Pentru Agent Cleaning / Serviciu lenjerie, datele de firmă și zona sunt OBLIGATORII. */
  function adminEditUserModal(usr) {
    if (!usr) return;
    const ROLES = [["solicitant", "Solicitant"], ["executant", "Agent Cleaning"], ["spalatorie", "Serviciu lenjerie"], ["admin", "Administrator"]];
    const b = usr.business || {};
    const current = S.rolesOf(usr);
    modal(`
      <h2>Editează utilizator</h2>
      <p class="sub">${esc(usr.name)} · ${esc(usr.email)}</p>
      <div class="field"><label>Categorii (roluri) — poți alege mai multe</label>
        <div class="area-checks" id="euRoles">
          ${ROLES.map(r => `<label class="area-check"><input type="checkbox" value="${r[0]}" ${current.includes(r[0]) ? "checked" : ""}/> <span>${r[1]}</span></label>`).join("")}
        </div>
      </div>
      <div id="euBiz">
        <div class="field"><label>Zone de activitate <span id="euAreaHint" style="color:var(--muted,#8aa);font-weight:400"></span></label>
          <div class="area-checks" id="euAreas">${areaChecksHtml(S.areasOf(usr))}</div>
        </div>
        <div class="field"><label>Telefon</label><input id="euPhone" value="${esc(usr.phone || "")}" placeholder="07xx xxx xxx"/></div>
        <div class="field"><label>Formă juridică</label>
          <select id="euType">${["PFA", "PFI", "SRL"].map(t => `<option ${b.type === t ? "selected" : ""}>${t}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Denumire firmă</label><input id="euName" value="${esc(b.name || "")}"/></div>
        <div class="field"><label>CUI / CIF</label><input id="euCui" value="${esc(b.cui || "")}"/></div>
        <div class="field"><label>Reg. Comerțului (opțional)</label><input id="euReg" value="${esc(b.regCom || "")}"/></div>
        <div class="field"><label>IBAN</label><input id="euIban" value="${esc(b.iban || "")}"/></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-soft" onclick="_closeModal()">Renunță</button>
        <button class="btn" style="flex:1" id="euSave">Salvează</button>
      </div>
    `);
    const bizWrap = $("#euBiz");
    const selectedRoles = () => [...document.querySelectorAll("#euRoles input:checked")].map(i => i.value);
    const needsBiz = () => selectedRoles().some(r => r === "executant" || r === "spalatorie");
    const zoneMax = () => { const rs = selectedRoles(); return rs.includes("spalatorie") ? 99 : (rs.includes("executant") ? 4 : 1); };
    const applyAreaLimit = () => {
      const max = zoneMax();
      const boxes = [...document.querySelectorAll("#euAreas input")];
      if (max < 99) { const checked = boxes.filter(x => x.checked); if (checked.length > max) checked.slice(max).forEach(x => (x.checked = false)); }
      const n = boxes.filter(x => x.checked).length;
      boxes.forEach(x => { if (!x.checked) x.disabled = max < 99 && n >= max; });
      const hint = $("#euAreaHint"); if (hint) hint.textContent = selectedRoles().includes("spalatorie") ? "(mai multe)" : (selectedRoles().includes("executant") ? "(max 4)" : "");
    };
    const refresh = () => { bizWrap.style.display = needsBiz() ? "" : "none"; applyAreaLimit(); };
    document.querySelectorAll("#euRoles input").forEach(x => x.addEventListener("change", refresh));
    document.querySelectorAll("#euAreas input").forEach(x => x.addEventListener("change", applyAreaLimit));
    refresh();
    $("#euSave").onclick = () => {
      const rs = selectedRoles();
      if (!rs.length) return toast("Alege cel puțin un rol.", "err");
      // protecție: nu lăsa platforma fără administrator
      if (S.hasRole(usr, "admin") && !rs.includes("admin") && S.users().filter(x => S.hasRole(x, "admin")).length <= 1)
        return toast("Nu poți lăsa platforma fără administrator.", "err");
      const order = ["solicitant", "executant", "spalatorie", "admin"];
      const primary = order.find(r => rs.includes(r)) || rs[0];
      const patch = { roles: rs, role: primary };
      if (needsBiz()) {
        const business = {
          type: $("#euType").value, name: ($("#euName").value || "").trim(), cui: ($("#euCui").value || "").trim(),
          regCom: ($("#euReg").value || "").trim(), iban: ($("#euIban").value || "").trim(),
        };
        const areas = [...document.querySelectorAll("#euAreas input:checked")].map(i => i.value);
        const phone = ($("#euPhone").value || "").trim();
        const max = zoneMax();
        if (!["PFA", "PFI", "SRL"].includes(business.type)) return toast("Alege forma juridică (PFA/PFI/SRL).", "err");
        if (!business.name || !business.cui || !business.iban) return toast("Completează firma, CUI/CIF și IBAN.", "err");
        if (!phone) return toast("Completează telefonul.", "err");
        if (!areas.length) return toast("Alege cel puțin o zonă.", "err");
        if (areas.length > max) return toast(`Maxim ${max} zone.`, "err");
        patch.business = business; patch.areas = areas; patch.area = areas[0]; patch.phone = phone;
      } else {
        patch.business = null; patch.area = null; patch.areas = null;
      }
      S.updateUser(usr.id, patch);
      const me = S.currentUser(); if (me && me.id === usr.id) activeRole = null;   // dacă m-am editat pe mine, resetez panoul
      closeModal(); toast("Utilizator actualizat.", "ok"); renderApp();
    };
  }

  /* ---------- Video înainte/după (dovadă despăgubiri) ---------- */
  function readVideoFile(file, cb) {
    if (!file) return cb(null);
    if (!/^video\//.test(file.type || "")) { toast("Alege un fișier video.", "err"); return; }
    const MAX = 15 * 1024 * 1024;   // ~20–30s clip de telefon
    if (file.size > MAX) { toast("Video prea mare (max 15 MB). Filmează mai scurt (~20–30s).", "err"); return; }
    const reader = new FileReader();
    reader.onload = () => cb(reader.result);
    reader.onerror = () => toast("Nu s-a putut citi video-ul.", "err");
    reader.readAsDataURL(file);
  }

    const inputId = `vid_${kind}_${r.id}`;
    return `<span class="vid-ctrl">
      <input type="file" accept="video/*" capture="environment" id="${inputId}" data-vidreq="${r.id}" data-vidkind="${kind}" hidden>
      <button class="btn btn-soft btn-sm" data-vidbtn="${inputId}">🎥 Video ${label}${has ? " · reîncarcă ↻" : " (filmează/încarcă)"}</button>
      ${has ? `<button class="btn btn-soft btn-sm" data-vidview="${kind}">▶️ vezi</button>` : ""}
    </span>`;
  }

  /* =========================================================
     CARD SOLICITARE (reutilizabil)
     ========================================================= */
  function requestCard(r, ctx, u) {
    const p = S.priceOf(r);
    const b = S.breakdown(r);
    const isExec = ctx.startsWith("executant");
    const requester = S.userById(r.requesterId);
    const cleaner = r.executorId ? S.userById(r.executorId) : null;
    const linenExec = r.linenExecutorId ? S.userById(r.linenExecutorId) : null;

    const amCleaner = isExec && r.executorId === u.id;
    const amLinen = isExec && r.linenExecutorId === u.id;
    // detaliile de check-in: vizibile adminului mereu, iar Agentului Cleaning doar după ce a preluat
    const loc = S.locationById(r.locationId);
    const showCheckin = ctx === "admin" || (isExec && (amCleaner || amLinen));
    const cleaningAvailable = !r.executorId && r.status === S.STATUS.PLATIT;
    const linenAvailable = r.linens && !r.linenExecutorId &&
      [S.STATUS.PLATIT, S.STATUS.ACCEPTAT, S.STATUS.IN_PROGRES].includes(r.status);

    const rel = `<span class="badge payout-released">eliberată</span>`;
    const pend = `<span class="badge payout-pending">la finalizare</span>`;
    const cleaningBadge = r.payoutStatus === "released" ? rel : pend;
    const linenBadge = r.linenPayoutStatus === "released" ? rel : pend;

    // caseta cu împărțirea banilor
    let payoutBox = "";
    if (isExec) {
      const cleaningRow = amCleaner
        ? `<div class="prow"><span>Curățenie — tu primești</span><span>${money(b.cleaningPayout)} ${cleaningBadge}</span></div>`
        : cleaner
          ? `<div class="prow"><span>Curățenie — ${esc(cleaner.name)}</span><span>${money(b.cleaningPayout)}</span></div>`
          : `<div class="prow"><span>Curățenie — disponibilă</span><span>poți primi ${money(b.cleaningPayout)}</span></div>`;
      let linenRow;
      if (!r.linens) linenRow = `<div class="prow"><span>Lenjerie</span><span>fără (a clientului)</span></div>`;
      else if (r.linenExecutorId === u.id) linenRow = `<div class="prow"><span>Lenjerie — tu primești</span><span>${money(b.linenPayout)} ${linenBadge}</span></div>`;
      else if (amCleaner) linenRow = `<div class="prow"><span>Lenjerie (${r.linenSets} seturi)</span><span>${r.linenDeclined ? "preia Serviciul de lenjerie" : "o poți prelua +" + money(b.linenPayout)}</span></div>`;
      else linenRow = `<div class="prow"><span>Lenjerie (${r.linenSets} seturi)</span><span>o decide Agentul Cleaning de curățenie</span></div>`;
      const consRow = (b.consExecutantPayout > 0 && amCleaner)
        ? `<div class="prow"><span>Consumabile (${C.consumableSplit.executant}% din adaos)</span><span>+${money(b.consExecutantPayout)}</span></div>` : "";
      payoutBox = `<div class="payout">
        <div class="prow"><span>Client plătește</span><span>${money(b.total)}</span></div>
        <div class="prow comm"><span>Comision platformă (${b.pct}%)</span><span>−${money(b.commission)}</span></div>
        ${cleaningRow}${linenRow}${consRow}
      </div>`;
    } else if (ctx === "admin") {
      payoutBox = `<div class="payout">
        <div class="prow"><span>Încasat de la client</span><span>${money(b.total)}</span></div>
        ${r.linens && r.linenSets > 0 ? `<div class="prow"><span>din care lenjerie (${r.linenSets} × ${C.linenSetPriceRon} lei)</span><span>${b.linenRon} lei ≈ ${money(b.linenEur)}</span></div>` : ""}
        <div class="prow comm"><span>Comision platformă (${b.pct}%)</span><span>${money(b.commission)}</span></div>
        <div class="prow"><span>Curățenie → ${cleaner ? esc(cleaner.name) : "neatribuit"}</span><span>${money(b.cleaningPayout)} ${r.executorId ? cleaningBadge : ""}</span></div>
        ${r.linens ? `<div class="prow"><span>Lenjerie → ${linenExec ? esc(linenExec.name) : "nepreluat"}</span><span>${b.linenTaken ? money(b.linenPayout) + " " + linenBadge : money(b.linenPayout) + " · platformă"}</span></div>` : ""}
      </div>`;
    }

    // lista Agenților Cleaning înscriși — solicitantul alege (când e plătită și neatribuită)
    let applicantsBox = "";
    if (ctx === "solicitant" && r.status === S.STATUS.PLATIT && !r.executorId) {
      const apps = S.applicantsOf(r.id);
      applicantsBox = `<div class="applicants">
        <div class="ap-title">🧹 Agenți Cleaning înscriși (${apps.length}) — alege pe cine dorești</div>
        ${apps.length ? apps.map(a => `
          <div class="ap-row">
            <div class="ap-who">${avatarHtml(a, 34)}<span><strong>${esc(a.name)}</strong> ${ratingInline(a.id)}<br><small class="hint">${esc((a.business && a.business.name) || "")}</small></span></div>
            <button class="btn btn-ok btn-sm" data-choose="${a.id}">Alege</button>
          </div>`).join("")
          : `<p class="hint" style="margin:0">Se așteaptă înscrieri de la Agenții Cleaning din zona ta…</p>`}
      </div>`;
    }

    // widget de recenzie (solicitant → Agent Cleaning, după finalizare) — doar cu ≥5 solicitări/lună
    let reviewBox = "";
    if (ctx === "solicitant" && r.status === S.STATUS.FINALIZAT && cleaner) {
      const existing = S.reviewByRequest(r.id, u.id);
      const elig = S.canReview(u.id, r);
      reviewBox = existing
        ? `<div class="review-box done">⭐ Evaluarea ta pentru ${esc(cleaner.name)}: ${starsHtml(existing.stars)} ${existing.comment ? "· „" + esc(existing.comment) + "”" : ""}</div>`
        : !elig.ok
          ? `<div class="review-box done">🔒 Recenziile sunt disponibile clienților cu <strong>minim ${elig.need} solicitări pe lună</strong>. În ${elig.ym} ai ${elig.count} — mai fă ${elig.need - elig.count} ca să poți evalua.</div>`
          : `<div class="review-box" data-review-to="${cleaner.id}">
              <div class="rv-title">Evaluează Agentul Cleaning <strong>${esc(cleaner.name)}</strong> — acuratețea serviciului</div>
              <div class="star-pick">${[1, 2, 3, 4, 5].map(n => `<span class="star pick" data-star="${n}">★</span>`).join("")}</div>
              <input class="rv-comment" placeholder="Comentariu (opțional)" />
              <button class="btn btn-sm" data-act="submitReview" disabled>Trimite evaluarea</button>
            </div>`;
    }

    let actions = "";
    if (ctx === "solicitant") {
      if (r.refundedAt) {
        actions = `<span class="pill">💸 Rambursată: ${money(r.refundEur || 0)} <small>(reținut ${money(r.refundRetainedEur || 0)})</small></span>`;
      } else if (r.status === S.STATUS.NOU) {
        actions = `<button class="btn btn-ok btn-sm" data-act="pay">Plătește ${money(p.total)}</button>
        <button class="btn btn-soft btn-sm" data-act="cancel">Anulează</button>`;
      } else {
        const parts = [cleaner ? `<span class="pill">${avatarHtml(cleaner, 20)} ${esc(cleaner.name)} ${ratingInline(cleaner.id)}</span>` : `<span class="pill">🧹 în așteptare / alegere Agent Cleaning</span>`];
        if (r.linens) {
          parts.push(linenExec ? `<span class="pill">🧺 lenjerie: ${esc(linenExec.name)}</span>`
            : r.linenDeclined ? `<span class="pill">🧺 lenjerie: la spălătorie</span>`
            : `<span class="pill">🧺 lenjerie: în decizia Agentului Cleaning</span>`);
        }
        // opțiune rambursabilă: buton cât timp e eligibil (înainte de 9:00 în ziua curățeniei)
        if (S.canRefund(r).ok) {
          const ri = S.refundInfo(r);
          parts.push(`<button class="btn btn-soft btn-sm" data-act="refund">🔓 Cere rambursarea (${money(ri.refundEur)})</button>`);
        } else if (r.refundable) {
          parts.push(`<span class="pill">🔓 Rambursabil${S.canRefund(r).reason === "deadline" ? " · termen expirat" : ""}</span>`);
        }
        // video de la Agentul Cleaning (dacă există) — pentru dovadă / despăgubiri
        if (S.hasVideo(r, "before")) parts.push(`<button class="btn btn-soft btn-sm" data-vidview="before">🎥 Video înainte</button>`);
        if (S.hasVideo(r, "after")) parts.push(`<button class="btn btn-soft btn-sm" data-vidview="after">🎥 Video după</button>`);
        actions = parts.join("");
      }
    } else if (isExec) {
      const acts = [];
      if (cleaningAvailable) {
        acts.push(S.hasApplied(r.id, u.id)
          ? `<span class="pill">✅ Te-ai înscris · în așteptarea alegerii</span> <button class="btn btn-soft btn-sm" data-act="withdraw">Retrage</button>`
          : `<button class="btn btn-ok btn-sm" data-act="apply">✋ Înscrie-mă la această solicitare</button>`);
      }
      if (amCleaner) {
        if (r.status === S.STATUS.ACCEPTAT) acts.push(`<button class="btn btn-sm" data-act="start">Începe lucrul</button>`);
        else if (r.status === S.STATUS.IN_PROGRES) acts.push(`<button class="btn btn-ok btn-sm" data-act="ready">🔔 Anunță: locația e gata pentru oaspeți</button>`);
        else if (r.status === S.STATUS.FINALIZAT) acts.push(`<span class="pill">✅ Locația e gata · client anunțat</span>`);

        // Video înainte/după — dovadă pentru despăgubiri (filmează direct de pe telefon sau încarcă)
        if (r.status !== S.STATUS.ANULAT) {
          acts.push(videoControls(r, "before"));
          acts.push(videoControls(r, "after"));
          acts.push(`<span class="hint" style="flex-basis:100%;font-size:12px;color:var(--muted,#8aa)">🎥 Video înainte/după — necesar pentru <strong>despăgubiri</strong> (Airbnb/Booking). Îl faci la <strong>cererea solicitantului</strong> sau dacă la sosire locația e <strong>foarte murdară</strong>.</span>`);
        }

        // decizia pentru lenjerie — independentă de finalizarea curățeniei:
        // rămâne disponibilă până când lenjeria e preluată sau refuzată (chiar și după «gata»)
        if (r.linens && r.status !== S.STATUS.ANULAT) {
          if (r.linenExecutorId === u.id) {
            acts.push(r.linenDone ? `<span class="pill">✅ Lenjerie gata</span>` : `<button class="btn btn-ok btn-sm" data-act="finishLinen">🧺 Lenjerie gata</button>`);
          } else if (r.linenExecutorId) {
            // preluată de un Serviciu de lenjerie → arată contactul pentru coordonare
            const lu = S.userById(r.linenExecutorId);
            acts.push(`<span class="pill">🧺 Lenjeria — preluată de ${esc(lu ? lu.name : "Serviciul de lenjerie")}</span>`);
            if (r.linenPickup) acts.push(`<span class="pill">📍 Ridicare: ${esc(r.linenPickup.address)}</span>`);
            if (lu) acts.push(contactPill(lu, "Serviciu lenjerie"));
          } else if (r.linenDeclined) {
            acts.push(`<span class="pill">🧺 Lenjeria — trimisă la Serviciul de lenjerie (în așteptarea preluării)</span> <button class="btn btn-soft btn-sm" data-act="takeLinen">preiau totuși (+${money(b.linenPayout)})</button>`);
            if (r.linenPickup) acts.push(`<span class="pill">📍 Ridicare: ${esc(r.linenPickup.address)}</span>`);
          } else {
            acts.push(`<button class="btn btn-soft btn-sm" data-act="takeLinen">🧺 Preiau lenjeria la spălat (+${money(b.linenPayout)})</button>
              <button class="btn btn-soft btn-sm" data-act="declineLinen">Nu preiau lenjeria</button>`);
          }
        }
      }
      actions = acts.join("");
    } else if (ctx === "admin") {
      actions = `<span class="pill">Solicitant: ${esc(requester ? requester.name : "?")}</span>
        ${cleaner ? `<span class="pill">🧹 ${esc(cleaner.name)}</span>` : ""}
        ${linenExec ? `<span class="pill">🧺 ${esc(linenExec.name)}</span>` : ""}
        ${S.hasVideo(r, "before") ? `<button class="btn btn-soft btn-sm" data-vidview="before">🎥 Video înainte</button>` : ""}
        ${S.hasVideo(r, "after") ? `<button class="btn btn-soft btn-sm" data-vidview="after">🎥 Video după</button>` : ""}`;
    }

    // adresa completă apare doar după ce Agentul Cleaning preia (curățenie sau lenjerie)
    const showFullAddress = !isExec || amCleaner || amLinen;
    const addr = showFullAddress ? esc(r.address) : "Adresa completă apare după preluare";

    const card = el(`
      <div class="req-item">
        <div class="req-top">
          <div>
            <h3>Curățenie · ${r.sqm} m² <span class="badge ${r.status}">${S.STATUS_LABEL[r.status]}</span></h3>
            <div class="req-meta">
              <span>📍 ${esc(r.area)}</span>
              <span>🏠 ${addr}</span>
              ${showFullAddress && r.mapsUrl ? `<span>${mapsLink(r.mapsUrl)}</span>` : ""}
              <span>📅 ${esc(r.date)} · ${esc(r.startTime || r.time || "")}${r.endTime ? "–" + esc(r.endTime) : ""}</span>
              <span>🛏️ ${r.linens ? r.linenSets + " set lenjerie" : "fără lenjerie (proprie)"}</span>
              ${b.peakPct ? `<span class="pill" style="border-color:var(--warn);color:var(--warn)">+${b.peakPct}% vârf</span>` : ""}
              ${b.surPct ? `<span class="pill" style="border-color:var(--warn);color:var(--warn)">+${b.surPct}% weekend/sărbătoare</span>` : ""}
            </div>
          </div>
          <div class="req-price">
            <span class="big">${money(p.total)}</span>
            <small>≈ ${leiOf(p.total)} lei · ${money(p.cleaningNet)} curățenie${p.linenIncluded && p.linenSets > 0 ? " + " + money(p.linenEur) + " lenjerie" : ""}</small>
          </div>
        </div>
        ${r.readyNotified ? `<div class="ready-banner">🎉 Locația este gata pentru oaspeți!${cleaner ? ` Anunțat de <strong>${esc(cleaner.name)}</strong>` : ""}${r.readyAt ? ` · ${fmtWhen(r.readyAt)}` : ""}</div>` : ""}
        ${r.notes ? `<div class="req-notes">📝 ${esc(r.notes)}</div>` : ""}
        ${showCheckin && loc ? checkinBox(loc.checkin) : ""}
        ${showCheckin && loc && loc.listingUrl ? `<div class="req-notes">🛎️ Cum trebuie să arate locația la final: <a class="link" href="${esc(loc.listingUrl)}" target="_blank" rel="noopener">deschide anunțul Booking/Airbnb</a></div>` : ""}
        ${(ctx === "solicitant" || ctx === "admin" || amCleaner) ? shoppingBox(r, amCleaner ? "exec" : "other") : ""}
        ${payoutBox}
        ${applicantsBox}
        ${reviewBox}
        <div class="req-body">
          <div class="btn-row">${actions}</div>
        </div>
      </div>
    `);

    // widget de recenzie: alegerea stelelor
    let pickedStars = 0;
    const stars = card.querySelectorAll(".star.pick");
    stars.forEach(st => st.onclick = () => {
      pickedStars = Number(st.dataset.star);
      stars.forEach(x => x.classList.toggle("on", Number(x.dataset.star) <= pickedStars));
      const btn = card.querySelector('[data-act="submitReview"]');
      if (btn) btn.disabled = false;
    });

    // handlers
    card.querySelectorAll("[data-act]").forEach(btn => btn.onclick = async () => {
      const act = btn.dataset.act;
      if (act === "pay") openPayment(r.id, u);
      else if (act === "cancel") { S.cancelRequest(r.id); toast("Solicitare anulată.", ""); renderApp(); }
      else if (act === "refund") {
        const ri = S.refundInfo(r);
        if (!confirm(`Ceri rambursarea? Primești ${money(ri.refundEur)} înapoi (se reține ${money(ri.retainedEur)} = ${ri.retainPct}%). Solicitarea se anulează.`)) return;
        btn.disabled = true; btn.textContent = "Se procesează…";
        const res = await S.requestRefund(r.id);
        if (res.ok) { toast(`Rambursare efectuată: ${money(res.refundEur)} înapoi.`, "ok"); renderApp(); }
        else { toast(res.error || "Rambursarea a eșuat.", "err"); btn.disabled = false; btn.textContent = "🔓 Cere rambursarea"; }
      }
      else if (act === "apply") {
        const res = S.applyToRequest(r.id, u.id);
        if (res.ok) { toast("Te-ai înscris! Solicitantul te poate alege.", "ok"); renderApp(); }
        else toast("Nu te poți înscrie la această solicitare.", "err");
      }
      else if (act === "withdraw") { S.withdrawApplication(r.id, u.id); toast("Ți-ai retras înscrierea.", ""); renderApp(); }
      else if (act === "takeLinen") {
        const res = S.takeLinenService(r.id, u.id);
        if (res.ok) { toast("Ai preluat lenjeria la spălat (+plată).", "ok"); renderApp(); }
        else toast("Nu poți prelua lenjeria pentru această lucrare.", "err");
      }
      else if (act === "declineLinen") { declineLinenModal(r, u); }
      else if (act === "finishLinen") { S.finishLinenService(r.id); toast("Lenjerie finalizată. Plata se eliberează.", "ok"); renderApp(); }
      else if (act === "start") { S.startWork(r.id, u.id); toast("Ai început lucrul — cronometrul pornește.", "ok"); renderApp(); }
      else if (act === "ready") { S.markReady(r.id); toast("Ai anunțat clientul: locația e gata pentru oaspeți!", "ok"); renderApp(); }
      else if (act === "submitReview") {
        if (!pickedStars) return toast("Alege numărul de stele.", "err");
        const comment = (card.querySelector(".rv-comment") || {}).value || "";
        const res = S.addReview({ requestId: r.id, fromId: u.id, toId: cleaner.id, stars: pickedStars, comment });
        if (!res.ok) return toast(res.error, "err");
        toast("Mulțumim pentru evaluare!", "ok"); renderApp();
      }
    });
    // solicitantul alege un Agent Cleaning înscris
    card.querySelectorAll("[data-choose]").forEach(btn => btn.onclick = () => {
      const res = S.chooseExecutor(r.id, btn.dataset.choose);
      if (res.ok) { const ex = S.userById(btn.dataset.choose); toast("L-ai ales pe " + (ex ? ex.name : "Agent Cleaning") + "!", "ok"); renderApp(); }
      else toast(res.error || "Nu s-a putut alege Agentul Cleaning.", "err");
    });
    card.querySelectorAll("[data-vidbtn]").forEach(b => b.onclick = () => {
      const inp = card.querySelector("#" + b.dataset.vidbtn);
      if (inp) inp.click();
    });
    card.querySelectorAll('input[type="file"][data-vidkind]').forEach(inp => inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      readVideoFile(f, async (dataUrl) => {
        if (!dataUrl) return;
        toast("Se încarcă video-ul…", "");
        const res = await S.uploadVideo(inp.dataset.vidreq, inp.dataset.vidkind, dataUrl);
        if (res && res.ok) { toast("Video încărcat.", "ok"); renderApp(); }
        else toast((res && res.error) || "Încărcarea a eșuat.", "err");
      });
      e.target.value = "";
    });
    card.querySelectorAll("[data-vidview]").forEach(b => b.onclick = () => {
      const k = b.dataset.vidview;
      const url = S.videoUrl(r.id, k);
      if (!url) { toast("Video indisponibil.", "err"); return; }
      videoModal(url, "Video " + (k === "before" ? "înainte" : "după"));
    });
    return card;
  }

  function emptyState(title, sub) {
    return el(`<div class="empty card"><span class="ico">📭</span><h3 style="margin:0 0 6px">${esc(title)}</h3><p style="margin:0">${esc(sub)}</p></div>`);
  }

  function _trPhrase(s) {
    const D = DICTS[LANG];
    if (!D || !s) return s;
    const t = s.trim();
    if (!t) return s;
    const lead = s.slice(0, s.length - s.trimStart().length);
    const tail = s.slice(s.trimEnd().length);
    if (D[t] != null) return lead + D[t] + tail;
    // tab-uri cu numărător: „🧹 Lucrările mele (5)" → tradu prefixul, păstrează (5)
    const m = t.match(/^(.*?)\s*(\([^)]*\))\s*$/);
    if (m && D[m[1]] != null) return lead + D[m[1]] + " " + m[2] + tail;
    return s;
  }
  function translateTree(node) {
    if (LANG === "ro" || !node) return;
    if (node.nodeType === 3) { if (node.nodeValue && node.nodeValue.trim()) node.nodeValue = _trPhrase(node.nodeValue); return; }
    if (node.nodeType !== 1) return;
    if (node.id === "langSelect") return;
    ["placeholder", "title", "aria-label"].forEach(a => { const v = node.getAttribute && node.getAttribute(a); if (v) node.setAttribute(a, _trPhrase(v)); });
    if (node.tagName === "INPUT" && (node.type === "submit" || node.type === "button") && node.value) node.value = _trPhrase(node.value);
    let c = node.firstChild;
    while (c) { const next = c.nextSibling; translateTree(c); c = next; }
  }
  function initLang() {
    if (_langInited) return; _langInited = true;
    let sel = document.getElementById("langSelect");
    if (!sel) {
      sel = document.createElement("select");
      sel.id = "langSelect"; sel.className = "lang-select";
      sel.innerHTML = '<option value="ro">🌐 RO</option><option value="en">🌐 EN</option><option value="ne">🌐 ने</option>';
      document.body.appendChild(sel);
    }
    sel.value = LANG;
    sel.onchange = () => { try { localStorage.setItem("sgc_lang", sel.value); } catch (e) {} location.reload(); };
    const obs = new MutationObserver(muts => { if (LANG === "ro") return; muts.forEach(m => m.addedNodes.forEach(n => translateTree(n))); });
    obs.observe(document.body, { childList: true, subtree: true });
    if (LANG !== "ro") translateTree(document.body);
  }

  // onRemote = re-randare când alt utilizator schimbă datele (polling).
  // La întoarcerea de pe pagina de plată Stripe (success_url / cancel_url)
  async function handlePaymentReturn() {
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session_id");
    const paidId = params.get("paid");
    const cancelId = params.get("paycancel");
    const vipReturn = params.get("vip");
    const vipCancel = params.get("vipcancel");
    const invReturn = params.get("invest");
    const invCancel = params.get("investcancel");
    if (!sessionId && !paidId && !cancelId && !vipReturn && !vipCancel && !invReturn && !invCancel) return;
    history.replaceState({}, "", location.pathname);   // curăță URL-ul
    if (cancelId || vipCancel || invCancel) { toast("Plată anulată.", ""); return; }
    if (sessionId) {
      const res = await S.verifyPayment(sessionId);
      if (res && res.ok && res.paid && res.invest) {
        await S.refresh();
        toast("Contract semnat și investiție înregistrată! 📈", "ok");
      } else if (res && res.ok && res.paid && res.vip) {
        await S.refresh();
        toast("Bine ai venit în clubul VIP! 👑", "ok");
      } else if (res && res.ok && res.paid) {
        await S.refresh();
        toast("Plată confirmată! Solicitarea e vizibilă Agenților Cleaning.", "ok");

        toast("Confirmăm plata… dacă nu apare imediat, reîmprospătează în câteva secunde.", "");
      }
    }
  }
