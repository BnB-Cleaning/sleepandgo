    // ---- Sesiune / auth ----
    currentUser() { return db.users.find(u => u.id === db.session) || null; },
    async login(email, password) {
      if (MODE === "api") {
        const r = await apiPOST("/api/auth/login", { email, password });
        if (!r.ok) return { ok: false, error: r.error || "Autentificare eșuată." };
        await refreshState();
        db.session = r.user.id;
        return { ok: true, user: r.user };
      }
      const u = db.users.find(x => x.email.toLowerCase() === email.toLowerCase() && x.password === password);
      if (!u) return { ok: false, error: "Email sau parolă incorecte." };
      db.session = u.id; save(db); return { ok: true, user: u };
    },
    async register(data) {
      const { name, email, password, role, area, business, phone, address } = data;
      if (MODE === "api") {
        const r = await apiPOST("/api/auth/register", data);
        if (!r.ok) return { ok: false, error: r.error || "Înregistrare eșuată." };
        await refreshState();
        db.session = r.user.id;
        return { ok: true, user: r.user };
      }
      if (db.users.some(u => u.email.toLowerCase() === email.toLowerCase()))
        return { ok: false, error: "Există deja un cont cu acest email." };
      const needsBusiness = role === "executant" || role === "spalatorie";
      if (needsBusiness) {
        if (!business || !CONFIG.businessTypes.includes(business.type))
          return { ok: false, error: "Te poți înregistra doar ca PFA, PFI sau SRL." };
        if (!business.name || !business.cui || !business.iban)
          return { ok: false, error: "Completează denumirea firmei, CUI/CIF și IBAN-ul." };
        if (!phone) return { ok: false, error: "Completează un număr de telefon de contact." };
      }
      const u = {
        id: uid("u"), name, email, password, role,
        area: needsBusiness ? area : null,
        business: needsBusiness ? business : null,
        phone: phone || "",
        address: address || "",   // adresă/sediu (Agent Cleaning) — folosită la ridicarea lenjeriei
      };
      db.users.push(u); db.session = u.id; save(db); return { ok: true, user: u };
    },
    async logout() {
      if (MODE === "api") { try { await apiPOST("/api/auth/logout", {}); } catch (e) {} }
      db.session = null;
      if (MODE !== "api") save(db);
    },
    updateUser(id, patch) {
      const u = db.users.find(x => x.id === id); if (!u) return;
      Object.assign(u, patch); save(db); return u;
    },

    // ---- Utilizatori ----
    users() { return db.users.slice(); },
    userById(id) { return db.users.find(u => u.id === id) || null; },
    // zonele în care activează un utilizator (Serviciul de lenjerie poate avea mai multe)
    areasOf(u) { const x = u && u.areas; return (Array.isArray(x) && x.length) ? x : (u && u.area ? [u.area] : []); },
    // există cel puțin un Agent Cleaning (curățenie) activ în zonă?
    hasActiveExecutorInArea(area) { return db.users.some(u => u.role === "executant" && u.area === area); },
    setAvatar(id, dataUrl) {
      const u = db.users.find(x => x.id === id); if (!u) return;
      u.avatar = dataUrl; save(db); return u;
    },

    // ---- Circuit lenjerie (per proprietar): locație ↔ spălătorie ↔ Agent Cleaning ----
    linenCircuitOf(ownerId) {
      const u = this.userById(ownerId);
      const c = (u && u.linenCircuit) || {};
      let received = Number(c.received || 0), atLocation = Number(c.atLocation || 0),
        atLaundry = Number(c.atLaundry || 0), atExecutor = Number(c.atExecutor || 0);
      // auto-init: seturi primite dar nedistribuite → toate „în locație" (le pune proprietarul)
      if (u && received > 0 && (atLocation + atLaundry + atExecutor) === 0) {
        atLocation = received;
        u.linenCircuit = { received, atLocation, atLaundry, atExecutor };
        save(db);
      }
      return { received, atLocation, atLaundry, atExecutor };
    },
    // mută automat k seturi între stări (k = lenjeriile solicitării), pentru proprietarul locației
    moveLinenForRequest(req, from, to) {
      if (!req || !req.linens) return;
      const loc = this.locationById(req.locationId);
      const ownerId = loc && loc.ownerId; if (!ownerId) return;
      const k = Number(req.linenSets) || 0; if (k <= 0) return;
      const u = this.userById(ownerId); if (!u) return;
      const c = this.linenCircuitOf(ownerId);   // asigură și inițializarea
      const move = Math.min(k, c[from]); if (move <= 0) return;
      c[from] -= move; c[to] += move;
      u.linenCircuit = { received: c.received, atLocation: c.atLocation, atLaundry: c.atLaundry, atExecutor: c.atExecutor };
      save(db);
    },
    setLinenCircuit(ownerId, patch) {
      const u = this.userById(ownerId); if (!u) return { ok: false };
      const c = this.linenCircuitOf(ownerId);
      const next = { ...c, ...patch };
      ["received", "atLocation", "atLaundry", "atExecutor"].forEach(k => next[k] = Math.max(0, Number(next[k]) || 0));
      u.linenCircuit = next; save(db); return { ok: true, circuit: next };
    },
    solicitants() { return db.users.filter(u => u.role === "solicitant"); },

    // ---- Închiriere lenjerii (înregistrări / lead-uri de pe landing) ----
    rentalLeads() { return (db.rentalLeads || []).slice().sort((a, b) => b.createdAt - a.createdAt); },
    async addRentalLead(data) {
      if (!data.name || !data.phone) return { ok: false, error: "Completează numele și telefonul." };
      if (MODE === "api") {
        const r = await apiPOST("/api/lead", { type: "rental", data });
        if (r.ok) await refreshState();
        return r;
      }
      if (!db.rentalLeads) db.rentalLeads = [];
      const lead = { id: uid("lead"), name: data.name, phone: data.phone, email: data.email || "", locations: Number(data.locations) || 0, note: data.note || "", createdAt: Date.now() };
      db.rentalLeads.push(lead); save(db); return { ok: true, lead };
    },

    // ---- Consumabile (catalog gestionat de admin) ----
    products() { return (db.products || []).slice(); },
    activeProducts() { return this.products().filter(p => p.active); },
    productById(id) { return (db.products || []).find(p => p.id === id) || null; },
    addProduct({ name, unit, priceRon, lowAt }) {
      if (!name || !(Number(priceRon) >= 0)) return { ok: false, error: "Completează denumirea și prețul." };
      if (!db.products) db.products = [];
      const p = { id: uid("p"), name, unit: unit || "buc", priceRon: Number(priceRon), lowAt: Number(lowAt) >= 0 ? Number(lowAt) : CONFIG.lowStockDefault, active: true };
      db.products.push(p); save(db); return { ok: true, p };
    },
    lowAtOf(product) { return (product && Number(product.lowAt) >= 0) ? Number(product.lowAt) : CONFIG.lowStockDefault; },
    updateProduct(id, patch) { const p = this.productById(id); if (!p) return; Object.assign(p, patch); save(db); return p; },
    setProductActive(id, active) { const p = this.productById(id); if (!p) return; p.active = !!active; save(db); return p; },
    // lista de cumpărături dintr-o solicitare (produs + cantitate + preț)
    consumablesList(req) {
      return (req.consumables || []).map(c => {
        const p = this.productById(c.productId);
        return p ? { name: p.name, unit: p.unit, qty: c.qty, priceRon: p.priceRon, lineRon: p.priceRon * c.qty } : null;
      }).filter(Boolean);
    },

    // ---- Stoc Agenți Cleaning (bază comună admin ↔ Agent Cleaning) ----
    executors() { return db.users.filter(u => u.role === "executant"); },
    // stocul unui Agent Cleaning, pentru toate produsele active
    stockList(executorId) {
      const u = this.userById(executorId); const stock = (u && u.stock) || {};
      return this.activeProducts().map(p => {
        const qty = Number(stock[p.id] || 0), low = this.lowAtOf(p);
        return { productId: p.id, name: p.name, unit: p.unit, qty, low, isLow: qty <= low };
      });
    },
    stockQty(executorId, productId) {
      const u = this.userById(executorId); return Number((u && u.stock && u.stock[productId]) || 0);
    },
    // valoarea stocului curent (lei) — plătită de Agent Cleaning (el cumpără produsele)
    stockValueRon(executorId) {
      return this.stockList(executorId).reduce((s, x) => {
        const p = this.productById(x.productId); return s + (p ? p.priceRon * x.qty : 0);
      }, 0);
    },
    // alerte de stoc scăzut către admin: Agent Cleaning × produs unde stocul ≤ pragul produsului
    stockAlerts() {
      const alerts = [];
      this.executors().forEach(ex => {
        this.activeProducts().forEach(p => {
          const qty = this.stockQty(ex.id, p.id);
          const low = this.lowAtOf(p);
          if (qty <= low) alerts.push({ executorId: ex.id, executorName: ex.name, productId: p.id, productName: p.name, qty, low });
        });
      });
      return alerts;
    },
    // adminul reaprovizionează stocul unui Agent Cleaning (+cantitate)
    supplyStock(executorId, productId, qty) {
      const u = this.userById(executorId); if (!u) return { ok: false };
      if (!u.stock) u.stock = {};
      u.stock[productId] = Number(u.stock[productId] || 0) + Number(qty || 0);
      u.stockSuppliedAt = Date.now();
      save(db); return { ok: true, qty: u.stock[productId] };
    },
    // scade din stoc consumabilele folosite la o lucrare
    deductStock(executorId, consumables) {
      const u = this.userById(executorId); if (!u || !consumables) return;
      if (!u.stock) u.stock = {};
      consumables.forEach(c => {
        u.stock[c.productId] = Math.max(0, Number(u.stock[c.productId] || 0) - Number(c.qty || 0));
      });
      save(db);
    },

    // ---- Recenzii (solicitant → Agent Cleaning, 1–5 stele) ----
    reviews() { return (db.reviews || []).slice(); },
    reviewsForExecutor(execId) { return this.reviews().filter(r => r.toId === execId).sort((a, b) => b.createdAt - a.createdAt); },
    ratingOf(execId) {
      const rs = this.reviews().filter(r => r.toId === execId);
      if (!rs.length) return { avg: 0, count: 0 };
      const sum = rs.reduce((s, r) => s + Number(r.stars || 0), 0);
      return { avg: Math.round((sum / rs.length) * 10) / 10, count: rs.length };
    },
    reviewByRequest(requestId, fromId) {
      return this.reviews().find(r => r.requestId === requestId && r.fromId === fromId) || null;
    },
    // câte solicitări (necanulate) are un solicitant într-o lună „AAAA-LL"
    requestsInMonth(requesterId, ym) {
      return db.requests.filter(r => r.requesterId === requesterId && r.status !== STATUS.ANULAT && String(r.date || "").slice(0, 7) === ym).length;
    },
    // eligibilitate recenzie: ≥ reviewMinPerMonth solicitări în luna lucrării
    canReview(requesterId, req) {
      const ym = String((req && req.date) || "").slice(0, 7);
      const count = this.requestsInMonth(requesterId, ym);
      const need = CONFIG.reviewMinPerMonth;
      return { ok: count >= need, count, need, ym };
    },
    addReview({ requestId, fromId, toId, stars, comment }) {
      if (!toId || !stars) return { ok: false, error: "Alege numărul de stele." };
      if (requestId && this.reviewByRequest(requestId, fromId)) return { ok: false, error: "Ai evaluat deja această lucrare." };
      const req = requestId ? this.requestById(requestId) : null;
      if (req) {
        const el = this.canReview(fromId, req);
        if (!el.ok) return { ok: false, error: `Poți lăsa recenzii doar cu minim ${el.need} solicitări în luna respectivă (ai ${el.count}).` };
      }
      if (!db.reviews) db.reviews = [];
      const rev = { id: uid("rev"), requestId: requestId || null, fromId, toId, stars: Number(stars), comment: comment || "", createdAt: Date.now() };
      db.reviews.push(rev); save(db); return { ok: true, rev };
    },

    // ---- Solicitări ----
    requests() { return db.requests.slice().sort((a, b) => b.createdAt - a.createdAt); },
    requestById(id) { return db.requests.find(r => r.id === id) || null; },

    createRequest(data) {
      // solicitările se pot trimite doar până la ora 20:00
      if (new Date().getHours() >= CONFIG.bookingCutoffHour)
        return { ok: false, error: `Solicitările se pot trimite doar până la ora ${CONFIG.bookingCutoffHour}:00. Te așteptăm mâine!` };
      // suprafața și locația provin dintr-o locație APROBATĂ (cu document validat de admin)
      const loc = this.locationById(data.locationId);
      if (!loc || loc.status !== "approved") return { ok: false, error: "Alege o locație aprobată." };
      const slot = validateSlot(data.startTime, data.endTime);
      if (!slot.ok) return { ok: false, error: slot.error };
      const req = {
        id: uid("r"),
        requesterId: db.session,
        executorId: null,
        locationId: loc.id,
        area: loc.area,
        address: loc.address,
        mapsUrl: loc.mapsUrl || "",   // snapshot link Google Maps
        sqm: Number(loc.sqm),      // exact din documentul aprobat
        linens: !!data.linens,     // cu lenjerie (tarif) / fără (lenjeria proprie a clientului)
        linenSets: Number(data.linenSets || 0),
        // serviciul de lenjerie poate fi preluat separat de un Agent Cleaning
        linenExecutorId: null, linenDone: false, linenPayoutStatus: "pending",
        date: data.date,
        startTime: data.startTime,
        endTime: data.endTime,
        notes: data.notes || "",
        status: STATUS.NOU,
        createdAt: Date.now(),
        paidAt: null,
        payoutStatus: "pending",   // pending → released (după finalizarea curățeniei)
        releasedAt: null,
        readyNotified: false, readyAt: null,  // Agentul Cleaning a anunțat că locația e gata pentru oaspeți
        workStartedAt: null, workFinishedAt: null,  // pontaj: început/terminat efectiv de Agent Cleaning
        applicants: [],   // Agenți Cleaning înscriși la curățenie; solicitantul alege unul
        // consumabile cerute de solicitant: [{productId, qty}] — Agentul Cleaning le cumpără
        consumables: (data.consumables || []).filter(c => Number(c.qty) > 0).map(c => ({ productId: c.productId, qty: Number(c.qty) })),
      };
      db.requests.push(req); save(db); return { ok: true, req };
    },

    payRequest(id) {
      const r = this.requestById(id); if (!r) return;
      r.status = STATUS.PLATIT; r.paidAt = Date.now(); save(db); return r;
    },

    // Agentul Cleaning se ÎNSCRIE la o solicitare (nu o preia direct — solicitantul alege)
    applyToRequest(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.status !== STATUS.PLATIT || r.executorId) return { ok: false };
      if (r.area !== (this.userById(executorId) || {}).area) return { ok: false };
      if (!r.applicants) r.applicants = [];
      if (!r.applicants.includes(executorId)) r.applicants.push(executorId);
      save(db); return { ok: true, r };
    },
    withdrawApplication(id, executorId) {
      const r = this.requestById(id); if (!r || !r.applicants) return;
      r.applicants = r.applicants.filter(x => x !== executorId); save(db); return r;
    },
    hasApplied(id, executorId) {
      const r = this.requestById(id); return !!(r && r.applicants && r.applicants.includes(executorId));
    },
    applicantsOf(id) {
      const r = this.requestById(id); return (r && r.applicants ? r.applicants : []).map(eid => this.userById(eid)).filter(Boolean);
    },
    // solicitantul ALEGE un Agent Cleaning dintre cei înscriși
    chooseExecutor(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.status !== STATUS.PLATIT || r.executorId) return { ok: false };
      if (!r.applicants || !r.applicants.includes(executorId)) return { ok: false, error: "Agentul Cleaning nu mai este disponibil." };
      r.executorId = executorId; r.status = STATUS.ACCEPTAT;
      // circuit lenjerie: agentul aduce seturile curate din stocul lui în locație (📦 → 🏠)
      this.moveLinenForRequest(r, "atExecutor", "atLocation");
      save(db); return { ok: true, r };
    },
    setStatus(id, status) {
      const r = this.requestById(id); if (!r) return;
      r.status = status;
      // la finalizare, plata Agentului Cleaning este eliberată din suma încasată în avans
      if (status === STATUS.FINALIZAT && r.payoutStatus !== "released") {
        r.payoutStatus = "released"; r.releasedAt = Date.now();
      }
      save(db); return r;
    },
    cancelRequest(id) { return this.setStatus(id, STATUS.ANULAT); },
    // Agentul Cleaning PORNEȘTE lucrul → status în progres + pontaj (ora de început)
    startWork(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.executorId !== executorId) return { ok: false };
      r.status = STATUS.IN_PROGRES;
      if (!r.workStartedAt) r.workStartedAt = Date.now();
      save(db); return { ok: true, r };
    },
    // Agentul Cleaning finalizează curățenia ȘI anunță clientul că locația e gata pentru oaspeți
    markReady(id) {
      const r = this.requestById(id); if (!r) return;
      this.setStatus(id, STATUS.FINALIZAT);   // finalizează + eliberează plata
      r.readyNotified = true; r.readyAt = Date.now();
      r.workFinishedAt = Date.now();          // pontaj: ora de terminare
      if (!r.workStartedAt) r.workStartedAt = r.workFinishedAt;  // fallback dacă n-a apăsat «Începe lucrul»
      // scade consumabilele folosite din stocul Agentului Cleaning de curățenie
      if (r.executorId && r.consumables && r.consumables.length) this.deductStock(r.executorId, r.consumables);
      // circuit lenjerie: lenjeria folosită pleacă la spălat (🏠 → 🧺)
      this.moveLinenForRequest(r, "atLocation", "atLaundry");
      save(db); return r;
    },
    // ---- Pontaj Agent Cleaning (statistici de timp) ----
    workSessionsOf(executorId) {
      return this.requests()
        .filter(r => r.executorId === executorId && r.workStartedAt)
        .map(r => ({
          id: r.id, address: r.address, area: r.area, date: r.date,
          startedAt: r.workStartedAt, finishedAt: r.workFinishedAt || null,
          minutes: r.workFinishedAt ? Math.max(0, Math.round((r.workFinishedAt - r.workStartedAt) / 60000)) : null,
          inProgress: !r.workFinishedAt,
        }))
        .sort((a, b) => b.startedAt - a.startedAt);
    },
    workStatsOf(executorId) {
      const done = this.workSessionsOf(executorId).filter(s => s.minutes != null);
      const totalMinutes = done.reduce((a, s) => a + s.minutes, 0);
      return { count: done.length, totalMinutes, avgMinutes: done.length ? Math.round(totalMinutes / done.length) : 0 };
    },
    // pentru admin: toate sesiunile de lucru, cu numele Agentului Cleaning
    allWorkSessions() {
      return this.requests()
        .filter(r => r.executorId && r.workStartedAt)
        .map(r => {
          const ex = this.userById(r.executorId);
          return {
            id: r.id, executorId: r.executorId, executorName: ex ? ex.name : "?",
            address: r.address, area: r.area, date: r.date,
            startedAt: r.workStartedAt, finishedAt: r.workFinishedAt || null,
            minutes: r.workFinishedAt ? Math.max(0, Math.round((r.workFinishedAt - r.workStartedAt) / 60000)) : null,
            inProgress: !r.workFinishedAt,
          };
        })
        .sort((a, b) => b.startedAt - a.startedAt);
    },

    // curățenii disponibile: plătite, fără Agent Cleaning de curățenie, în zona lui
    availableForExecutor(executor) {
      return this.requests().filter(r =>
        r.status === STATUS.PLATIT && !r.executorId && r.area === executor.area);
    },
    // solicitări de curățenie la care se pot înscrie Agenții Cleaning din zonă (nu sunt deja atribuite mie)
    openForExecutor(executor) {
      return this.availableForExecutor(executor)
        .filter(r => r.executorId !== executor.id)
        .sort((a, b) => b.createdAt - a.createdAt);
    },
    // lucrările mele: unde sunt Agent Cleaning de curățenie SAU de lenjerie
    jobsOfExecutor(executorId) {
      return this.requests().filter(r => r.executorId === executorId || r.linenExecutorId === executorId);
    },
    requestsOfRequester(requesterId) {
      return this.requests().filter(r => r.requesterId === requesterId);
    },

    // ---- Locații (cu document + aprobare admin) ----
    locations() { return (db.locations || []).slice().sort((a, b) => b.createdAt - a.createdAt); },
    locationById(id) { return (db.locations || []).find(l => l.id === id) || null; },
    locationsOfOwner(ownerId) { return this.locations().filter(l => l.ownerId === ownerId); },
    approvedLocationsOfOwner(ownerId) { return this.locations().filter(l => l.ownerId === ownerId && l.status === "approved"); },
    // locații aprobate ȘI cu Agent Cleaning activ în zonă (utilizabile pentru solicitări)
    usableLocationsOfOwner(ownerId) { return this.approvedLocationsOfOwner(ownerId).filter(l => this.hasActiveExecutorInArea(l.area)); },
    pendingLocations() { return this.locations().filter(l => l.status === "pending"); },

    createLocation(data) {
      if (!data.name || !data.address || !data.sqm) return { ok: false, error: "Completează denumirea, adresa și suprafața." };
      if (!data.doc || !data.doc.name) return { ok: false, error: "Atașează documentul cu dimensiunea locației." };
      if (!data.mapsUrl) return { ok: false, error: "Adaugă linkul Google Maps al locației." };
      const ci = data.checkin || {};
      if (!ci.interfon || !ci.lockbox) return { ok: false, error: "Completează detaliile de check-in: cod interfon și cod lockbox / yală electrică." };
      const loc = {
        id: uid("loc"), ownerId: db.session,
        name: data.name, address: data.address, area: data.area,
        mapsUrl: data.mapsUrl,     // link Google Maps (obligatoriu) — vizibil Agentului Cleaning și serviciului de lenjerie
        sqm: Number(data.sqm),
        doc: { name: data.doc.name, type: data.doc.type || "", dataUrl: data.doc.dataUrl || null },
        checkin: { interfon: ci.interfon, lockbox: ci.lockbox, notes: ci.notes || "" },
        status: "pending", createdAt: Date.now(), reviewedAt: null, rejectReason: "",
      };
      if (!db.locations) db.locations = [];
      db.locations.push(loc); save(db); return { ok: true, loc };
    },
    approveLocation(id) {
      const l = this.locationById(id); if (!l) return;
      l.status = "approved"; l.reviewedAt = Date.now(); l.rejectReason = ""; save(db); return l;
    },
    rejectLocation(id, reason) {
      const l = this.locationById(id); if (!l) return;
      l.status = "rejected"; l.reviewedAt = Date.now(); l.rejectReason = reason || ""; save(db); return l;
    },

    // câștigurile unui executant: curățenie (unde e executorId) + lenjerie (unde e linenExecutorId)
    earningsOfExecutor(executorId) {
      let released = 0, pending = 0;
      this.requests().filter(r => r.status !== STATUS.ANULAT).forEach(r => {
        const b = breakdown(r);
        if (r.executorId === executorId) {
          // curățenie + 50% adaos consumabile — Agentul Cleaning de curățenie
          const part = b.cleaningPayout + b.consExecutantPayout;
          if (r.payoutStatus === "released") released += part; else pending += part;
        }
        if (r.linens && r.linenExecutorId === executorId) {
          if (r.linenPayoutStatus === "released") released += b.linenPayout; else pending += b.linenPayout;
        }
        // serviciul de lenjerie primește și partea de consumabile (achiziție + 30% adaos)
        if (r.linenExecutorId === executorId && b.consLaundryPayout > 0) {
          if (r.payoutStatus === "released") released += b.consLaundryPayout; else pending += b.consLaundryPayout;
        }
      });
      return { released: round2(released), pending: round2(pending), total: round2(released + pending) };
    },

    // ---- Statistici admin ----
    stats() {
      const rs = db.requests;
      const paid = rs.filter(r => r.status !== STATUS.NOU && r.status !== STATUS.ANULAT);
      let revenue = 0, commission = 0, payoutReleased = 0, payoutPending = 0;
      paid.forEach(r => {
        const b = breakdown(r);
        revenue += b.total;
        commission += b.commission;
        // partea de curățenie + 50% adaos consumabile — doar dacă e preluată de un Agent Cleaning
        if (r.executorId) {
          const part = b.cleaningPayout + b.consExecutantPayout;
          if (r.payoutStatus === "released") payoutReleased += part; else payoutPending += part;
        }
        // partea de lenjerie — doar dacă a fost preluată de un Agent Cleaning
        if (b.linenTaken) {
          if (r.linenPayoutStatus === "released") payoutReleased += b.linenPayout; else payoutPending += b.linenPayout;
        }
        // consumabile preluate de serviciul de lenjerie (achiziție + 30% adaos)
        if (b.consLaundryPayout > 0) {
          if (r.payoutStatus === "released") payoutReleased += b.consLaundryPayout; else payoutPending += b.consLaundryPayout;
        }
      });
      return {
        totalRequests: rs.length,
        active: rs.filter(r => [STATUS.PLATIT, STATUS.ACCEPTAT, STATUS.IN_PROGRES].includes(r.status)).length,
        completed: rs.filter(r => r.status === STATUS.FINALIZAT).length,
        revenue: round2(revenue),
        commission: round2(commission),
        payoutReleased: round2(payoutReleased),
        payoutPending: round2(payoutPending),
        commissionPct: commissionPct(),
        executors: db.users.filter(u => u.role === "executant").length,
        requesters: db.users.filter(u => u.role === "solicitant").length,
      };
    },

    resetDemo() { if (MODE === "api") return { ok: false, error: "Indisponibil pe server." }; db = seed(); save(db); return { ok: true }; },
  };

  window.Store = Store;
})();

</script>
<script>
/* =========================================================
   Sleep & Go Cleaning — UI / logica aplicației
   ========================================================= */
(function () {
  const app = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  const S = window.Store;
  const C = S.CONFIG;

  /* ---------- helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (html) => {
    const t = document.createElement("template"); t.innerHTML = html.trim();
    // return the whole fragment when the template has several top-level nodes,
    // otherwise return the single root element
    return t.content.childElementCount > 1 ? t.content : t.content.firstElementChild;
  };
  const money = (n) => `${C.currency}${Number(n).toFixed(2)}`;
  const leiOf = (eur) => Math.round((Number(eur) || 0) * S.ronPerEur());       // € → lei (curs admin)
  const moneyBoth = (eur) => `${money(eur)} · ≈ ${leiOf(eur)} lei`;             // afișare dublă € + lei
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const fmtWhen = (ts) => { try { const d = new Date(ts); return d.toLocaleDateString("ro-RO") + " " + d.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  const fmtClock = (ts) => { try { return new Date(ts).toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return "—"; } };
  const fmtDur = (min) => { if (min == null) return "—"; const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h ${m}min` : `${m}min`; };
  const initials = (name) => String(name || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

  // Distribuie pagina: share nativ pe mobil, copiere link pe desktop
  function shareSite() {
    const url = (location.origin && location.origin !== "null") ? location.origin + "/" : location.href;
    const data = { title: "Sleep & Go Cleaning", text: "Curățenie în regim hotelier — Sleep & Go Cleaning", url };
    if (navigator.share) {
      navigator.share(data).catch(() => {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => toast("Link copiat în clipboard!", "ok")).catch(() => toast(url, ""));
    } else {
      const t = document.createElement("textarea"); t.value = url; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.focus(); t.select();
      try { document.execCommand("copy"); toast("Link copiat în clipboard!", "ok"); } catch (e) { toast(url, ""); }
      document.body.removeChild(t);
    }
  }
  const telHref = (p) => "tel:" + String(p || "").replace(/[^\d+]/g, "");
  const wazeUrl = (addr) => `https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes`;
  const mapsLink = (url) => url ? `<a class="maps-link" href="${esc(url)}" target="_blank" rel="noopener">📍 Deschide în Google Maps</a>` : "";
  // pastilă de contact: nume + telefon apelabil (comunicare Agent Cleaning ⇄ serviciu lenjerie)
  const contactPill = (person, label) => person && person.phone
    ? `<a class="pill contact" href="${telHref(person.phone)}">📞 ${esc(label)}: ${esc(person.name)} · ${esc(person.phone)}</a>`
    : (person ? `<span class="pill">${esc(label)}: ${esc(person.name)} · (fără telefon)</span>` : "");
  const avatarHtml = (user, size = 34) => {
    if (!user) return "";
    const st = `width:${size}px;height:${size}px;font-size:${Math.round(size / 2.6)}px`;
    return user.avatar
      ? `<span class="avatar" style="${st}"><img src="${user.avatar}" alt="" /></span>`
      : `<span class="avatar ph" style="${st}">${esc(initials(user.name))}</span>`;
  };
  const ratingInline = (execId) => { const rt = S.ratingOf(execId); return rt.count ? `<span class="rinline">★ ${rt.avg.toFixed(1)}</span>` : ""; };
  // stele: rating = {avg,count}; sau un număr fix pentru afișare
  const starsHtml = (rating) => {
    const avg = typeof rating === "number" ? rating : (rating ? rating.avg : 0);
    const count = typeof rating === "number" ? null : (rating ? rating.count : 0);
    let full = Math.round(avg);
    let s = "";
    for (let i = 1; i <= 5; i++) s += `<span class="star ${i <= full ? "on" : ""}">★</span>`;
    return `<span class="rating">${s}${count != null ? `<span class="rcount">${avg ? avg.toFixed(1) : "—"}${count ? " (" + count + ")" : ""}</span>` : ""}</span>`;
  };
  const checkinBox = (ci) => ci ? `<div class="checkin">
    <div class="ci-title">🔑 Detalii check-in</div>
    <div class="ci-grid">
      <div class="ci-item"><span class="ci-l">Interfon</span><span class="ci-v">${esc(ci.interfon || "—")}</span></div>
      <div class="ci-item"><span class="ci-l">Lockbox / yală</span><span class="ci-v">${esc(ci.lockbox || "—")}</span></div>
    </div>
    ${ci.notes ? `<div class="ci-notes">📝 ${esc(ci.notes)}</div>` : ""}
  </div>` : "";
  // ctx: "exec" (Agent Cleaning curățenie), "laundry" (serviciu lenjerie), "other" (admin/solicitant)
  const shoppingBox = (req, who = "other") => {
    const list = S.consumablesList(req);
    if (!list.length) return "";
    const b = S.breakdown(req);
    const csp = C.consumableSplit;
    let footer = "";
    if (who === "laundry") footer = `
      <div class="sh-row sh-total"><span>Cost achiziție (îl plătești tu)</span><span>${b.consumablesCostRon} lei</span></div>
      <div class="sh-row"><span>Primești (achiziție + ${csp.laundry}% adaos)</span><span>${money(b.consLaundryPayout)}</span></div>`;
    else if (who === "exec") footer = `
      <div class="sh-row sh-total"><span>Le primești de la Serviciul de lenjerie, le pui în locație</span><span></span></div>
      <div class="sh-row"><span>Câștigul tău (${csp.executant}% adaos)</span><span>+${money(b.consExecutantPayout)}</span></div>`;
    else footer = `<div class="sh-row sh-total"><span>Valoare (achiziție + adaos)</span><span>${b.consumablesRon} lei ≈ ${money(b.consumablesEur)}</span></div>`;
    return `<div class="shopping">
      <div class="sh-title">🛒 Consumabile ${who === "laundry" ? "de cumpărat &amp; distribuit" : "necesare la intervenție"}</div>
      ${list.map(i => `<div class="sh-row"><span>${esc(i.name)} <small>(${esc(i.unit)})</small></span><span>× ${i.qty}${who === "laundry" ? " · " + i.lineRon + " lei" : ""}</span></div>`).join("")}
      ${footer}
    </div>`;
  };
  const roleLabel = { admin: "Administrator", solicitant: "Solicitant", executant: "Agent Cleaning", spalatorie: "Serviciu lenjerie" };

  function toast(msg, type = "") {
    const wrap = document.getElementById("toastWrap");
    const t = el(`<div class="toast ${type}">${esc(msg)}</div>`);
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 250); }, 3000);
  }

  function modal(html) {
    const overlay = document.getElementById("modalOverlay");
    const box = document.getElementById("modal");
    box.innerHTML = html;
    overlay.hidden = false;
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
    return box;
  }
  function closeModal() { document.getElementById("modalOverlay").hidden = true; }
  window._closeModal = closeModal;

  /* =========================================================
     AUTENTIFICARE
     ========================================================= */
  let authTab = "login";
  let regRole = "solicitant";
  let regBiz = "SRL";
  let landing = true;
  let landingView = "home";  // "home" | "executant" | "spalatorie"

  // Rutare pe URL: linkuri directe către fiecare landing (serverul servește index.html pe orice cale)
  const LANDING_PATHS = { home: "/", executant: "/agenti-cleaning", spalatorie: "/serviciu-lenjerie" };
  function pathToView(p) {
    p = String(p || "/").replace(/\/+$/, "") || "/";
    if (p === "/agenti-cleaning" || p === "/agenti") return "executant";
    if (p === "/serviciu-lenjerie" || p === "/lenjerie") return "spalatorie";
    return "home";
  }
  // schimbă landing-ul ȘI actualizează URL-ul, ca să poată fi copiat/distribuit
  function setLandingView(v, push) {
    landingView = v;
    const path = LANDING_PATHS[v] || "/";
    try { if (push !== false && location.pathname !== path) history.pushState({ v }, "", path); } catch (e) {}
  }

  function goAuth(tab) { landing = false; authTab = tab || "login"; renderAuth(); }

  function renderAuth() {
    topbar.hidden = true;
    document.body.classList.remove("landing-active");
    app.innerHTML = "";
    app.appendChild(el(`
      <div class="auth-wrap">
        <div class="auth-card card">
          <div class="auth-logo">
            <div class="brand-mark">🧽</div>
            <h1>Sleep &amp; Go Cleaning</h1>
            <p>Curatenie regim hotelier</p>
          </div>
          <div class="tabs">
            <button data-tab="login" class="${authTab === "login" ? "active" : ""}">Autentificare</button>
            <button data-tab="register" class="${authTab === "register" ? "active" : ""}">Cont nou</button>
          </div>
          <div id="authBody"></div>
          <p style="text-align:center;margin:18px 0 0"><span class="link" id="backHome">← Înapoi la pagina principală</span></p>
        </div>
      </div>
    `));
    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { authTab = b.dataset.tab; renderAuth(); });
    $("#backHome").onclick = () => { landing = true; renderHome(); };
    authTab === "login" ? renderLogin() : renderRegister();
  }

  function renderLogin() {
    const body = $("#authBody");
    body.innerHTML = "";
    body.appendChild(el(`
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required placeholder="email@exemplu.com" />
        </div>
        <div class="field">
          <label>Parolă</label>
          <input type="password" name="password" required placeholder="••••••" />
        </div>
        <button class="btn btn-block" type="submit">Intră în cont</button>
      </form>
    `));
    $("#loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const res = await S.login(f.get("email"), f.get("password"));
      if (!res.ok) return toast(res.error, "err");
      toast("Bine ai revenit, " + res.user.name + "!", "ok");
      renderApp();
    };
  }

  function renderRegister() {
    const body = $("#authBody");
    body.innerHTML = "";
    body.appendChild(el(`
      <form id="regForm">
        <div class="field">
          <label>Sunt...</label>
          <div class="role-picker role-picker-3">
            <div class="role-opt ${regRole === "solicitant" ? "active" : ""}" data-role="solicitant">
              <span class="ico">🏠</span> Solicitant<br><small>vreau curățenie</small>
            </div>
            <div class="role-opt ${regRole === "executant" ? "active" : ""}" data-role="executant">
              <span class="ico">🧹</span> Agent Cleaning<br><small>ofer curățenie</small>
            </div>
            <div class="role-opt ${regRole === "spalatorie" ? "active" : ""}" data-role="spalatorie">
              <span class="ico">🧺</span> Serviciu lenjerie<br><small>spăl lenjeria</small>
            </div>
          </div>
        </div>
        <div class="field"><label>${regRole === "solicitant" ? "Nume complet" : "Nume reprezentant"}</label><input name="name" required placeholder="Ex: Ioana Marin" /></div>
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="email@exemplu.com" /></div>
        <div class="field"><label>Parolă</label><input type="password" name="password" required minlength="4" placeholder="minim 4 caractere" /></div>
        <div id="execFields" ${regRole === "executant" || regRole === "spalatorie" ? "" : "hidden"}>
          <div class="divider"></div>
          <div class="section-title" style="margin-top:0">Date firmă (obligatoriu)</div>
          <div class="field">
            <label>Formă de organizare</label>
            <div class="role-picker" id="bizPicker">
              ${C.businessTypes.map(t => `<div class="role-opt ${regBiz === t ? "active" : ""}" data-biz="${t}"><strong>${t}</strong></div>`).join("")}
            </div>
            <div class="hint">Te poți înregistra doar ca entitate juridică: PFA, PFI sau SRL.</div>
          </div>

            <div class="field"><label>Nr. Reg. Com. <span class="hint" style="display:inline">(dacă e cazul)</span></label><input name="regCom" placeholder="J40/1234/2022" /></div>
          </div>

          <div class="row-2">
            <div class="field"><label>Telefon contact</label><input name="phone" placeholder="07xx xxx xxx" /></div>
            <div class="field"><label>Adresă / sediu</label><input name="address" placeholder="Stradă, nr., oraș" /></div>
          </div>
          <div class="hint" style="margin:-6px 0 4px">Telefonul e vizibil doar între Agent Cleaning și serviciul de lenjerie, pentru coordonarea ridicării.</div>
          <div class="field">
            <label>${regRole === "spalatorie" ? "Zonele în care activez" : "Zona în care activez"}</label>
            ${regRole === "spalatorie"
              ? `<div class="area-checks">${C.areas.map(a => `<label class="area-check"><input type="checkbox" name="areaMulti" value="${esc(a)}"/> <span>${a}</span></label>`).join("")}</div>
                 <div class="hint">Bifează mai multe zone — preiei lenjerie din toate.</div>`
              : `<select name="area">${C.areas.map(a => `<option>${a}</option>`).join("")}</select>
                 <div class="hint">Vei vedea doar solicitările din această zonă.</div>`}
          </div>
        </div>
        <button class="btn btn-block" type="submit">Creează cont</button>
      </form>
    `));
    body.querySelectorAll(".role-opt[data-role]").forEach(o => o.onclick = () => {
      regRole = o.dataset.role; renderRegister();
    });
    body.querySelectorAll(".role-opt[data-biz]").forEach(o => o.onclick = () => {
      regBiz = o.dataset.biz;
      body.querySelectorAll(".role-opt[data-biz]").forEach(x => x.classList.toggle("active", x.dataset.biz === regBiz));
    });
    $("#regForm").onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const payload = {
        name: f.get("name"), email: f.get("email"), password: f.get("password"),
        role: regRole,
      };
      // Serviciul de lenjerie poate alege MAI MULTE zone; celelalte roluri — una singură
      let laundryAreas = null;
      if (regRole === "spalatorie") {
        laundryAreas = [...e.target.querySelectorAll('input[name="areaMulti"]:checked')].map(i => i.value);
        if (!laundryAreas.length) return toast("Alege cel puțin o zonă.", "err");
        payload.area = laundryAreas[0];
      } else {
        payload.area = f.get("area");
      }
      if (regRole === "executant" || regRole === "spalatorie") {
        payload.business = {
          type: regBiz, name: f.get("bizName"), cui: f.get("cui"),
          regCom: f.get("regCom") || "", iban: f.get("iban"),
        };
        payload.phone = f.get("phone") || "";
        payload.address = f.get("address") || "";
      }
      const res = await S.register(payload);
      if (!res.ok) return toast(res.error, "err");
      // persistă lista de zone pentru Serviciul de lenjerie
      if (laundryAreas && res.user) { S.updateUser(res.user.id, { areas: laundryAreas, area: laundryAreas[0] }); await S.flush(); }
      toast("Cont creat cu succes!", "ok");
      renderApp();
    };
  }

  function renderApp() {
    const u = S.currentUser();
    if (!u) {
      if (!landing) return renderAuth();
      if (landingView === "executant") return renderExecutantLanding();
      if (landingView === "spalatorie") return renderLaundryLanding();
      return renderHome();
    }
    document.body.classList.remove("landing-active");
    topbar.hidden = false;
    $("#roleBadge").textContent = roleLabel[u.role];
    $("#userName").textContent = u.name;
    // avatar de profil în topbar (click → profil / schimbă poza)
    let av = $("#topAvatar");
    if (!av) { av = el(`<span id="topAvatar" title="Profil"></span>`); $(".topbar-right").insertBefore(av, $("#roleBadge")); }
    av.innerHTML = avatarHtml(u, 34);
    av.style.cursor = "pointer";
    av.onclick = () => openProfile(u);
    $("#logoutBtn").onclick = async () => { await S.logout(); toast("Te-ai deconectat.", ""); landing = true; renderHome(); };

    if (u.role === "admin") return renderAdmin(u);
    if (u.role === "executant") return renderExecutant(u);
    if (u.role === "spalatorie") return renderSpalatorie(u);
    return renderSolicitant(u);
  }

  /* ---------- Profil (poză de profil) ---------- */
  function openProfile(u) {
    const rating = u.role === "executant" ? S.ratingOf(u.id) : null;
    modal(`
      <h2>Profilul meu</h2>
      <p class="sub">${esc(u.name)} · ${roleLabel[u.role]}</p>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
        <span id="pvAvatar">${avatarHtml(u, 72)}</span>
        <div>
          ${rating ? `<div>${starsHtml(rating)}</div>` : ""}
          <div class="hint" style="margin-top:6px">Poză de profil · max ${Math.round(C.maxAvatarBytes / 1024 / 1024)} MB</div>
        </div>
      </div>
      <div class="field"><input type="file" id="avFile" accept="image/*" /></div>
      <div class="btn-row">
        <button class="btn btn-soft" onclick="_closeModal()">Închide</button>
        ${u.avatar ? `<button class="btn btn-soft btn-danger" id="avRemove">Șterge poza</button>` : ""}
      </div>
    `);
    $("#avFile").onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > C.maxAvatarBytes) return toast("Poza e prea mare (max " + Math.round(C.maxAvatarBytes / 1024 / 1024) + " MB).", "err");
      const reader = new FileReader();
      reader.onload = () => { S.setAvatar(u.id, reader.result); toast("Poză de profil salvată.", "ok"); closeModal(); renderApp(); };
      reader.readAsDataURL(f);
    };
    const rm = $("#avRemove");
    if (rm) rm.onclick = () => { S.setAvatar(u.id, null); toast("Poză ștearsă.", ""); closeModal(); renderApp(); };
  }

      const linens = ($('input[name="simLinen"]:checked') || {}).value !== "without";

        linens, linenSets: $("#simSets") ? $("#simSets").value : 0,

      };

    function recalcSim() {
      if (!$("#simTotal")) return;
      const d = readSim();
      const wrap = $("#simSetsWrap"); if (wrap) wrap.style.display = d.linens ? "" : "none";
      const q = S.quote(d);
      const rows = [];
      rows.push(`<div class="sb-row"><span>Curățenie (${Number(d.sqm) || 0} m²)</span><span>${money(q.cleaning)}</span></div>`);
      if (q.peakPct) rows.push(`<div class="sb-row sur"><span>Adaos interval de vârf (+${q.peakPct}%)</span><span>+${money(q.peakAdd)}</span></div>`);
      if (q.surPct) rows.push(`<div class="sb-row sur"><span>Weekend / sărbătoare (+${q.surPct}%)</span><span>+${money(q.surcharge)}</span></div>`);
      if (q.linenIncluded && q.linenSets > 0) rows.push(`<div class="sb-row"><span>Lenjerie (${q.linenSets} × ${C.linenSetPriceRon} lei)</span><span>≈ ${money(q.linenEur)}</span></div>`);

      $("#simTotal").innerHTML = `${money(q.total)} <small style="font-size:14px;color:var(--h-muted);font-weight:600">≈ ${leiOf(q.total)} lei</small>`;

      $("#simNote").textContent = (peak ? `Interval de vârf — +${C.schedule.peakSurchargePct}%.` : "În afara orelor de vârf — preț de bază.") + (wh ? ` Weekend/sărbătoare — +${C.weekendHolidaySurchargePct}%.` : "");
    }
    const simSection = $("#heroSim");
    if (simSection) {
      // forțează consumabilele la 0 la încărcare (unele browsere restaurează valori vechi)
      document.querySelectorAll(".simCons").forEach(i => { i.value = "0"; });
      ["input", "change"].forEach(ev => simSection.addEventListener(ev, recalcSim));

    }

    const offerForm = $("#offerForm");
    if (offerForm) offerForm.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const d = readSim();
      const q = S.quote(d);
      const res = await S.addOfferLead({
        name: f.name.value, phone: f.phone.value, email: f.email ? f.email.value : "", note: f.note ? f.note.value : "",
        quote: { sqm: Number(d.sqm) || 0, date: d.date, startTime: d.startTime, linens: d.linens, linenSets: Number(d.linenSets) || 0, total: q.total },
      });
      if (!res.ok) return toast(res.error, "err");
      toast("Cerere de ofertă trimisă! Te contactăm în curând.", "ok");
      f.reset();
    };
  }

      .map(i => ({ productId: i.dataset.pid, qty: Number(i.value) || 0 })).filter(c => c.qty > 0);
    function laRecalc() {
      if (!$("#laTotal")) return;
      const sets = Number(($("#laSets") || {}).value) || 0;
      const cons = laReadCons();
      const q = S.quote({ sqm: 0, startTime: "10:00", date: "", linens: true, linenSets: sets, consumables: cons });
      const pct = S.commissionPct();
      const linenGross = q.linenEur;
      const linenComm = linenGross * pct / 100;
      const linenPayout = linenGross - linenComm;
      const consCostEur = S.ronToEur(q.consumablesCostRon);
      const consMarkupEur = S.ronToEur(q.consumablesMarkupRon);
      const consLaundryMarkup = consMarkupEur * C.consumableSplit.laundry / 100;
      const total = linenPayout + consCostEur + consLaundryMarkup;
      const rows = [];
      rows.push(`<div class="sb-row"><span>Spălare lenjerie (${sets} × ${C.linenSetPriceRon} lei)</span><span>${money(linenGross)}</span></div>`);
      rows.push(`<div class="sb-row sur"><span>Comision platformă (${pct}%)</span><span>−${money(linenComm)}</span></div>`);
      if (q.consumablesCostRon > 0) {
        rows.push(`<div class="sb-row"><span>Consumabile — achiziție rambursată</span><span>+${money(consCostEur)}</span></div>`);
        rows.push(`<div class="sb-row"><span>Consumabile — partea ta din adaos (${C.consumableSplit.laundry}%)</span><span>+${money(consLaundryMarkup)}</span></div>`);
      }
      $("#laBreakdown").innerHTML = rows.join("");
      $("#laTotal").innerHTML = `${money(total)} <small style="font-size:14px;color:var(--h-muted);font-weight:600">≈ ${leiOf(total)} lei</small>`;
      $("#laNote").textContent = "Spălare după comision + achiziția consumabilelor rambursată + partea ta din adaos.";
    }
    const laSection = $("#laSim");
    if (laSection) {
      document.querySelectorAll(".laCons").forEach(i => { i.value = i.dataset.def || "0"; });
      ["input", "change"].forEach(ev => laSection.addEventListener(ev, laRecalc));
      laRecalc();
    }
  }

  // opțiuni de oră pentru sloturi

  function renderNewRequest(u) {
    const body = $("#solBody");
    const sch = C.schedule;
    // data implicită = mâine (și minim mâine, ca să nu se aleagă o zi trecută)
    const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    const approved = S.usableLocationsOfOwner(u.id);   // aprobate ȘI cu Agent Cleaning activ în zonă
    const waiting = S.approvedLocationsOfOwner(u.id).filter(l => !S.hasActiveExecutorInArea(l.area));

    if (!approved.length) {
      body.appendChild(emptyState(
        "Nicio locație disponibilă pentru solicitare.",
        waiting.length
          ? "Locațiile tale sunt în așteptare — momentan nu avem Agenți Cleaning activi în zonele lor. Vei putea trimite solicitări imediat ce apare un Agent Cleaning."
          : "Adaugă o locație cu documentul de suprafață în tabul «Locațiile mele». După ce administratorul o aprobă, poți trimite o solicitare."));
      return;
    }

    const lastStart = sch.close - sch.minHours; // ultima oră de început validă
    body.appendChild(el(`
      <div class="grid cols-2">
        <div class="card">
          <form id="reqForm">
            <div class="field">
              <label>Locație (aprobată)</label>
              <select name="locationId" required>
                ${approved.map(l => `<option value="${l.id}" data-sqm="${l.sqm}">${esc(l.name)} — ${l.sqm} m² · ${esc(l.area)}</option>`).join("")}
              </select>
              <div class="hint">Suprafața provine din documentul aprobat de administrator.</div>
            </div>
            <div class="field">
              <label>Data dorită</label>
              <input type="date" name="date" required value="${tomorrow}" min="${tomorrow}" />
            </div>
            <div class="row-2">
              <div class="field">
                <label>Ora început</label>
                <select name="startTime">${hourOpts(sch.open, lastStart, "10:00")}</select>
              </div>
              <div class="field">
                <label>Ora sfârșit</label>
                <select name="endTime">${hourOpts(sch.open + sch.minHours, sch.close, "14:00")}</select>
              </div>
            </div>
            <div class="field">
              <label>Lenjerie</label>
              <div class="role-picker" id="linenMode">
                <div class="role-opt ${reqLinenMode === "with" ? "active" : ""}" data-linen="with">
                  <strong>Cu lenjerie</strong><br><small>${money(S.ronToEur(C.linenSetPriceRon))}/set (${C.linenSetPriceRon} lei) · spălat &amp; călcat</small>
                </div>
                <div class="role-opt ${reqLinenMode === "without" ? "active" : ""}" data-linen="without">
                  <strong>Fără lenjerie</strong><br><small>folosesc lenjeria mea</small>
                </div>
              </div>

            </div>

              <input type="number" name="linenSets" min="0" value="1" />
              <div class="hint" id="linenNote"></div>
            </div>

              <label>Alimentare consumabile (opțional)</label>
              <div class="consumables-pick">
                ${S.activeProducts().map(p => `
                  <div class="cp-row">
                    <div class="cp-info"><strong>${esc(p.name)}</strong><small>${esc(p.unit)} · ${p.priceRon} lei</small></div>

            </div>

              <label>Observații (opțional)</label>

            <div class="summary" id="summary"></div>
            <div class="pricing-legend">
              <div class="pl-row"><span class="pl-dot off"></span> Înainte de ${sch.peakStart}:00 sau de la ${sch.peakEnd}:00 · <strong>${money(S.pricePerSqm())}/m²</strong> (preț de bază)</div>
              <div class="pl-row"><span class="pl-dot peak"></span> Vârf ${sch.peakStart}:00–${sch.peakEnd}:00 · <strong>${money(Math.round(S.pricePerSqm() * (100 + sch.peakSurchargePct)) / 100)}/m²</strong> (+${sch.peakSurchargePct}%)</div>
              <div class="pl-row"><span class="pl-dot" style="background:var(--warn)"></span> Weekend / sărbători legale · <strong>+${C.weekendHolidaySurchargePct}%</strong></div>

          </div>
        </div>
      </div>
    `));

    const form = $("#reqForm");
    const readConsumables = () => S.activeProducts()
      .map(pr => ({ productId: pr.id, qty: Number((form["cons_" + pr.id] || {}).value) || 0 }))
      .filter(c => c.qty > 0);
    const updateSummary = () => {
      const f = new FormData(form);
      const opt = form.locationId.selectedOptions[0];
      const sqm = opt ? Number(opt.dataset.sqm) : 0;
      const linenSets = Number(f.get("linenSets")) || 0;
      const withLinen = reqLinenMode === "with";
      const startTime = f.get("startTime");
      const consumables = readConsumables();
      const reqDate = f.get("date");

          : `<div class="line"><span>În afara orelor de vârf</span><span class="pill">preț de bază</span></div>`}
        ${p.surPct ? `<div class="line" style="color:var(--warn)"><span>Weekend / sărbătoare (+${p.surPct}%)</span><span>+${money(p.surcharge)}</span></div>` : ""}
        ${withLinen && linenSets > 0
          ? `<div class="line"><span>Lenjerie (${linenSets} × ${C.linenSetPriceRon} lei)</span><span>${p.linenRon} lei ≈ ${money(p.linenEur)}</span></div>`
          : `<div class="line"><span>Lenjerie</span><span class="pill">${withLinen ? "0 seturi" : "fără (proprie)"}</span></div>`}
        ${p.consumablesRon > 0 ? `<div class="line"><span>Consumabile (achiziție ${p.consumablesCostRon} + ${p.markupPct}% adaos)</span><span>${p.consumablesRon} lei ≈ ${money(p.consumablesEur)}</span></div>` : ""}
        <div class="line total"><span>Total de plată</span><span class="amt">${moneyBoth(p.total)}</span></div>`;
    };

    body.querySelectorAll("#linenMode .role-opt").forEach(o => o.onclick = () => {
      reqLinenMode = o.dataset.linen;
      body.querySelectorAll("#linenMode .role-opt").forEach(x => x.classList.toggle("active", x.dataset.linen === reqLinenMode));
      updateSummary();
    });
    form.addEventListener("input", updateSummary);
    form.addEventListener("change", updateSummary);
    updateSummary();

    form.onsubmit = (e) => {
      e.preventDefault();
      const f = new FormData(form);
      const res = S.createRequest({
        locationId: f.get("locationId"),
        linens: reqLinenMode === "with", linenSets: f.get("linenSets"),
        date: f.get("date"), startTime: f.get("startTime"), endTime: f.get("endTime"),
        notes: f.get("notes"), consumables: readConsumables(),
      });
      if (!res.ok) return toast(res.error, "err");
      openPayment(res.req.id, u);
    };
  }

  /* ===== Calendar lunar de sume (cheltuieli client / încasări agent) ===== */
  let calOffset = 0;   // 0 = luna curentă, -1 = luna trecută, etc.
  const CAL_MONTHS = ["ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie", "august", "septembrie", "octombrie", "noiembrie", "decembrie"];
  // entries: [{date:'YYYY-MM-DD', amount:Number}]; cfg:{totalLabel, accent, rerender}
  function expenseCalendarEl(entries, cfg) {
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
    const y = target.getFullYear(), m = target.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    let firstWd = new Date(y, m, 1).getDay();      // 0=duminică
    firstWd = (firstWd + 6) % 7;                    // luni = 0
    const byDay = {}; let monthTotal = 0, monthCount = 0;
    (entries || []).forEach(e => {
      if (!e.date) return;
      const d = new Date(e.date + "T00:00:00");
      if (d.getFullYear() === y && d.getMonth() === m) {
        const day = d.getDate();
        byDay[day] = (byDay[day] || 0) + (Number(e.amount) || 0);
        monthTotal += Number(e.amount) || 0; monthCount++;
      }
    });
    const wk = ["L", "Ma", "Mi", "J", "V", "S", "D"];
    const todayD = (now.getFullYear() === y && now.getMonth() === m) ? now.getDate() : -1;
    let cells = "";
    for (let i = 0; i < firstWd; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const amt = byDay[d];
      cells += `<div class="cal-cell${d === todayD ? " today" : ""}${amt ? " has" : ""}"><span class="cal-day">${d}</span>${amt ? `<span class="cal-amt">${money(amt)}</span>` : ""}</div>`;
    }
    const wrap = el(`
      <div class="cal-wrap">
        <div class="cal-head">
          <button class="btn btn-soft cal-nav" type="button" data-cal="-1">‹</button>
          <div class="cal-title">${CAL_MONTHS[m]} ${y}</div>
          <button class="btn btn-soft cal-nav" type="button" data-cal="1">›</button>
        </div>
        <div class="card stat" style="margin:10px 0"><span class="label">${cfg.totalLabel} (${monthCount})</span><span class="value ${cfg.accent || ""}">${money(monthTotal)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(monthTotal)} lei</small></span></div>
        <div class="cal-weekdays">${wk.map(w => `<div>${w}</div>`).join("")}</div>
        <div class="cal-grid">${cells}</div>
      </div>`);
    wrap.querySelectorAll("[data-cal]").forEach(b => b.onclick = () => { calOffset += Number(b.dataset.cal); cfg.rerender(); });
    return wrap;
  }
  // câștigul unui agent dintr-o solicitare (curățenie + consumabile + lenjerie, dacă e cazul)
  function agentEarnOf(r, uid) {
    const b = S.breakdown(r);
    let amt = 0;
    if (r.executorId === uid) amt += b.cleaningPayout + b.consExecutantPayout;
    if (r.linens && r.linenExecutorId === uid) amt += b.linenPayout;
    if (r.linenExecutorId === uid && b.consLaundryPayout > 0) amt += b.consLaundryPayout;
    return Math.round(amt * 100) / 100;
  }

  function linenCard(r, ctx, u) {

    if (ctx === "laundry-available") actions = `<button class="btn btn-ok btn-sm" data-act="takeLinen">🧺 Preia lenjeria (+${money(b.linenPayout)})</button>`;

    // logistică: adresa de ridicare (aleasă de Agent Cleaning) + Waze + contact Agent Cleaning
    const execUser = r.executorId ? S.userById(r.executorId) : null;
    const pickupAddr = (r.linenPickup && r.linenPickup.address) || r.address;
    const pickupType = r.linenPickup ? ({ executant: "adresa Agentului Cleaning", next: "următoarea adresă", other: "altă adresă" }[r.linenPickup.type] || "") : "";

              <span>📍 ${esc(r.area)}</span>
              <span>📅 ${esc(r.date)}</span>
              <span>🧺 ${r.linenSets} × ${C.linenSetPriceRon} lei</span>
            </div>
          </div>
          <div class="req-price">
            <span class="big">${money(b.linenPayout)}</span>
            <small>tu primești (70%) · client ${money(b.linenEur)}</small>
          </div>
        </div>
        <div class="linen-logistics">
          <div class="ll-row"><span class="ll-k">📍 Ridicare de la${pickupType ? ` <small>(${pickupType})</small>` : ""}</span>
            <span class="ll-v">${esc(pickupAddr)} <a class="waze-link" href="${wazeUrl(pickupAddr)}" target="_blank" rel="noopener">🧭 Deschide în Waze</a></span></div>
          ${r.mapsUrl ? `<div class="ll-row"><span class="ll-k">🗺️ Locația (client)</span><span class="ll-v">${mapsLink(r.mapsUrl)}</span></div>` : ""}
          ${execUser ? `<div class="ll-row"><span class="ll-k">🧹 Agent Cleaning curățenie</span><span class="ll-v">${contactPill(execUser, "sună")}</span></div>` : ""}
        </div>
        <div class="payout">
          <div class="prow"><span>Serviciu lenjerie (client)</span><span>${b.linenRon} lei ≈ ${money(b.linenEur)}</span></div>
          <div class="prow comm"><span>Comision platformă (${b.pct}%)</span><span>−${money(b.linenEur * b.pct / 100)}</span></div>
          <div class="prow net"><span>Tu primești (lenjerie)</span><span>${money(b.linenPayout)}</span></div>
        </div>
        ${mine ? shoppingBox(r, "laundry") : ""}
        <div class="req-body"><div class="btn-row">${actions}</div></div>
      </div>
    `);

      const act = btn.dataset.act;
      if (act === "takeLinen") {
        const res = S.takeLinenService(r.id, u.id);
        if (res.ok) { toast("Ai preluat lenjeria! O duci la spălat și o aduci data viitoare.", "ok"); laundryTab = "jobs"; renderApp(); }
        else toast("Lenjeria nu mai este disponibilă.", "err");

    });
    return card;
  }

  // Agentul Cleaning refuză lenjeria → alege de unde o ridică Serviciul de lenjerie
  function declineLinenModal(r, u) {
    const myAddr = u.address || "";
    // următoarea adresă programată a Agentului Cleaning (alt job viitor)
    const nextJob = S.jobsOfExecutor(u.id)
      .filter(j => j.id !== r.id && j.address && j.executorId === u.id)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .find(j => j.date >= r.date);
    const nextAddr = nextJob ? nextJob.address : "";
    modal(`
      <h2>De unde se ridică lenjeria?</h2>
      <p class="sub">Nu preiei lenjeria la spălat — Serviciul de lenjerie o va ridica de la adresa indicată (cele ${r.linenSets} seturi).</p>
      <div class="field pk-opts">
        <label class="pk-opt"><input type="radio" name="pk" value="executant" checked> <span><strong>Adresa mea (Agent Cleaning)</strong><small>${esc(myAddr || "necompletată — scrie mai jos")}</small></span></label>
        <label class="pk-opt"><input type="radio" name="pk" value="next"> <span><strong>Următoarea adresă programată</strong><small>${esc(nextAddr || "nicio lucrare viitoare — scrie mai jos")}</small></span></label>
        <label class="pk-opt"><input type="radio" name="pk" value="other"> <span><strong>Altă adresă</strong><small>o completezi tu</small></span></label>
      </div>
      <div class="field"><label>Adresa de ridicare</label><input id="pkAddr" placeholder="Stradă, nr., oraș" value="${esc(myAddr)}" /></div>
      <div class="btn-row"><button class="btn btn-soft" onclick="_closeModal()">Renunță</button>
      <button class="btn" style="flex:1" id="pkConfirm">Confirmă · trimite la spălătorie</button></div>
    `);
    const addrInput = $("#pkAddr");
    const prefill = { executant: myAddr, next: nextAddr, other: "" };
    document.querySelectorAll('input[name="pk"]').forEach(radio => radio.onchange = () => {
      if (radio.checked) addrInput.value = prefill[radio.value] || "";
    });
    $("#pkConfirm").onclick = () => {
      const type = (document.querySelector('input[name="pk"]:checked') || {}).value || "other";
      const address = addrInput.value.trim();
      if (!address) return toast("Completează adresa de ridicare.", "err");
      const res = S.declineLinenService(r.id, u.id, { type, address });
      if (!res.ok) return toast(res.error || "Nu s-a putut trimite.", "err");
      closeModal(); toast("Lenjeria a fost trimisă către Serviciul de lenjerie.", "ok"); renderApp();
    };
  }

  // Pontaj (admin): timpii de lucru ai tuturor Agenților Cleaning
  function renderAdminTime() {
    const body = $("#admBody");
    const sessions = S.allWorkSessions();
    // rezumat pe Agent Cleaning
    const byExec = {};
    sessions.forEach(s => {
      if (!byExec[s.executorId]) byExec[s.executorId] = { name: s.executorName, count: 0, minutes: 0 };
      if (s.minutes != null) { byExec[s.executorId].count++; byExec[s.executorId].minutes += s.minutes; }
    });
    const totalMin = sessions.reduce((a, s) => a + (s.minutes || 0), 0);
    body.appendChild(el(`<p class="hint" style="margin:0 0 16px">Fiecare lucrare este cronometrată din momentul în care Agentul Cleaning apasă <strong>«Începe lucrul»</strong> până la <strong>«locația e gata»</strong>.</p>`));
    if (!sessions.length) { body.appendChild(el(`<p class="hint">Nicio activitate cronometrată încă.</p>`)); return; }

      <div class="section-title" style="margin-top:0">Rezumat pe Agent Cleaning</div>
      <div class="grid cols-3" style="margin-bottom:8px">
        ${Object.values(byExec).map(e => `<div class="card stat"><span class="label">${esc(e.name)}</span><span class="value">${fmtDur(e.minutes)}</span><span class="hint">${e.count} lucrări · medie ${fmtDur(e.count ? Math.round(e.minutes / e.count) : 0)}</span></div>`).join("")}

    // 📊 Statistică totală circuit lenjerie (pe toată platforma)
    const lt = owners.reduce((s, o) => {
      const c = S.linenCircuitOf(o.id);
      s.received += c.received; s.loc += c.atLocation; s.lau += c.atLaundry; s.exe += c.atExecutor;
      if (c.received > 0) s.withLinen++;
      if ((c.atLocation + c.atLaundry + c.atExecutor) !== c.received) s.mismatch++;
      return s;
    }, { received: 0, loc: 0, lau: 0, exe: 0, withLinen: 0, mismatch: 0 });
    body.appendChild(el(`

    const wrap = el(`<div class="req"></div>`);
    owners.forEach(o => {
      const c = S.linenCircuitOf(o.id);
      const sum = c.atLocation + c.atLaundry + c.atExecutor;
      const card = el(`
        <div class="req-item">
          <div class="req-top">
            <div style="display:flex;align-items:center;gap:12px">${avatarHtml(o, 40)}<div><h3 style="margin:0">${esc(o.name)}</h3><div class="req-meta"><span>✉️ ${esc(o.email)}</span></div></div></div>

  /* Panou de statistici grafice (admin): cifra de afaceri, comision platformă, comision parteneri */
  function renderAdminCharts() {
    const body = $("#admBody");
    const rs = S.requests().filter(r => r.status !== S.STATUS.NOU && r.status !== S.STATUS.ANULAT);
    const M = {};
    let revenue = 0, commission = 0, partners = 0;
    rs.forEach(r => {
      const b = S.breakdown(r);
      let p = 0;
      if (r.executorId) p += b.cleaningPayout + b.consExecutantPayout;
      if (b.linenTaken) p += b.linenPayout;
      if (b.consLaundryPayout > 0) p += b.consLaundryPayout;
      revenue += b.total; commission += b.commission; partners += p;
      const k = String(r.date || "").slice(0, 7);
      if (k) { (M[k] = M[k] || { rev: 0, com: 0, part: 0 }); M[k].rev += b.total; M[k].com += b.commission; M[k].part += p; }
    });
    const retained = Math.max(0, Math.round((revenue - commission - partners) * 100) / 100);
    const now = new Date();
    const months = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`, label: CAL_MONTHS[d.getMonth()].slice(0, 3) }); }
    const maxRev = Math.max(1, ...months.map(m => (M[m.key] || {}).rev || 0));
    const W = 580, H = 230, pad = 30, gap = (W - pad * 2) / months.length, bw = gap * 0.5;
    const bars = months.map((m, i) => {
      const d = M[m.key] || { rev: 0, com: 0, part: 0 };
      const ret = Math.max(0, d.rev - d.com - d.part);
      const x = pad + i * gap + (gap - bw) / 2;
      let acc = 0; const segs = [];
      [["#22d3ee", d.com], ["#f59e0b", d.part], ["#64748b", ret]].forEach(([c, val]) => {
        const h = (val / maxRev) * (H - pad * 2);
        if (h > 0.5) { segs.push(`<rect x="${x.toFixed(1)}" y="${(H - pad - acc - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" rx="2"/>`); acc += h; }
      });
      return segs.join("") +
        `<text x="${(x + bw / 2).toFixed(1)}" y="${H - pad + 14}" text-anchor="middle" font-size="11" fill="#94a3b8">${m.label}</text>` +
        (d.rev > 0 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(H - pad - acc - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="#cbd5e1">${leiOf(d.rev)}</text>` : "");
    }).join("");
    const tot = Math.max(1, revenue);
    const pc = v => Math.round(v / tot * 1000) / 10;
    body.innerHTML = "";
    body.appendChild(el(`
      <div class="grid cols-4">
        <div class="card stat"><span class="label">💰 Cifra de afaceri</span><span class="value">${money(revenue)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(revenue)} lei</small></span></div>
        <div class="card stat"><span class="label">🏦 Încasări (avans)</span><span class="value">${money(revenue)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(revenue)} lei</small></span></div>
        <div class="card stat"><span class="label">🏛️ Comision platformă</span><span class="value brand">${money(commission)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(commission)} lei</small></span></div>
        <div class="card stat"><span class="label">🤝 Comision către parteneri</span><span class="value" style="color:var(--warn)">${money(partners)} <small style="font-size:13px;color:var(--muted,#8aa)">≈ ${leiOf(partners)} lei</small></span></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="section-title" style="margin-top:0">Cifra de afaceri pe luni (lei)</div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:640px">${bars}</svg>
        <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:6px">
          <span><span style="display:inline-block;width:12px;height:12px;background:#22d3ee;border-radius:3px;vertical-align:-1px"></span> Comision platformă</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#f59e0b;border-radius:3px;vertical-align:-1px"></span> Către parteneri</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#64748b;border-radius:3px;vertical-align:-1px"></span> Reținut platformă</span>
        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="section-title" style="margin-top:0">Cum se împarte cifra de afaceri</div>
        <div style="display:flex;height:34px;border-radius:8px;overflow:hidden;margin:8px 0 10px;background:rgba(255,255,255,.06)">
          <div style="width:${pc(commission)}%;background:#22d3ee"></div>
          <div style="width:${pc(partners)}%;background:#f59e0b"></div>
          <div style="width:${pc(retained)}%;background:#64748b"></div>
        </div>
        <div style="font-size:13.5px;line-height:1.9">
          🏛️ <strong>Comision platformă</strong>: ${money(commission)} (${pc(commission)}%)<br>
          🤝 <strong>Comision către parteneri</strong> (Agenți + lenjerie): ${money(partners)} (${pc(partners)}%)<br>
          🏦 <strong>Reținut platformă</strong> (nealocat): ${money(retained)} (${pc(retained)}%)
        </div>
      </div>
      ${revenue === 0 ? `<p class="hint" style="margin-top:12px">Încă nu există încasări. Graficele se populează pe măsură ce clienții plătesc solicitări.</p>` : ""}
    `));
  }
