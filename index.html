<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sleep &amp; Go Cleaning — Curățenie regim hotelier</title>
<meta name="description" content="Curățenie regim hotelier la cerere: adaugă locația, programează și plătește în avans." />
</head>
<body>
<style>
:root {
  --bg: #0f1720;
  --bg-soft: #16212e;
  --card: #1b2836;
  --card-2: #22323f;
  --line: #2c3e4f;
  --text: #e8eef4;
  --muted: #93a6b5;
  --brand: #21c1a6;
  --brand-2: #1f7ae0;
  --brand-grad: linear-gradient(135deg, #21c1a6, #1f7ae0);
  --warn: #f0a93b;
  --danger: #ef5d6b;
  --ok: #34c77b;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #1c3247 0%, var(--bg) 55%);
  color: var(--text);
  min-height: 100vh;
}

/* ---------- Topbar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px;
  background: rgba(15,23,32,.75);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center;
  background: var(--brand-grad); border-radius: 12px;
}
.brand strong { display: block; font-size: 17px; line-height: 1; }
.brand small { color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-size: 10px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.user-name { color: var(--muted); font-size: 14px; }
.role-badge {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  padding: 5px 10px; border-radius: 20px; border: 1px solid var(--brand);
  color: var(--brand); font-weight: 600;
}

/* ---------- Layout ---------- */
main { max-width: 1080px; margin: 0 auto; padding: 26px 20px 80px; }
.page-head { margin-bottom: 22px; }
.page-head h1 { margin: 0 0 4px; font-size: 26px; }
.page-head p { margin: 0; color: var(--muted); }

.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 820px){ .grid.cols-2,.grid.cols-3,.grid.cols-4 { grid-template-columns: 1fr; } }

/* ---------- Cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
}
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .label { color: var(--muted); font-size: 13px; }
.stat .value { font-size: 28px; font-weight: 700; }
.stat .value.brand { color: var(--brand); }

/* ---------- Buttons ---------- */
.btn {
  border: none; cursor: pointer; font-size: 14px; font-weight: 600;
  padding: 11px 18px; border-radius: 10px; color: #fff;
  background: var(--brand-grad); transition: .15s transform, .15s opacity;
}
.btn:hover { opacity: .92; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn-soft { background: var(--card-2); color: var(--text); border: 1px solid var(--line); }
.btn-danger { background: linear-gradient(135deg,#ef5d6b,#c0392b); }
.btn-ok { background: linear-gradient(135deg,#34c77b,#159c58); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Forms ---------- */
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 13px; border-radius: 10px;
  background: var(--bg-soft); border: 1px solid var(--line); color: var(--text);
  font-size: 15px; font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--brand);
}
.field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px){ .row-2 { grid-template-columns: 1fr; } }
.checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.checkbox input { width: auto; }

/* ---------- Auth ---------- */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.auth-card { width: 100%; max-width: 420px; }
.auth-logo { text-align: center; margin-bottom: 22px; }
.auth-logo .brand-mark { margin: 0 auto 12px; width: 60px; height: 60px; font-size: 34px; }
.auth-logo h1 { margin: 0; font-size: 24px; }
.auth-logo p { margin: 6px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 8px; margin-bottom: 18px; background: var(--bg-soft); padding: 5px; border-radius: 12px; }
.tabs button { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); border-radius: 9px; cursor: pointer; font-weight: 600; }
.tabs button.active { background: var(--card-2); color: var(--text); }
.role-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.role-picker.role-picker-3 { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 520px){ .role-picker.role-picker-3 { grid-template-columns: 1fr; } }
.role-opt { border: 1px solid var(--line); border-radius: 11px; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; }
.role-opt.active { border-color: var(--brand); background: rgba(33,193,166,.1); }
.role-opt .ico { font-size: 22px; display: block; margin-bottom: 4px; }

/* ---------- Badges / statuses ---------- */
.badge { display: inline-block; font-size: 11px; padding: 4px 9px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.badge.nou { background: rgba(240,169,59,.15); color: var(--warn); }
.badge.platit { background: rgba(31,122,224,.15); color: #6db0ff; }
.badge.acceptat { background: rgba(33,193,166,.15); color: var(--brand); }
.badge.in_progres { background: rgba(146,120,255,.16); color: #b3a4ff; }
.badge.finalizat { background: rgba(52,199,123,.15); color: var(--ok); }
.badge.anulat { background: rgba(239,93,107,.15); color: var(--danger); }

/* ---------- Request list ---------- */
.req { display: flex; flex-direction: column; gap: 12px; }
.req-item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.req-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.req-top h3 { margin: 0 0 4px; font-size: 16px; }
.req-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 12px; }
.req-meta span { display: inline-flex; align-items: center; gap: 5px; }
.req-price { text-align: right; }
.req-price .big { font-size: 20px; font-weight: 700; color: var(--brand); }
.req-price small { color: var(--muted); display: block; }
.req-body { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.req-notes { color: var(--muted); font-size: 13px; margin-top: 8px; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty .ico { font-size: 44px; display: block; margin-bottom: 12px; opacity: .6; }

.section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 26px 0 12px; }

/* ---------- Price summary box ---------- */
.summary { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.summary .line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.summary .line.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-size: 18px; font-weight: 700; }
.summary .line.total .amt { color: var(--brand); }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(6,10,14,.7); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 440px; padding: 24px; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 6px; font-size: 20px; }
.modal .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 80; }
.toast { background: var(--card-2); border: 1px solid var(--line); border-left: 4px solid var(--brand); padding: 13px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; min-width: 240px; animation: slidein .25s ease; }
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--danger); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Nav tabs (dashboard) ---------- */
.navtabs { display: flex; gap: 6px; margin-bottom: 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.navtabs button { background: none; border: none; color: var(--muted); padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
.navtabs button.active { color: var(--brand); border-bottom-color: var(--brand); }

/* selector discret de limbă (RO / EN / नेपाली) */
.lang-select { position: fixed; right: 12px; bottom: 12px; z-index: 9999; cursor: pointer;
  font-size: 12px; font-weight: 600; padding: 5px 8px; border-radius: 8px;
  border: 1px solid rgba(0,0,0,.18); background: rgba(255,255,255,.9); color: #333;
  opacity: .7; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.lang-select:hover { opacity: 1; }

.pill { font-size: 12px; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line); padding: 3px 9px; border-radius: 20px; }
a.pill.contact { text-decoration: none; color: var(--brand); border-color: var(--brand); font-weight: 700; }
a.pill.contact:hover { background: var(--brand); color: #fff; }

/* logistică lenjerie: adresă de ridicare + Waze + contact */
.linen-logistics { margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg-soft); display: flex; flex-direction: column; gap: 10px; }
.linen-logistics .ll-row { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: center; font-size: 13.5px; }
.linen-logistics .ll-k { color: var(--muted); font-weight: 600; }
.linen-logistics .ll-v { color: var(--text); font-weight: 600; text-align: right; }
.waze-link { display: inline-block; margin-left: 8px; padding: 3px 10px; border-radius: 8px; background: #33ccff; color: #05263a; font-weight: 800; text-decoration: none; font-size: 12.5px; white-space: nowrap; }
.waze-link:hover { background: #12bdf0; }
.maps-link { display: inline-block; padding: 2px 9px; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--brand); color: var(--brand); font-weight: 700; text-decoration: none; font-size: 12.5px; white-space: nowrap; }
.maps-link:hover { background: var(--brand); color: #fff; }

/* pontaj / timesheet */
.timesheet { display: flex; flex-direction: column; font-size: 13.5px; overflow-x: auto; }
.timesheet .ts-row { display: grid; grid-template-columns: 92px 1fr 66px 76px 78px; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); align-items: center; min-width: 460px; }
.timesheet .ts-row.ts-6 { grid-template-columns: 88px 130px 1fr 62px 74px 74px; min-width: 620px; }
.timesheet .ts-head { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .03em; }
.timesheet .ts-addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.timesheet .ts-dur { font-weight: 800; color: var(--brand); }

/* modal alegere adresă de ridicare */
.pk-opts { display: flex; flex-direction: column; gap: 8px; }
.pk-opt { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.pk-opt input { margin-top: 3px; }
.pk-opt span { display: flex; flex-direction: column; }
.pk-opt small { color: var(--muted); font-size: 12px; margin-top: 2px; }
.pk-opt:has(input:checked) { border-color: var(--brand); background: var(--bg-soft); }

/* ---------- Stripe-style checkout ---------- */
.stripe-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.stripe-logo { font-weight: 800; font-size: 22px; color: #635bff; letter-spacing: -1px; font-family: system-ui, sans-serif; }
.stripe-test { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #b26b00; background: #ffe7ba; padding: 3px 8px; border-radius: 5px; }
.stripe-amount { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
.stripe-amt-label { font-size: 13px; color: var(--muted); }
.stripe-amt-value { font-size: 30px; font-weight: 800; }
.stripe-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg-soft); }
.stripe-card input { width: 100%; border: none; background: transparent; color: var(--text); padding: 13px; font-size: 15px; font-family: inherit; }
.stripe-card input:focus { outline: none; }
.stripe-cardnum { border-bottom: 1px solid var(--line) !important; }
.stripe-card-row { display: flex; }
.stripe-card-row input:first-child { border-right: 1px solid var(--line); }
.stripe-pay { background: #635bff; margin-top: 4px; }
.stripe-pay:hover { background: #524dcc; opacity: 1; }
.stripe-foot { font-size: 11px; color: var(--muted); margin: 14px 0 0; line-height: 1.5; }

/* ---------- Payout breakdown ---------- */
.payout { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 13px; }
.payout .prow { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); }
.payout .prow.net { color: var(--brand); font-weight: 700; font-size: 15px; border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 8px; }
.payout .prow.comm { color: var(--warn); }
.badge.payout-pending { background: rgba(240,169,59,.15); color: var(--warn); }
.badge.payout-released { background: rgba(52,199,123,.15); color: var(--ok); }

/* ---------- Locație status ---------- */
.badge.loc-pending { background: rgba(240,169,59,.15); color: var(--warn); }
.badge.loc-approved { background: rgba(52,199,123,.15); color: var(--ok); }
.badge.loc-rejected { background: rgba(239,93,107,.15); color: var(--danger); }

/* ---------- Reducere / interval preț ---------- */
.summary .line.disc { color: var(--ok); }
.pricing-legend { margin-top: 14px; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.pl-row { display: flex; align-items: center; gap: 8px; }
.pl-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.pl-dot.peak { background: var(--warn); }
.pl-dot.off { background: var(--ok); }

/* ---------- Lenjerie ---------- */
.linen-compo { margin-top: 8px; font-size: 12px; color: var(--muted); background: var(--bg-soft); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
.payout .prow.laundry { align-items: flex-start; gap: 10px; }
.payout .prow.laundry .checkbox { font-size: 13px; color: var(--text); cursor: pointer; }
.payout .prow.laundry input { margin-top: 1px; }
.divider { height: 1px; background: var(--line); margin: 20px 0; }
.link { color: var(--brand); cursor: pointer; text-decoration: underline; }

/* ---------- Avatar ---------- */
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden;
  background: var(--card-2); border: 1px solid var(--line); flex-shrink: 0; vertical-align: middle; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.ph { color: var(--brand); font-weight: 700; background: linear-gradient(135deg, rgba(33,193,166,.25), rgba(31,122,224,.25)); }
#topAvatar .avatar { cursor: pointer; }

/* ---------- Stele / rating ---------- */
.rating { display: inline-flex; align-items: center; gap: 1px; vertical-align: middle; }
.rating .star { color: #3a4a5a; font-size: 15px; line-height: 1; }
.rating .star.on { color: var(--warn); }
.rating .rcount { color: var(--muted); font-size: 12px; margin-left: 5px; }
.rinline { color: var(--warn); font-weight: 700; font-size: 12px; }

/* ---------- Widget recenzie ---------- */
.review-box { margin-top: 12px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.review-box.done { color: var(--muted); font-size: 13.5px; }
.review-box .rv-title { font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
.star-pick { display: flex; gap: 4px; margin-bottom: 10px; }
.star-pick .star.pick { font-size: 26px; color: #3a4a5a; cursor: pointer; transition: color .1s, transform .1s; }
.star-pick .star.pick:hover { transform: scale(1.15); }
.star-pick .star.pick.on { color: var(--warn); }
.review-box .rv-comment { width: 100%; padding: 9px 11px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-size: 14px; margin-bottom: 10px; font-family: inherit; }

/* ---------- Executanți înscriși (solicitantul alege) ---------- */
.applicants { margin-top: 12px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.applicants .ap-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.ap-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.ap-row:first-of-type { border-top: none; }
.ap-who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.ap-who small { color: var(--muted); }

/* ---------- Consumabile (selector în formular) ---------- */
.consumables-pick { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg-soft); }
.cp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
.cp-row:first-child { border-top: none; }
.cp-info { display: flex; flex-direction: column; }
.cp-info small { color: var(--muted); font-size: 12px; }
.cp-qty { width: 70px; padding: 7px 9px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-size: 14px; text-align: center; }

/* ---------- Listă de cumpărături (card) ---------- */
.shopping { margin-top: 12px; background: rgba(146,120,255,.10); border: 1px solid rgba(146,120,255,.30); border-left: 4px solid #9278ff; border-radius: 10px; padding: 12px 14px; }
.shopping .sh-title { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #b3a4ff; font-weight: 700; margin-bottom: 10px; }
.shopping .sh-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
.shopping .sh-row small { color: var(--muted); }
.shopping .sh-total { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px; font-weight: 700; color: var(--text); }

/* ---------- Stoc executanți ---------- */
.stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 4px; }
.stock-cell { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stock-cell .sc-name { font-size: 13.5px; }
.stock-cell .sc-qty { font-family: "Poppins", "Segoe UI", sans-serif; font-weight: 800; font-size: 22px; color: var(--brand); }
.stock-cell.low { border-color: rgba(239,93,107,.5); background: rgba(239,93,107,.08); }
.stock-cell.low .sc-qty { color: var(--danger); }
.supply-form .field { padding: 0; }
.supply-form select, .supply-form input { padding: 10px 11px; border-radius: 9px; background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); font-size: 14px; font-family: inherit; }
.stock-cell .sc-name small { color: var(--muted); }

/* ---------- Alerte stoc ---------- */
.tab-alert { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: middle; }
.alerts-card { background: rgba(239,93,107,.10); border: 1px solid rgba(239,93,107,.4); border-left: 4px solid var(--danger); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
.alerts-card .al-title { font-weight: 700; color: var(--danger); margin-bottom: 12px; font-size: 15px; }
.al-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(239,93,107,.2); font-size: 14px; }
.al-row:first-of-type { border-top: none; }
.al-row .al-qty { color: var(--danger); font-weight: 700; }

/* ---------- Circuit lenjerie (admin) ---------- */
.linen-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
@media (max-width: 720px){ .linen-grid { grid-template-columns: repeat(2, 1fr); } }
.linen-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.linen-grid input { padding: 10px 11px; border-radius: 9px; background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); font-size: 18px; font-weight: 700; text-align: center; font-family: "Poppins", "Segoe UI", sans-serif; }

/* ---------- Avertizare zonă fără executanți ---------- */
.zone-warn { margin-top: 8px; background: rgba(240,169,59,.12); border: 1px solid rgba(240,169,59,.4); border-radius: 9px; padding: 10px 12px; font-size: 13px; color: #f0c987; }

/* ---------- Notificare „locația e gata pentru oaspeți" ---------- */
.ready-banner {
  margin-top: 12px; background: rgba(52,199,123,.12); border: 1px solid rgba(52,199,123,.4);
  border-left: 4px solid var(--ok); border-radius: 10px; padding: 11px 14px; font-size: 14px; color: #bff0d3;
}
.notif-bar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  background: linear-gradient(90deg, rgba(52,199,123,.16), rgba(52,199,123,.05));
  border: 1px solid rgba(52,199,123,.4); border-radius: 12px; padding: 13px 16px; font-size: 14px;
}
.notif-bar .nb-ico { font-size: 20px; }
.notif-bar span:nth-child(2) { flex: 1; color: var(--text); }
.notif-bar strong { color: var(--ok); }

/* ---------- Detalii check-in (interfon / lockbox) ---------- */
.checkin { margin-top: 12px; background: rgba(31,122,224,.10); border: 1px solid rgba(31,122,224,.30);
  border-left: 4px solid var(--brand-2); border-radius: 10px; padding: 12px 14px; }
.checkin .ci-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #6db0ff; font-weight: 700; margin-bottom: 10px; }
.checkin .ci-grid { display: flex; flex-wrap: wrap; gap: 22px; }
.checkin .ci-item { display: flex; flex-direction: column; gap: 2px; }
.checkin .ci-l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.checkin .ci-v { font-size: 18px; font-weight: 700; color: var(--text); font-family: "Segoe UI", monospace; letter-spacing: .5px; }
.checkin .ci-notes { margin-top: 10px; font-size: 13px; color: var(--muted); }

/* =========================================================
   HOME / LANDING — brand Sleep & Go (alb/albastru)
   ========================================================= */

/* ===== Calendar de sume (cheltuieli client / încasări agent) ===== */
.cal-wrap { max-width: 600px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cal-title { font-weight: 800; font-size: 18px; text-transform: capitalize; }
.cal-nav { padding: 4px 16px; font-size: 20px; line-height: 1; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 4px 0 6px; }
.cal-weekdays > div { text-align: center; font-size: 12px; color: var(--muted, #8aa); font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-cell { min-height: 58px; border-radius: 10px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
.cal-cell.empty { background: transparent; border: none; }
.cal-cell.has { background: rgba(56,189,248,.14); border-color: rgba(56,189,248,.4); }
.cal-cell.today { outline: 2px solid var(--brand, #22d3ee); outline-offset: -1px; }
.cal-day { font-size: 12px; color: var(--muted, #9ab); font-weight: 600; }
.cal-amt { font-size: 12.5px; font-weight: 800; align-self: flex-start; }

/* ===== Multi-zonă (Serviciu lenjerie) ===== */
.area-checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; }
.area-check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 4px 2px; }
.area-check input { width: 16px; height: 16px; flex: none; }
@media (max-width: 560px) { .area-checks { grid-template-columns: 1fr; } }

/* =========================================================
   Sleep & Go Cleaning — HOME / LANDING
   Brand preluat de pe sleepandgocleaning.com:
   albastru #009FE3 + navy #3D66AE, alb/aerisit, Poppins + Lato
   ========================================================= */
.home {
  --h-blue: #009FE3;      /* accent principal (CTA, telefon) */
  --h-blue-d: #0787be;
  --h-navy: #3D66AE;      /* albastru royal (bară sus, accente) */
  --h-navy-d: #2f5090;
  --h-ink: #1f2733;       /* text principal */
  --h-muted: #5c6875;
  --h-line: #e3e9f1;
  --h-bg: #ffffff;
  --h-soft: #f3f7fc;      /* gri deschis cu bias albastru */
  --h-soft-2: #eaf1fb;
  --h-shadow: 0 18px 50px rgba(31, 60, 110, .12);
  --h-shadow-sm: 0 6px 20px rgba(31, 60, 110, .10);
  color: var(--h-ink);
  background: var(--h-bg);
  font-family: "Lato", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.6;
}
body.landing-active { background: var(--h-bg); }
.home h1, .home h2, .home h3, .home .display {
  font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
  color: var(--h-ink);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.home a { color: inherit; text-decoration: none; }
.home .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.home .eyebrow {
  font-family: "Poppins", "Segoe UI", sans-serif;
  text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 600;
  color: var(--h-blue);
}

/* ---------- Utility bar ---------- */
.h-utility { background: var(--h-navy); color: #fff; font-size: 13.5px; }
.h-utility .wrap { display: flex; align-items: center; justify-content: space-between; height: 40px; }
.h-utility a.phone { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.h-utility .u-right { display: flex; gap: 18px; opacity: .92; }
.h-utility .u-right span { display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 720px){ .h-utility .u-right { display: none; } }

/* ---------- Header ---------- */
.h-header {
  position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--h-line);
}
.h-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 74px; }
.h-logo { display: flex; align-items: center; gap: 11px; font-family: "Poppins", sans-serif; font-weight: 700; font-size: 20px; }
.h-logo .mark { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(135deg, var(--h-blue), var(--h-navy)); color: #fff; box-shadow: var(--h-shadow-sm); }
.h-logo small { display:block; font-size: 10px; letter-spacing: .28em; color: var(--h-muted); font-weight: 600; text-transform: uppercase; }
.h-nav { display: flex; align-items: center; gap: 30px; }
.h-nav a { font-size: 15px; font-weight: 600; color: var(--h-ink); opacity: .85; }
.h-nav a:hover { color: var(--h-blue); opacity: 1; }
@media (max-width: 860px){ .h-nav a:not(.h-cta) { display: none; } }

.h-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: "Poppins", sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;
  padding: 12px 22px; border-radius: 999px; border: none; transition: .16s transform, .16s box-shadow, .16s background;
}
.h-btn:active { transform: translateY(1px); }
.h-btn.primary { background: var(--h-blue); color: #fff; box-shadow: 0 8px 22px rgba(0,159,227,.32); }
.h-btn.primary:hover { background: var(--h-blue-d); }
.h-btn.navy { background: var(--h-navy); color: #fff; }
.h-btn.navy:hover { background: var(--h-navy-d); }
.h-btn.ghost { background: #fff; color: var(--h-navy); border: 1.5px solid var(--h-line); }
.h-btn.ghost:hover { border-color: var(--h-blue); color: var(--h-blue); }
.h-btn.lg { padding: 15px 30px; font-size: 16px; }
.h-btn.white { background:#fff; color: var(--h-navy); }

/* ---------- Hero ---------- */
.h-hero { position: relative; overflow: hidden; background:
  radial-gradient(900px 500px at 88% -8%, var(--h-soft-2) 0%, rgba(234,241,251,0) 60%),
  linear-gradient(180deg, #fff 0%, var(--h-soft) 100%); }
.h-hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; padding: 72px 24px 84px; }
@media (max-width: 900px){ .h-hero .wrap { grid-template-columns: 1fr; gap: 40px; padding: 48px 24px 60px; } }
.h-hero h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.06; margin: 16px 0 0; font-weight: 800; }
.h-hero h1 .accent { color: var(--h-blue); }
.h-hero .lead { font-size: 18px; color: var(--h-muted); margin: 20px 0 30px; max-width: 30em; }
.h-hero .cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
.h-trust { display: flex; gap: 24px; margin-top: 34px; flex-wrap: wrap; }
.h-trust .item { display: flex; flex-direction: column; }
.h-trust .n { font-family: "Poppins", sans-serif; font-weight: 800; font-size: 24px; color: var(--h-navy); }
.h-trust .l { font-size: 13px; color: var(--h-muted); }

/* Hero product preview card (mock din aplicație) */
.h-preview { position: relative; }
.h-preview .card-mock {
  background: #fff; border: 1px solid var(--h-line); border-radius: 18px; box-shadow: var(--h-shadow);
  padding: 22px; position: relative; z-index: 2;
}
.h-preview .pv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.h-preview .pv-top h3 { font-size: 17px; margin: 0 0 6px; }
.h-preview .pv-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  color: #0a7d3f; background: #dff5e8; padding: 5px 10px; border-radius: 999px; }
.h-preview .pv-meta { font-size: 13.5px; color: var(--h-muted); display: flex; flex-direction: column; gap: 5px; }
.h-preview .pv-sum { margin-top: 16px; border-top: 1px dashed var(--h-line); padding-top: 14px; }
.h-preview .pv-line { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; color: var(--h-ink); }
.h-preview .pv-line.total { border-top: 1px solid var(--h-line); margin-top: 6px; padding-top: 12px; font-weight: 800; font-size: 18px; font-family: "Poppins", sans-serif; }
.h-preview .pv-line.total .amt { color: var(--h-blue); }
/* mini-listă consumabile comandate */
.h-preview .pv-cons { margin-top: 14px; border-top: 1px dashed var(--h-line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.h-preview .pv-cons-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--h-muted); }
.h-preview .pv-cons-row span:last-child { font-weight: 700; color: var(--h-ink); }
/* executantul care se ocupă: avatar + rating */
.h-preview .pv-exec { margin-top: 16px; border-top: 1px solid var(--h-line); padding-top: 14px; display: flex; align-items: center; gap: 11px; }
.h-preview .pv-exec-av { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; font-size: 14px; color: #fff; background: linear-gradient(135deg, var(--h-blue), var(--h-navy)); font-family: "Poppins", sans-serif; }
.h-preview .pv-exec-info { flex: 1 1 auto; min-width: 0; }
.h-preview .pv-exec-name { font-weight: 700; font-size: 14px; color: var(--h-ink); }
.h-preview .pv-exec-role { font-size: 12px; color: var(--h-muted); }
.h-preview .pv-exec-rating { flex: 0 0 auto; font-weight: 800; font-size: 14px; color: #F4A72B; white-space: nowrap; }
.h-preview .pv-exec-rating small { color: var(--h-muted); font-weight: 600; font-size: 11px; }
.h-preview .pv-glow { position: absolute; inset: -20px -20px auto auto; width: 200px; height: 200px; z-index: 1;
  background: radial-gradient(circle, rgba(0,159,227,.22), transparent 68%); filter: blur(6px); }
.h-preview .pv-chip { position: absolute; z-index: 3; background:#fff; border:1px solid var(--h-line); box-shadow: var(--h-shadow-sm);
  border-radius: 12px; padding: 10px 13px; font-size: 13px; font-weight: 700; display:flex; align-items:center; gap:8px; }
.h-preview .pv-chip.a { top: -18px; left: -14px; color: var(--h-navy); }
.h-preview .pv-chip.b { bottom: -16px; right: 18px; color: var(--h-blue); }
@media (max-width: 900px){ .h-preview .pv-chip { display: none; } }

/* ---------- Sections ---------- */
.h-section { padding: 78px 0; }
.h-section.soft { background: var(--h-soft); }
.h-section-head { text-align: center; max-width: 640px; margin: 0 auto 46px; }
.h-section-head h2 { font-size: clamp(26px, 3.4vw, 36px); margin: 12px 0 0; font-weight: 800; }
.h-section-head p { color: var(--h-muted); font-size: 17px; margin: 14px 0 0; }

/* Steps */
.h-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; counter-reset: step; }
@media (max-width: 820px){ .h-steps { grid-template-columns: 1fr; } }
.h-step { background: #fff; border: 1px solid var(--h-line); border-radius: 16px; padding: 28px; position: relative; box-shadow: var(--h-shadow-sm); }
.h-step .num { font-family: "Poppins", sans-serif; font-weight: 800; font-size: 15px; width: 40px; height: 40px; border-radius: 11px;
  display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--h-blue), var(--h-navy)); margin-bottom: 16px; }
.h-step h3 { font-size: 18px; margin: 0 0 8px; }
.h-step p { color: var(--h-muted); font-size: 14.5px; margin: 0; }

/* Circuit lenjerie — callout */
.linen-circuit-note { display: flex; gap: 18px; align-items: flex-start; margin-top: 34px;
  background: linear-gradient(120deg, var(--h-soft-2), #fff); border: 1px solid var(--h-line); border-left: 4px solid var(--h-blue);
  border-radius: 16px; padding: 24px 26px; box-shadow: var(--h-shadow-sm); }
.linen-circuit-note .lc-ico { font-size: 34px; line-height: 1; }
.linen-circuit-note strong { font-family: "Poppins", sans-serif; font-size: 17px; }
.linen-circuit-note p { margin: 8px 0 0; color: var(--h-muted); font-size: 15px; }
@media (max-width: 620px){ .linen-circuit-note { flex-direction: column; gap: 10px; } }

/* Services grid */
.h-services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 900px){ .h-services { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px){ .h-services { grid-template-columns: 1fr; } }
.h-serv { background: #fff; border: 1px solid var(--h-line); border-radius: 16px; padding: 24px; transition: .18s transform, .18s box-shadow, .18s border-color; }
.h-serv:hover { transform: translateY(-4px); box-shadow: var(--h-shadow); border-color: #cfe0f4; }
.h-serv .ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 23px; margin-bottom: 15px;
  background: var(--h-soft-2); }
.h-serv h3 { font-size: 17px; margin: 0 0 8px; }
.h-serv p { color: var(--h-muted); font-size: 14px; margin: 0; }

/* Închiriere lenjerii */
.h-rental { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
@media (max-width: 860px){ .h-rental { grid-template-columns: 1fr; gap: 28px; } }
.h-rental-info h2 { font-size: clamp(24px, 3vw, 32px); margin: 12px 0 14px; font-weight: 800; }
.h-rental-info > p { color: var(--h-muted); font-size: 16px; margin: 0 0 16px; }
.h-rental-list { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 10px; }
.h-rental-list li { font-size: 15px; color: var(--h-ink); }
.h-rental-form { background: #fff; border: 1px solid var(--h-line); border-radius: 18px; box-shadow: var(--h-shadow); padding: 26px; }
.rf-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
.rf-field label { font-size: 13px; color: var(--h-muted); font-weight: 600; }
.rf-field input, .rf-field textarea { padding: 12px 13px; border-radius: 10px; border: 1px solid var(--h-line); background: var(--h-soft); color: var(--h-ink); font-size: 15px; font-family: inherit; }
.rf-field input:focus, .rf-field textarea:focus { outline: none; border-color: var(--h-blue); }
.rf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rf-field select { padding: 12px 13px; border-radius: 10px; border: 1px solid var(--h-line); background: var(--h-soft); color: var(--h-ink); font-size: 15px; font-family: inherit; }

/* Simulator de preț */
.h-sim { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
.h-sim-form, .h-sim-result { background: #fff; border: 1px solid var(--h-line); border-radius: 18px; box-shadow: var(--h-shadow); padding: 24px; }
.h-sim .sim-radio { display: flex; gap: 18px; }
.h-sim .sim-radio label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--h-ink); font-weight: 500; }
.h-sim .sim-cons { display: flex; flex-direction: column; gap: 8px; }
.h-sim .sim-cons-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--h-ink); }
.h-sim .sim-cons-row small { color: var(--h-muted); }
.h-sim .sim-cons-row input { max-width: 78px; }
.h-sim .section-title { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 12px; color: var(--h-navy); }
.sim-breakdown { display: flex; flex-direction: column; gap: 8px; }
.sim-breakdown .sb-row { display: flex; justify-content: space-between; font-size: 14.5px; color: var(--h-ink); }
.sim-breakdown .sb-row.disc span:last-child { color: #1a9e5f; }
.sim-total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--h-line); font-weight: 700; font-size: 17px; }
.sim-total { color: var(--h-blue); font-family: "Poppins", sans-serif; font-size: 24px; font-weight: 800; }
@media (max-width: 820px){ .h-sim { grid-template-columns: 1fr; } }

/* Simulator în hero (compact) */
.h-hero-sim { padding: 22px; }
.h-hero-sim .hs-title { font-family: "Poppins", sans-serif; font-weight: 800; font-size: 18px; color: var(--h-navy); margin-bottom: 14px; }
.h-hero-sim .rf-field { margin-bottom: 10px; }
.h-hero-sim .rf-field label { font-size: 12px; }
.h-hero-sim .rf-field input, .h-hero-sim .rf-field select { padding: 9px 11px; font-size: 14px; }
.h-hero-sim .sim-radio { gap: 14px; }
.h-hero-sim .sim-breakdown { margin: 12px 0 0; font-size: 13px; }
.h-hero-sim .sim-total-row { font-size: 15px; margin-top: 12px; padding-top: 12px; }
.h-hero-sim .sim-total { font-size: 22px; }
.h-hero-sim .hs-offer { margin-top: 14px; border-top: 1px dashed var(--h-line); padding-top: 14px; }
.h-hero-sim .hs-offer .rf-field { margin-bottom: 10px; }
/* produse (consumabile) — listă organizată */
.h-hero-sim .sim-cons { display: flex; flex-direction: column; background: var(--h-soft); border: 1px solid var(--h-line); border-radius: 10px; padding: 4px 10px; }
.h-hero-sim .sim-cons-row { display: grid; grid-template-columns: 1fr 62px; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
.h-hero-sim .sim-cons-row + .sim-cons-row { border-top: 1px solid var(--h-line); }
.h-hero-sim .sim-cons-row > span { color: var(--h-ink); line-height: 1.2; }
.h-hero-sim .sim-cons-row small { color: var(--h-muted); }
.h-hero-sim .sim-cons-row input { max-width: 62px; text-align: center; padding: 6px 6px; margin: 0; }
/* CTA-uri: adaugă locație + creare cont */
.h-hero-sim .hs-alt { margin-top: 14px; border-top: 1px dashed var(--h-line); padding-top: 14px; }
.h-hero-sim .hs-alt .h-btn { margin-bottom: 8px; }
.h-hero-sim .hs-signup { text-align: center; font-size: 13px; color: var(--h-muted); margin: 0; }
.h-hero-sim .hs-signup a { color: var(--h-blue); font-weight: 700; cursor: pointer; text-decoration: none; }
.h-hero-sim .hs-signup a:hover { text-decoration: underline; }

/* Roles */
.h-roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.h-roles.h-roles-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1000px){ .h-roles.h-roles-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 820px){ .h-roles { grid-template-columns: 1fr; } .h-roles.h-roles-4 { grid-template-columns: 1fr; } }
/* Garanție client — bandă evidențiată */
.h-guarantee { display: flex; align-items: center; gap: 28px; border-radius: 22px; padding: 34px 38px;
  background: linear-gradient(150deg, var(--h-navy), #2b4f92); color: #fff; box-shadow: var(--h-shadow); }
.h-guarantee .g-badge { flex: 0 0 auto; width: 78px; height: 78px; border-radius: 20px; display: grid; place-items: center;
  font-size: 40px; background: rgba(255,255,255,.14); }
.h-guarantee .eyebrow { color: #bcd4f5; }
.h-guarantee h2 { margin: 4px 0 10px; color: #fff; }
.h-guarantee h2 .accent { color: #7ec9ff; }

        { id: "rev_2", requestId: null, fromId: "u_req1", toId: "u_exec1", stars: 4, comment: "Foarte bine, a venit la timp.", createdAt: Date.now() - 100000000 },
      ],
      // catalog de consumabile (prețuri de achiziție în lei) — gestionat de admin
      // lowAt = prag de alertă: când stocul unui Agent Cleaning ≤ lowAt, adminul e alertat să livreze
      products: [
        { id: "p_hartie", name: "Hârtie igienică", unit: "rolă", priceRon: 2, lowAt: 4, active: true },

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) { const s = seed(); localStorage.setItem(KEY, JSON.stringify(s)); return s; }
      return JSON.parse(raw);
    } catch (e) { const s = seed(); return s; }
  }

  let db = load();

  /* --- Mod de stocare: "api" (server Node/Railway) sau "local" (localStorage/demo) --- */
  let MODE = "local";
  let saveTimer = null, pendingSave = false, pollTimer = null;
  let onRemote = null;   // callback de re-randare la schimbări venite de la server

  function stripState(d) { const { session, ...rest } = d; return rest; }

  async function apiGET(p) {
    const r = await fetch(p, { credentials: "same-origin" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function apiPOST(p, body) {
    const r = await fetch(p, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return r.json();
  }
  function scheduleServerSave() {
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await apiPOST("/api/state", { state: stripState(db) }); }
      catch (e) {}
      pendingSave = false;
    }, 350);
  }

  // save(db) — apelat de toate mutațiile. În modul API scrie pe server; altfel în localStorage.
  function save(d) {
    if (MODE === "api") scheduleServerSave();
    else localStorage.setItem(KEY, JSON.stringify(d));
  }

  async function refreshState() {
    const st = await apiGET("/api/state");
    const keep = db.session;
    db = st.state; db.session = keep;
    return db;
  }
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      if (pendingSave) return;             // nu suprascrie ce tocmai am modificat local
      try {
        const st = await apiGET("/api/state");
        if (JSON.stringify(st.state) !== JSON.stringify(stripState(db))) {
          const keep = db.session;
          db = st.state; db.session = keep;
          if (onRemote) onRemote();
        }
      } catch (e) {}
    }, 4000);
  }

  const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9);

  const round2 = (n) => Math.round(n * 100) / 100;

  /* --- Preț dinamic pe interval orar ---
     Preț de bază în afara vârfului. În vârf (10:00–15:00) → +peakSurchargePct%. */
  const parseHour = (t) => { const h = parseInt(String(t || "").split(":")[0], 10); return isNaN(h) ? null : h; };
  // adaosul de vârf (%) pentru ora de început: peakSurchargePct dacă e în vârf, altfel 0
  function peakSurchargePctFor(startTime) {
    const s = CONFIG.schedule;
    const h = parseHour(startTime);
    if (h == null) return 0;
    return (h >= s.peakStart && h < s.peakEnd) ? s.peakSurchargePct : 0;
  }
  function isPeak(startTime) {
    const s = CONFIG.schedule, h = parseHour(startTime);
    return h != null && h >= s.peakStart && h < s.peakEnd;
  }
  // +10% dacă data cade în weekend (sâmbătă/duminică) sau sărbătoare legală
  function surchargePctFor(dateStr) {
    if (!dateStr) return 0;
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return 0;
    const day = d.getDay();                 // 0=duminică, 6=sâmbătă
    const md = String(dateStr).slice(5);    // „LL-ZZ"
    if (day === 0 || day === 6 || CONFIG.legalHolidays.includes(md)) return CONFIG.weekendHolidaySurchargePct;
    return 0;
  }
  function isWeekendOrHoliday(dateStr) { return surchargePctFor(dateStr) > 0; }

  function commissionPct() { return (db.settings && db.settings.commissionPct != null) ? db.settings.commissionPct : CONFIG.commissionPct; }
  function ronPerEur() { return (db.settings && db.settings.ronPerEur) ? db.settings.ronPerEur : CONFIG.ronPerEur; }
  // preț de bază curățenie (€/m²) — editabil din admin; folosit peste tot (home, simulator, solicitări)
  function pricePerSqm() { return (db.settings && db.settings.pricePerSqm > 0) ? db.settings.pricePerSqm : CONFIG.pricePerSqm; }
  const ronToEur = (ron) => round2(ron / ronPerEur());

  /* --- Calcule de preț ---
     Curățenie în €. Reducerea de interval orar se aplică DOAR curățeniei
     (lenjeria e tarif fix de spălat/călcat, în lei, convertit în €). */
  // valoarea consumabilelor dintr-o solicitare (în lei), pe baza catalogului curent
  function consumablesRonOf(req) {
    const list = (req.consumables || []);
    return list.reduce((s, c) => {
      const p = (db.products || []).find(x => x.id === c.productId);
      return s + (p ? p.priceRon * (Number(c.qty) || 0) : 0);
    }, 0);
  }

  function priceOf(req) {
    const cleaning = (Number(req.sqm) || 0) * pricePerSqm();   // preț de bază (off-peak)
    const peakPct = peakSurchargePctFor(req.startTime);        // +30% în vârf (10–15)
    const peakAdd = round2(cleaning * peakPct / 100);
    const afterPeak = round2(cleaning + peakAdd);
    // suprataxă weekend / sărbătoare legală (+10%) aplicată după adaosul de vârf
    const surPct = surchargePctFor(req.date);
    const surcharge = round2(afterPeak * surPct / 100);
    const cleaningNet = round2(afterPeak + surcharge);

    const linenSets = req.linens ? (Number(req.linenSets) || 0) : 0;
    const linenRon = linenSets * CONFIG.linenSetPriceRon;   // 45 lei / set
    const linenEur = ronToEur(linenRon);

    // consumabile: adminul pune prețul de achiziție; aplicația adaugă adaos comercial
    const consumablesCostRon = consumablesRonOf(req);                                   // achiziție
    const consumablesMarkupRon = round2(consumablesCostRon * CONFIG.consumableMarkupPct / 100); // adaos 10%
    const consumablesRon = round2(consumablesCostRon + consumablesMarkupRon);           // ce plătește clientul
    const consumablesEur = ronToEur(consumablesRon);

    const serviceTotal = round2(cleaningNet + linenEur);        // servicii (se comisionează)
    const total = round2(serviceTotal + consumablesEur);        // + consumabile (achiziție + adaos)
    return {
      cleaning, peakPct, peakAdd, surPct, surcharge, cleaningNet,
      linenIncluded: !!req.linens, linenSets, linenRon, linenEur,
      consumablesCostRon, consumablesMarkupRon, consumablesRon, consumablesEur, markupPct: CONFIG.consumableMarkupPct,
      serviceTotal, total,
    };
  }

  /* Împărțirea banilor:
     - platforma reține comisionul din TOT ce plătește clientul;
     - partea de curățenie (după comision) → Agentul Cleaning de curățenie;
     - serviciul de lenjerie (45 lei/set, după comision) → Agentul Cleaning care preia
       serviciul de lenjerie (poate fi altul). Dacă nimeni nu-l preia, rămâne la platformă. */
  function breakdown(req) {
    const p = priceOf(req);
    const pct = commissionPct();

    const cleaningPayout = round2(p.cleaningNet * (1 - pct / 100));
    const linenTaken = !!(req.linens && req.linenExecutorId);
    const linenPayout = round2(p.linenEur * (1 - pct / 100));   // valoarea serviciului de lenjerie

    // consumabile: produsele preluate de Serviciu lenjerie și distribuite Agenților Cleaning.
    // Adaosul se împarte Agent Cleaning 50% / serviciu lenjerie 30% / admin 20%; costul → serviciul de lenjerie.
    const consCostEur = ronToEur(p.consumablesCostRon);
    const consMarkupEur = ronToEur(p.consumablesMarkupRon);
    const csp = CONFIG.consumableSplit;
    const laundryUser = req.linenExecutorId ? db.users.find(u => u.id === req.linenExecutorId) : null;
    const consLaundryHandles = !!(laundryUser && laundryUser.role === "spalatorie" && p.consumablesCostRon > 0);
    const consExecutantPayout = round2(consMarkupEur * csp.executant / 100);   // Agent Cleaning curățenie: 50% adaos
    const consLaundryMarkup = round2(consMarkupEur * csp.laundry / 100);       // serviciu lenjerie: 30% adaos
    const consAdminMarkup = round2(consMarkupEur * csp.admin / 100);           // admin: 20% adaos
    // serviciul de lenjerie primește achiziția înapoi + 30% din adaos (dacă el preia consumabilele)
    const consLaundryPayout = consLaundryHandles ? round2(consCostEur + consLaundryMarkup) : 0;
    // dacă niciun serviciu lenjerie nu preia consumabilele, achiziția + 30% adaos rămân la platformă
    const consAdminTotal = round2(consAdminMarkup + (consLaundryHandles ? 0 : consCostEur + consLaundryMarkup));

    // comision total al platformei = comision servicii + partea admin din consumabile
    const commission = round2(p.serviceTotal * pct / 100 + consAdminTotal);

    // plata Agentului Cleaning de curățenie = curățenie + 50% adaos consumabile (+ lenjerie dacă a preluat-o el)
    const payout = round2(cleaningPayout + consExecutantPayout + (linenTaken ? linenPayout : 0));

    return {
      ...p, pct, commission, cleaningPayout, linenPayout, linenTaken,
      consCostEur, consMarkupEur, consExecutantPayout, consLaundryPayout, consLaundryHandles, consAdminTotal,
      consumablesPayout: consExecutantPayout,   // (compat) partea Agentului Cleaning de curățenie
      payout,
    };
  }

  /* validează un interval orar față de program + minim ore */
  function validateSlot(startTime, endTime) {
    const s = CONFIG.schedule;
    const sh = parseHour(startTime), eh = parseHour(endTime);
    const sm = parseInt(String(startTime || "").split(":")[1] || "0", 10);
    const em = parseInt(String(endTime || "").split(":")[1] || "0", 10);
    if (sh == null || eh == null) return { ok: false, error: "Alege ora de început și de sfârșit." };
    const start = sh + sm / 60, end = eh + em / 60;
    if (start < s.open) return { ok: false, error: `Începutul nu poate fi înainte de ${s.open}:00.` };
    if (end > s.close) return { ok: false, error: `Sfârșitul nu poate depăși ${s.close}:00.` };
    if (end - start < s.minHours) return { ok: false, error: `Intervalul minim de lucru este ${s.minHours} ore.` };
    return { ok: true };
  }

  const Store = {
    CONFIG, STATUS, STATUS_LABEL, LOC_STATUS_LABEL,
    priceOf, breakdown,
    peakSurchargePctFor, isPeak, validateSlot, surchargePctFor, isWeekendOrHoliday,
    commissionPct, ronPerEur, ronToEur, pricePerSqm,
    setCommissionPct(pct) {
      if (!db.settings) db.settings = {};
      db.settings.commissionPct = Math.max(0, Math.min(100, Number(pct) || 0));
      save(db); return db.settings.commissionPct;
    },
    setRonPerEur(rate) {
      if (!db.settings) db.settings = {};
      const r = Number(rate);
      db.settings.ronPerEur = (r > 0) ? r : CONFIG.ronPerEur;
      save(db); return db.settings.ronPerEur;
    },
    setPricePerSqm(v) {
      if (!db.settings) db.settings = {};
      const p = Number(v);
      db.settings.pricePerSqm = (p > 0) ? round2(p) : CONFIG.pricePerSqm;
      save(db); return db.settings.pricePerSqm;
    },
    // simulator de preț (home): construiește o pseudo-solicitare și rulează calculul dinamic
    quote(data) {
      return priceOf({
        sqm: Number(data.sqm) || 0,
        startTime: data.startTime,
        date: data.date,
        linens: !!data.linens,
        linenSets: Number(data.linenSets) || 0,
        consumables: data.consumables || [],
      });
    },
    // cereri de ofertă din simulatorul de pe home
    offerLeads() { return (db.offerLeads || []).slice().sort((a, b) => b.createdAt - a.createdAt); },
    // publice (vizitator nelogat): în modul API merg printr-un endpoint dedicat, fără autentificare
    async addOfferLead(data) {
      if (!data.name || !data.phone) return { ok: false, error: "Completează numele și telefonul." };
      if (MODE === "api") {
        const r = await apiPOST("/api/lead", { type: "offer", data });
        if (r.ok) await refreshState();
        return r;
      }
      if (!db.offerLeads) db.offerLeads = [];
      const lead = { id: uid("offer"), name: data.name, phone: data.phone, email: data.email || "", note: data.note || "", quote: data.quote || null, createdAt: Date.now() };
      db.offerLeads.push(lead); save(db); return { ok: true, lead };
    },
    // lenjeria e preluată de: Agentul Cleaning de curățenie (dacă vrea) SAU un „Serviciu lenjerie"
    // (rol spalatorie) atunci când Agentul Cleaning de curățenie a refuzat.
    takeLinenService(reqId, executorId) {
      const r = this.requestById(reqId);
      if (!r || !r.linens || r.linenExecutorId) return { ok: false };
      const usr = this.userById(executorId);
      if (r.executorId === executorId) {
        // Agentul Cleaning de curățenie o preia direct (inclusiv după ce a marcat curățenia gata)
        if (![STATUS.ACCEPTAT, STATUS.IN_PROGRES, STATUS.FINALIZAT].includes(r.status)) return { ok: false };
      } else if (usr && usr.role === "spalatorie") {
        // serviciul de lenjerie o preia doar dacă Agentul Cleaning de curățenie a refuzat, în zona lui
        if (!r.linenDeclined || !this.areasOf(usr).includes(r.area)) return { ok: false };
        if (r.status === STATUS.ANULAT || r.status === STATUS.NOU) return { ok: false };
      } else {
        return { ok: false };
      }
      r.linenExecutorId = executorId; save(db); return { ok: true, r };
    },
    // solicitări cu lenjerie refuzată de Agent Cleaning, disponibile pentru „Serviciu lenjerie" din zonă
    availableLinenForLaundry(user) {
      const areas = this.areasOf(user);
      return this.requests().filter(r =>
        r.linens && !r.linenExecutorId && r.linenDeclined && areas.includes(r.area) &&
        r.status !== STATUS.ANULAT && r.status !== STATUS.NOU);
    },
    laundryJobsOf(userId) { return this.requests().filter(r => r.linenExecutorId === userId); },
    // Agentul Cleaning de curățenie refuză lenjeria (o preia spălătoria) și indică de unde se ridică
    declineLinenService(reqId, executorId, pickup) {
      const r = this.requestById(reqId);
      if (!r || r.executorId !== executorId || r.linenExecutorId) return { ok: false };
      if (!pickup || !pickup.address) return { ok: false, error: "Indică adresa de la care se ridică lenjeria." };
      r.linenDeclined = true;
      r.linenPickup = { type: pickup.type || "other", address: pickup.address };
      save(db); return { ok: true, r };
    },
    // Agentul Cleaning de lenjerie marchează serviciul gata → plata lenjeriei se eliberează
    finishLinenService(reqId) {
      const r = this.requestById(reqId); if (!r) return;
      r.linenDone = true; r.linenPayoutStatus = "released";
      // circuit lenjerie: curată, depozitată la Agentul Cleaning (🧺 → 📦)
      this.moveLinenForRequest(r, "atLaundry", "atExecutor");
      save(db); return r;
    },

    // ---- Init: alege modul (server sau localStorage) ----
    async init(onRemoteUpdate) {
      onRemote = onRemoteUpdate || null;
      try {
        const me = await apiGET("/api/auth/me");    // dă eroare dacă nu există server (hosting static)
        const st = await apiGET("/api/state");
        MODE = "api";
        const s = st.state;
        s.session = me.user ? me.user.id : null;
        db = s;
        startPolling();
      } catch (e) {
        MODE = "local";
        db = load();
      }
      return MODE;
    },
    mode() { return MODE; },
    // reîmprospătează starea de pe server (folosit după confirmarea plății)
    async refresh() { if (MODE === "api") { try { await refreshState(); } catch (e) {} } return db; },
    // salvează IMEDIAT starea pe server și așteaptă (evită cursa înainte de plata Stripe)
    async flush() {
      if (MODE !== "api") return;
      clearTimeout(saveTimer);
      try { await apiPOST("/api/state", { state: stripState(db) }); pendingSave = false; } catch (e) {}
    },

    // Creează o sesiune de plată pe server și întoarce URL-ul găzduit de Stripe.
    // Dacă serverul nu are chei Stripe → { ok:false, error:"stripe_unconfigured" } (aplicația cade pe simulare).
    async payCheckout(reqId) {
      if (MODE !== "api") return { ok: false, error: "demo" };
      try { return await apiPOST("/api/pay/checkout", { reqId }); }
      catch (e) { return { ok: false, error: String(e.message || e) }; }

    // La întoarcerea de pe pagina Stripe (success_url) confirmăm plata după session_id.
    async verifyPayment(sessionId) {
      if (MODE !== "api") return { ok: false };
      try { return await apiGET("/api/pay/verify?session_id=" + encodeURIComponent(sessionId)); }
      catch (e) { return { ok: false, error: String(e.message || e) }; }
