<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sleep &amp; Go Cleaning — Curățenie regim hotelier</title>
<meta name="description" content="Curățenie regim hotelier la cerere: adaugă locația, programează și plătește în avans." />
</head>
<body>
<style>
:root {
  --bg: #0f1720;
  --bg-soft: #16212e;
  --card: #1b2836;
  --card-2: #22323f;
  --line: #2c3e4f;
  --text: #e8eef4;
  --muted: #93a6b5;
  --brand: #21c1a6;
  --brand-2: #1f7ae0;
  --brand-grad: linear-gradient(135deg, #21c1a6, #1f7ae0);
  --warn: #f0a93b;
  --danger: #ef5d6b;
  --ok: #34c77b;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #1c3247 0%, var(--bg) 55%);
  color: var(--text);
  min-height: 100vh;
}

/* ---------- Topbar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px;
  background: rgba(15,23,32,.75);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center;
  background: var(--brand-grad); border-radius: 12px;
}
.brand strong { display: block; font-size: 17px; line-height: 1; }
.brand small { color: var(--muted); letter-spacing: 3px; text-transform: uppercase; font-size: 10px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.user-name { color: var(--muted); font-size: 14px; }
.role-badge {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  padding: 5px 10px; border-radius: 20px; border: 1px solid var(--brand);
  color: var(--brand); font-weight: 600;
}

/* ---------- Layout ---------- */
main { max-width: 1080px; margin: 0 auto; padding: 26px 20px 80px; }
.page-head { margin-bottom: 22px; }
.page-head h1 { margin: 0 0 4px; font-size: 26px; }
.page-head p { margin: 0; color: var(--muted); }

.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 820px){ .grid.cols-2,.grid.cols-3,.grid.cols-4 { grid-template-columns: 1fr; } }

/* ---------- Cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
}
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .label { color: var(--muted); font-size: 13px; }
.stat .value { font-size: 28px; font-weight: 700; }
.stat .value.brand { color: var(--brand); }

/* ---------- Buttons ---------- */
.btn {
  border: none; cursor: pointer; font-size: 14px; font-weight: 600;
  padding: 11px 18px; border-radius: 10px; color: #fff;
  background: var(--brand-grad); transition: .15s transform, .15s opacity;
}
.btn:hover { opacity: .92; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn-soft { background: var(--card-2); color: var(--text); border: 1px solid var(--line); }
.btn-danger { background: linear-gradient(135deg,#ef5d6b,#c0392b); }
.btn-ok { background: linear-gradient(135deg,#34c77b,#159c58); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Forms ---------- */
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 13px; border-radius: 10px;
  background: var(--bg-soft); border: 1px solid var(--line); color: var(--text);
  font-size: 15px; font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--brand);
}
.field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px){ .row-2 { grid-template-columns: 1fr; } }
.checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.checkbox input { width: auto; }

/* ---------- Auth ---------- */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.auth-card { width: 100%; max-width: 420px; }
.auth-logo { text-align: center; margin-bottom: 22px; }
.auth-logo .brand-mark { margin: 0 auto 12px; width: 60px; height: 60px; font-size: 34px; }
.auth-logo h1 { margin: 0; font-size: 24px; }
.auth-logo p { margin: 6px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 8px; margin-bottom: 18px; background: var(--bg-soft); padding: 5px; border-radius: 12px; }
.tabs button { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); border-radius: 9px; cursor: pointer; font-weight: 600; }
.tabs button.active { background: var(--card-2); color: var(--text); }
.role-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.role-picker.role-picker-3 { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 520px){ .role-picker.role-picker-3 { grid-template-columns: 1fr; } }
.role-opt { border: 1px solid var(--line); border-radius: 11px; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; }
.role-opt.active { border-color: var(--brand); background: rgba(33,193,166,.1); }
.role-opt .ico { font-size: 22px; display: block; margin-bottom: 4px; }

/* ---------- Badges / statuses ---------- */
.badge { display: inline-block; font-size: 11px; padding: 4px 9px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.badge.nou { background: rgba(240,169,59,.15); color: var(--warn); }
.badge.platit { background: rgba(31,122,224,.15); color: #6db0ff; }
.badge.acceptat { background: rgba(33,193,166,.15); color: var(--brand); }
.badge.in_progres { background: rgba(146,120,255,.16); color: #b3a4ff; }
.badge.finalizat { background: rgba(52,199,123,.15); color: var(--ok); }
.badge.anulat { background: rgba(239,93,107,.15); color: var(--danger); }

/* ---------- Request list ---------- */
.req { display: flex; flex-direction: column; gap: 12px; }
.req-item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.req-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.req-top h3 { margin: 0 0 4px; font-size: 16px; }
.req-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 12px; }
.req-meta span { display: inline-flex; align-items: center; gap: 5px; }
.req-price { text-align: right; }
.req-price .big { font-size: 20px; font-weight: 700; color: var(--brand); }
.req-price small { color: var(--muted); display: block; }
.req-body { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.req-notes { color: var(--muted); font-size: 13px; margin-top: 8px; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty .ico { font-size: 44px; display: block; margin-bottom: 12px; opacity: .6; }

.section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 26px 0 12px; }

/* ---------- Price summary box ---------- */
.summary { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.summary .line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.summary .line.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-size: 18px; font-weight: 700; }
.summary .line.total .amt { color: var(--brand); }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(6,10,14,.7); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 440px; padding: 24px; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 6px; font-size: 20px; }
.modal .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

/* ---------- Toast ---------- */
.toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 80; }
.toast { background: var(--card-2); border: 1px solid var(--line); border-left: 4px solid var(--brand); padding: 13px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; min-width: 240px; animation: slidein .25s ease; }
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--danger); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Nav tabs (dashboard) ---------- */
.navtabs { display: flex; gap: 6px; margin-bottom: 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.navtabs button { background: none; border: none; color: var(--muted); padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
.navtabs button.active { color: var(--brand); border-bottom-color: var(--brand); }

.pill { font-size: 12px; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line); padding: 3px 9px; border-radius: 20px; }
a.pill.contact { text-decoration: none; color: var(--brand); border-color: var(--brand); font-weight: 700; }
a.pill.contact:hover { background: var(--brand); color: #fff; }

/* logistică lenjerie: adresă de ridicare + Waze + contact */
.linen-logistics { margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg-soft); display: flex; flex-direction: column; gap: 10px; }
.linen-logistics .ll-row { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: center; font-size: 13.5px; }
.linen-logistics .ll-k { color: var(--muted); font-weight: 600; }
.linen-logistics .ll-v { color: var(--text); font-weight: 600; text-align: right; }
.waze-link { display: inline-block; margin-left: 8px; padding: 3px 10px; border-radius: 8px; background: #33ccff; color: #05263a; font-weight: 800; text-decoration: none; font-size: 12.5px; white-space: nowrap; }
.waze-link:hover { background: #12bdf0; }
.maps-link { display: inline-block; padding: 2px 9px; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--brand); color: var(--brand); font-weight: 700; text-decoration: none; font-size: 12.5px; white-space: nowrap; }
.maps-link:hover { background: var(--brand); color: #fff; }

/* pontaj / timesheet */
.timesheet { display: flex; flex-direction: column; font-size: 13.5px; overflow-x: auto; }
.timesheet .ts-row { display: grid; grid-template-columns: 92px 1fr 66px 76px 78px; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); align-items: center; min-width: 460px; }
.timesheet .ts-row.ts-6 { grid-template-columns: 88px 130px 1fr 62px 74px 74px; min-width: 620px; }
.timesheet .ts-head { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .03em; }
.timesheet .ts-addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.timesheet .ts-dur { font-weight: 800; color: var(--brand); }

/* modal alegere adresă de ridicare */
.pk-opts { display: flex; flex-direction: column; gap: 8px; }
.pk-opt { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.pk-opt input { margin-top: 3px; }
.pk-opt span { display: flex; flex-direction: column; }
.pk-opt small { color: var(--muted); font-size: 12px; margin-top: 2px; }
.pk-opt:has(input:checked) { border-color: var(--brand); background: var(--bg-soft); }

/* ---------- Stripe-style checkout ---------- */
.stripe-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.stripe-logo { font-weight: 800; font-size: 22px; color: #635bff; letter-spacing: -1px; font-family: system-ui, sans-serif; }
.stripe-test { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #b26b00; background: #ffe7ba; padding: 3px 8px; border-radius: 5px; }
.stripe-amount { display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
.stripe-amt-label { font-size: 13px; color: var(--muted); }
.stripe-amt-value { font-size: 30px; font-weight: 800; }
.stripe-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg-soft); }
.stripe-card input { width: 100%; border: none; background: transparent; color: var(--text); padding: 13px; font-size: 15px; font-family: inherit; }
.stripe-card input:focus { outline: none; }
.stripe-cardnum { border-bottom: 1px solid var(--line) !important; }
.stripe-card-row { display: flex; }
.stripe-card-row input:first-child { border-right: 1px solid var(--line); }
.stripe-pay { background: #635bff; margin-top: 4px; }
.stripe-pay:hover { background: #524dcc; opacity: 1; }
.stripe-foot { font-size: 11px; color: var(--muted); margin: 14px 0 0; line-height: 1.5; }

/* ---------- Payout breakdown ---------- */
.payout { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 13px; }
.payout .prow { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); }
.payout .prow.net { color: var(--brand); font-weight: 700; font-size: 15px; border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 8px; }
.payout .prow.comm { color: var(--warn); }
.badge.payout-pending { background: rgba(240,169,59,.15); color: var(--warn); }
.badge.payout-released { background: rgba(52,199,123,.15); color: var(--ok); }

/* ---------- Locație status ---------- */
.badge.loc-pending { background: rgba(240,169,59,.15); color: var(--warn); }
.badge.loc-approved { background: rgba(52,199,123,.15); color: var(--ok); }
.badge.loc-rejected { background: rgba(239,93,107,.15); color: var(--danger); }

/* ---------- Reducere / interval preț ---------- */
.summary .line.disc { color: var(--ok); }
.pricing-legend { margin-top: 14px; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.pl-row { display: flex; align-items: center; gap: 8px; }
.pl-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.pl-dot.peak { background: var(--warn); }
.pl-dot.off { background: var(--ok); }

/* ---------- Lenjerie ---------- */
.linen-compo { margin-top: 8px; font-size: 12px; color: var(--muted); background: var(--bg-soft); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
.payout .prow.laundry { align-items: flex-start; gap: 10px; }
.payout .prow.laundry .checkbox { font-size: 13px; color: var(--text); cursor: pointer; }
.payout .prow.laundry input { margin-top: 1px; }
.divider { height: 1px; background: var(--line); margin: 20px 0; }
.link { color: var(--brand); cursor: pointer; text-decoration: underline; }

/* ---------- Avatar ---------- */
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden;
  background: var(--card-2); border: 1px solid var(--line); flex-shrink: 0; vertical-align: middle; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.ph { color: var(--brand); font-weight: 700; background: linear-gradient(135deg, rgba(33,193,166,.25), rgba(31,122,224,.25)); }
#topAvatar .avatar { cursor: pointer; }

/* ---------- Stele / rating ---------- */
.rating { display: inline-flex; align-items: center; gap: 1px; vertical-align: middle; }
.rating .star { color: #3a4a5a; font-size: 15px; line-height: 1; }
.rating .star.on { color: var(--warn); }
.rating .rcount { color: var(--muted); font-size: 12px; margin-left: 5px; }
.rinline { color: var(--warn); font-weight: 700; font-size: 12px; }

/* ---------- Widget recenzie ---------- */
.review-box { margin-top: 12px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.review-box.done { color: var(--muted); font-size: 13.5px; }
.review-box .rv-title { font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
.star-pick { display: flex; gap: 4px; margin-bottom: 10px; }
.star-pick .star.pick { font-size: 26px; color: #3a4a5a; cursor: pointer; transition: color .1s, transform .1s; }
.star-pick .star.pick:hover { transform: scale(1.15); }
.star-pick .star.pick.on { color: var(--warn); }
.review-box .rv-comment { width: 100%; padding: 9px 11px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-size: 14px; margin-bottom: 10px; font-family: inherit; }

/* ---------- Executanți înscriși (solicitantul alege) ---------- */
.applicants { margin-top: 12px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.applicants .ap-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.ap-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.ap-row:first-of-type { border-top: none; }
.ap-who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.ap-who small { color: var(--muted); }

/* ---------- Consumabile (selector în formular) ---------- */
.consumables-pick { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg-soft); }
.cp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
.cp-row:first-child { border-top: none; }
.cp-info { display: flex; flex-direction: column; }
.cp-info small { color: var(--muted); font-size: 12px; }
.cp-qty { width: 70px; padding: 7px 9px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font-size: 14px; text-align: center; }

/* ---------- Listă de cumpărături (card) ---------- */
.shopping { margin-top: 12px; background: rgba(146,120,255,.10); border: 1px solid rgba(146,120,255,.30); border-left: 4px solid #9278ff; border-radius: 10px; padding: 12px 14px; }
.shopping .sh-title { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #b3a4ff; font-weight: 700; margin-bottom: 10px; }
.shopping .sh-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
.shopping .sh-row small { color: var(--muted); }
.shopping .sh-total { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px; font-weight: 700; color: var(--text); }

/* ---------- Stoc executanți ---------- */
.stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 4px; }
.stock-cell { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stock-cell .sc-name { font-size: 13.5px; }
.stock-cell .sc-qty { font-family: "Poppins", "Segoe UI", sans-serif; font-weight: 800; font-size: 22px; color: var(--brand); }
.stock-cell.low { border-color: rgba(239,93,107,.5); background: rgba(239,93,107,.08); }
.stock-cell.low .sc-qty { color: var(--danger); }
.supply-form .field { padding: 0; }
.supply-form select, .supply-form input { padding: 10px 11px; border-radius: 9px; background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); font-size: 14px; font-family: inherit; }
.stock-cell .sc-name small { color: var(--muted); }

/* ---------- Alerte stoc ---------- */
.tab-alert { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: middle; }
.alerts-card { background: rgba(239,93,107,.10); border: 1px solid rgba(239,93,107,.4); border-left: 4px solid var(--danger); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
.alerts-card .al-title { font-weight: 700; color: var(--danger); margin-bottom: 12px; font-size: 15px; }
.al-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(239,93,107,.2); font-size: 14px; }
.al-row:first-of-type { border-top: none; }
.al-row .al-qty { color: var(--danger); font-weight: 700; }

/* ---------- Circuit lenjerie (admin) ---------- */
.linen-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
@media (max-width: 720px){ .linen-grid { grid-template-columns: repeat(2, 1fr); } }
.linen-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.linen-grid input { padding: 10px 11px; border-radius: 9px; background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); font-size: 18px; font-weight: 700; text-align: center; font-family: "Poppins", "Segoe UI", sans-serif; }

/* ---------- Avertizare zonă fără executanți ---------- */
.zone-warn { margin-top: 8px; background: rgba(240,169,59,.12); border: 1px solid rgba(240,169,59,.4); border-radius: 9px; padding: 10px 12px; font-size: 13px; color: #f0c987; }

/* ---------- Notificare „locația e gata pentru oaspeți" ---------- */

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) { const s = seed(); localStorage.setItem(KEY, JSON.stringify(s)); return s; }
      return JSON.parse(raw);
    } catch (e) { const s = seed(); return s; }
  }

  let db = load();

  /* --- Mod de stocare: "api" (server Node/Railway) sau "local" (localStorage/demo) --- */
  let MODE = "local";
  let saveTimer = null, pendingSave = false, pollTimer = null;
  let onRemote = null;   // callback de re-randare la schimbări venite de la server

  function stripState(d) { const { session, ...rest } = d; return rest; }

  async function apiGET(p) {
    const r = await fetch(p, { credentials: "same-origin" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function apiPOST(p, body) {
    const r = await fetch(p, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return r.json();
  }
  function scheduleServerSave() {
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await apiPOST("/api/state", { state: stripState(db) }); }
      catch (e) {}
      pendingSave = false;
    }, 350);
  }

  // save(db) — apelat de toate mutațiile. În modul API scrie pe server; altfel în localStorage.
  function save(d) {
    if (MODE === "api") scheduleServerSave();
    else localStorage.setItem(KEY, JSON.stringify(d));
  }

  async function refreshState() {
    const st = await apiGET("/api/state");
    const keep = db.session;
    db = st.state; db.session = keep;
    return db;
  }
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      if (pendingSave) return;             // nu suprascrie ce tocmai am modificat local
      try {
        const st = await apiGET("/api/state");
        if (JSON.stringify(st.state) !== JSON.stringify(stripState(db))) {
          const keep = db.session;
          db = st.state; db.session = keep;
          if (onRemote) onRemote();
        }
      } catch (e) {}
    }, 4000);
  }

  const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9);

  const round2 = (n) => Math.round(n * 100) / 100;

  /* --- Preț dinamic pe interval orar ---
     Preț întreg în vârf (10:00–15:00). Reducere în afara vârfului:
     rezervări care încep înainte de 10:00 sau de la 15:00 → −discountPct%. */
  const parseHour = (t) => { const h = parseInt(String(t || "").split(":")[0], 10); return isNaN(h) ? null : h; };
  function discountPctFor(startTime) {
    const s = CONFIG.schedule;
    const h = parseHour(startTime);
    if (h == null) return 0;
    return (h < s.peakStart || h >= s.peakEnd) ? s.discountPct : 0;
  }
  function isPeak(startTime) {
    const s = CONFIG.schedule, h = parseHour(startTime);
    return h != null && h >= s.peakStart && h < s.peakEnd;
  }
  // +10% dacă data cade în weekend (sâmbătă/duminică) sau sărbătoare legală
  function surchargePctFor(dateStr) {
    if (!dateStr) return 0;
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return 0;
    const day = d.getDay();                 // 0=duminică, 6=sâmbătă
    const md = String(dateStr).slice(5);    // „LL-ZZ"
    if (day === 0 || day === 6 || CONFIG.legalHolidays.includes(md)) return CONFIG.weekendHolidaySurchargePct;
    return 0;
  }
  function isWeekendOrHoliday(dateStr) { return surchargePctFor(dateStr) > 0; }

  function commissionPct() { return (db.settings && db.settings.commissionPct != null) ? db.settings.commissionPct : CONFIG.commissionPct; }
  function ronPerEur() { return (db.settings && db.settings.ronPerEur) ? db.settings.ronPerEur : CONFIG.ronPerEur; }
  const ronToEur = (ron) => round2(ron / ronPerEur());

  /* --- Calcule de preț ---
     Curățenie în €. Reducerea de interval orar se aplică DOAR curățeniei
     (lenjeria e tarif fix de spălat/călcat, în lei, convertit în €). */
  // valoarea consumabilelor dintr-o solicitare (în lei), pe baza catalogului curent
  function consumablesRonOf(req) {
    const list = (req.consumables || []);
    return list.reduce((s, c) => {
      const p = (db.products || []).find(x => x.id === c.productId);
      return s + (p ? p.priceRon * (Number(c.qty) || 0) : 0);
    }, 0);
  }

  function priceOf(req) {
    const cleaning = (Number(req.sqm) || 0) * CONFIG.pricePerSqm;
    const discPct = discountPctFor(req.startTime);
    const discount = round2(cleaning * discPct / 100);
    const afterDiscount = round2(cleaning - discount);
    // suprataxă weekend / sărbătoare legală (+10%) aplicată după reducerea de interval
    const surPct = surchargePctFor(req.date);
    const surcharge = round2(afterDiscount * surPct / 100);
    const cleaningNet = round2(afterDiscount + surcharge);

    const linenSets = req.linens ? (Number(req.linenSets) || 0) : 0;
    const linenRon = linenSets * CONFIG.linenSetPriceRon;   // 45 lei / set
    const linenEur = ronToEur(linenRon);

    // consumabile: adminul pune prețul de achiziție; aplicația adaugă adaos comercial
    const consumablesCostRon = consumablesRonOf(req);                                   // achiziție
    const consumablesMarkupRon = round2(consumablesCostRon * CONFIG.consumableMarkupPct / 100); // adaos 10%
    const consumablesRon = round2(consumablesCostRon + consumablesMarkupRon);           // ce plătește clientul
    const consumablesEur = ronToEur(consumablesRon);

    const serviceTotal = round2(cleaningNet + linenEur);        // servicii (se comisionează)
    const total = round2(serviceTotal + consumablesEur);        // + consumabile (achiziție + adaos)
    return {
      cleaning, discPct, discount, surPct, surcharge, cleaningNet,
      linenIncluded: !!req.linens, linenSets, linenRon, linenEur,
      consumablesCostRon, consumablesMarkupRon, consumablesRon, consumablesEur, markupPct: CONFIG.consumableMarkupPct,
      serviceTotal, total,
    };
  }

  /* Împărțirea banilor:
     - platforma reține comisionul din TOT ce plătește clientul;
     - partea de curățenie (după comision) → Agentul Cleaning de curățenie;
     - serviciul de lenjerie (45 lei/set, după comision) → Agentul Cleaning care preia
       serviciul de lenjerie (poate fi altul). Dacă nimeni nu-l preia, rămâne la platformă. */
  function breakdown(req) {
    const p = priceOf(req);
    const pct = commissionPct();

    const cleaningPayout = round2(p.cleaningNet * (1 - pct / 100));
    const linenTaken = !!(req.linens && req.linenExecutorId);
    const linenPayout = round2(p.linenEur * (1 - pct / 100));   // valoarea serviciului de lenjerie

    // consumabile: produsele preluate de Serviciu lenjerie și distribuite Agenților Cleaning.
    // Adaosul se împarte Agent Cleaning 50% / serviciu lenjerie 30% / admin 20%; costul → serviciul de lenjerie.
    const consCostEur = ronToEur(p.consumablesCostRon);
    const consMarkupEur = ronToEur(p.consumablesMarkupRon);
    const csp = CONFIG.consumableSplit;
    const laundryUser = req.linenExecutorId ? db.users.find(u => u.id === req.linenExecutorId) : null;
    const consLaundryHandles = !!(laundryUser && laundryUser.role === "spalatorie" && p.consumablesCostRon > 0);
    const consExecutantPayout = round2(consMarkupEur * csp.executant / 100);   // Agent Cleaning curățenie: 50% adaos
    const consLaundryMarkup = round2(consMarkupEur * csp.laundry / 100);       // serviciu lenjerie: 30% adaos
    const consAdminMarkup = round2(consMarkupEur * csp.admin / 100);           // admin: 20% adaos
    // serviciul de lenjerie primește achiziția înapoi + 30% din adaos (dacă el preia consumabilele)
    const consLaundryPayout = consLaundryHandles ? round2(consCostEur + consLaundryMarkup) : 0;
    // dacă niciun serviciu lenjerie nu preia consumabilele, achiziția + 30% adaos rămân la platformă
    const consAdminTotal = round2(consAdminMarkup + (consLaundryHandles ? 0 : consCostEur + consLaundryMarkup));

    // comision total al platformei = comision servicii + partea admin din consumabile
    const commission = round2(p.serviceTotal * pct / 100 + consAdminTotal);

    // plata Agentului Cleaning de curățenie = curățenie + 50% adaos consumabile (+ lenjerie dacă a preluat-o el)
    const payout = round2(cleaningPayout + consExecutantPayout + (linenTaken ? linenPayout : 0));

    return {
      ...p, pct, commission, cleaningPayout, linenPayout, linenTaken,
      consCostEur, consMarkupEur, consExecutantPayout, consLaundryPayout, consLaundryHandles, consAdminTotal,
      consumablesPayout: consExecutantPayout,   // (compat) partea Agentului Cleaning de curățenie
      payout,
    };
  }

  /* validează un interval orar față de program + minim ore */
  function validateSlot(startTime, endTime) {
    const s = CONFIG.schedule;
    const sh = parseHour(startTime), eh = parseHour(endTime);
    const sm = parseInt(String(startTime || "").split(":")[1] || "0", 10);
    const em = parseInt(String(endTime || "").split(":")[1] || "0", 10);
    if (sh == null || eh == null) return { ok: false, error: "Alege ora de început și de sfârșit." };
    const start = sh + sm / 60, end = eh + em / 60;
    if (start < s.open) return { ok: false, error: `Începutul nu poate fi înainte de ${s.open}:00.` };
    if (end > s.close) return { ok: false, error: `Sfârșitul nu poate depăși ${s.close}:00.` };
    if (end - start < s.minHours) return { ok: false, error: `Intervalul minim de lucru este ${s.minHours} ore.` };
    return { ok: true };
  }

  const Store = {
    CONFIG, STATUS, STATUS_LABEL, LOC_STATUS_LABEL,
    priceOf, breakdown,
    discountPctFor, isPeak, validateSlot, surchargePctFor, isWeekendOrHoliday,
    commissionPct, ronPerEur, ronToEur,
    setCommissionPct(pct) {
      if (!db.settings) db.settings = {};
      db.settings.commissionPct = Math.max(0, Math.min(100, Number(pct) || 0));
      save(db); return db.settings.commissionPct;
    },
    setRonPerEur(rate) {
      if (!db.settings) db.settings = {};
      const r = Number(rate);
      db.settings.ronPerEur = (r > 0) ? r : CONFIG.ronPerEur;
      save(db); return db.settings.ronPerEur;
    },
    // lenjeria e preluată de: Agentul Cleaning de curățenie (dacă vrea) SAU un „Serviciu lenjerie"
    // (rol spalatorie) atunci când Agentul Cleaning de curățenie a refuzat.
    takeLinenService(reqId, executorId) {
      const r = this.requestById(reqId);
      if (!r || !r.linens || r.linenExecutorId) return { ok: false };
      const usr = this.userById(executorId);
      if (r.executorId === executorId) {
        // Agentul Cleaning de curățenie o preia direct (inclusiv după ce a marcat curățenia gata)
        if (![STATUS.ACCEPTAT, STATUS.IN_PROGRES, STATUS.FINALIZAT].includes(r.status)) return { ok: false };
      } else if (usr && usr.role === "spalatorie") {
        // serviciul de lenjerie o preia doar dacă Agentul Cleaning de curățenie a refuzat, în zona lui
        if (!r.linenDeclined || r.area !== usr.area) return { ok: false };
        if (r.status === STATUS.ANULAT || r.status === STATUS.NOU) return { ok: false };
      } else {
        return { ok: false };
      }
      r.linenExecutorId = executorId; save(db); return { ok: true, r };
    },
    // solicitări cu lenjerie refuzată de Agent Cleaning, disponibile pentru „Serviciu lenjerie" din zonă
    availableLinenForLaundry(user) {
      return this.requests().filter(r =>
        r.linens && !r.linenExecutorId && r.linenDeclined && r.area === user.area &&
        r.status !== STATUS.ANULAT && r.status !== STATUS.NOU);
    },
    laundryJobsOf(userId) { return this.requests().filter(r => r.linenExecutorId === userId); },
    // Agentul Cleaning de curățenie refuză lenjeria (o preia spălătoria) și indică de unde se ridică
    declineLinenService(reqId, executorId, pickup) {
      const r = this.requestById(reqId);
      if (!r || r.executorId !== executorId || r.linenExecutorId) return { ok: false };
      if (!pickup || !pickup.address) return { ok: false, error: "Indică adresa de la care se ridică lenjeria." };
      r.linenDeclined = true;
      r.linenPickup = { type: pickup.type || "other", address: pickup.address };
      save(db); return { ok: true, r };
    },
    // Agentul Cleaning de lenjerie marchează serviciul gata → plata lenjeriei se eliberează
    finishLinenService(reqId) {
      const r = this.requestById(reqId); if (!r) return;
      r.linenDone = true; r.linenPayoutStatus = "released"; save(db); return r;
    },

    // ---- Init: alege modul (server sau localStorage) ----
    async init(onRemoteUpdate) {
      onRemote = onRemoteUpdate || null;
      try {
        const me = await apiGET("/api/auth/me");    // dă eroare dacă nu există server (hosting static)
        const st = await apiGET("/api/state");
        MODE = "api";
        const s = st.state;
        s.session = me.user ? me.user.id : null;
        db = s;
        startPolling();
      } catch (e) {
        MODE = "local";
        db = load();
      }
      return MODE;
    },
    mode() { return MODE; },

    // ---- Sesiune / auth ----
    currentUser() { return db.users.find(u => u.id === db.session) || null; },
    async login(email, password) {
      if (MODE === "api") {
        const r = await apiPOST("/api/auth/login", { email, password });
        if (!r.ok) return { ok: false, error: r.error || "Autentificare eșuată." };
        await refreshState();
        db.session = r.user.id;
        return { ok: true, user: r.user };
      }
      const u = db.users.find(x => x.email.toLowerCase() === email.toLowerCase() && x.password === password);
      if (!u) return { ok: false, error: "Email sau parolă incorecte." };
      db.session = u.id; save(db); return { ok: true, user: u };
    },
    async register(data) {
      const { name, email, password, role, area, business, phone, address } = data;
      if (MODE === "api") {
        const r = await apiPOST("/api/auth/register", data);
        if (!r.ok) return { ok: false, error: r.error || "Înregistrare eșuată." };
        await refreshState();
        db.session = r.user.id;
        return { ok: true, user: r.user };
      }
      if (db.users.some(u => u.email.toLowerCase() === email.toLowerCase()))
        return { ok: false, error: "Există deja un cont cu acest email." };
      const needsBusiness = role === "executant" || role === "spalatorie";
      if (needsBusiness) {
        if (!business || !CONFIG.businessTypes.includes(business.type))
          return { ok: false, error: "Te poți înregistra doar ca PFA, PFI sau SRL." };
        if (!business.name || !business.cui || !business.iban)
          return { ok: false, error: "Completează denumirea firmei, CUI/CIF și IBAN-ul." };
        if (!phone) return { ok: false, error: "Completează un număr de telefon de contact." };
      }
      const u = {
        id: uid("u"), name, email, password, role,
        area: needsBusiness ? area : null,
        business: needsBusiness ? business : null,
        phone: phone || "",
        address: address || "",   // adresă/sediu (Agent Cleaning) — folosită la ridicarea lenjeriei
      };
      db.users.push(u); db.session = u.id; save(db); return { ok: true, user: u };
    },
    async logout() {
      if (MODE === "api") { try { await apiPOST("/api/auth/logout", {}); } catch (e) {} }
      db.session = null;
      if (MODE !== "api") save(db);
    },
    updateUser(id, patch) {
      const u = db.users.find(x => x.id === id); if (!u) return;
      Object.assign(u, patch); save(db); return u;
    },

    // ---- Utilizatori ----
    users() { return db.users.slice(); },
    userById(id) { return db.users.find(u => u.id === id) || null; },
    // există cel puțin un Agent Cleaning (curățenie) activ în zonă?
    hasActiveExecutorInArea(area) { return db.users.some(u => u.role === "executant" && u.area === area); },
    setAvatar(id, dataUrl) {
      const u = db.users.find(x => x.id === id); if (!u) return;
      u.avatar = dataUrl; save(db); return u;
    },

    // ---- Circuit lenjerie (per proprietar): locație ↔ spălătorie ↔ Agent Cleaning ----
    linenCircuitOf(ownerId) {
      const u = this.userById(ownerId);
      const c = (u && u.linenCircuit) || {};
      return { received: Number(c.received || 0), atLocation: Number(c.atLocation || 0), atLaundry: Number(c.atLaundry || 0), atExecutor: Number(c.atExecutor || 0) };
    },
    setLinenCircuit(ownerId, patch) {
      const u = this.userById(ownerId); if (!u) return { ok: false };
      const c = this.linenCircuitOf(ownerId);
      const next = { ...c, ...patch };
      ["received", "atLocation", "atLaundry", "atExecutor"].forEach(k => next[k] = Math.max(0, Number(next[k]) || 0));
      u.linenCircuit = next; save(db); return { ok: true, circuit: next };
    },
    solicitants() { return db.users.filter(u => u.role === "solicitant"); },

    // ---- Închiriere lenjerii (înregistrări / lead-uri de pe landing) ----
    rentalLeads() { return (db.rentalLeads || []).slice().sort((a, b) => b.createdAt - a.createdAt); },
    addRentalLead({ name, phone, email, locations, note }) {
      if (!name || !phone) return { ok: false, error: "Completează numele și telefonul." };
      if (!db.rentalLeads) db.rentalLeads = [];
      const lead = { id: uid("lead"), name, phone, email: email || "", locations: Number(locations) || 0, note: note || "", createdAt: Date.now() };
      db.rentalLeads.push(lead); save(db); return { ok: true, lead };
    },

    // ---- Consumabile (catalog gestionat de admin) ----
    products() { return (db.products || []).slice(); },
    activeProducts() { return this.products().filter(p => p.active); },
    productById(id) { return (db.products || []).find(p => p.id === id) || null; },
    addProduct({ name, unit, priceRon, lowAt }) {
      if (!name || !(Number(priceRon) >= 0)) return { ok: false, error: "Completează denumirea și prețul." };
      if (!db.products) db.products = [];
      const p = { id: uid("p"), name, unit: unit || "buc", priceRon: Number(priceRon), lowAt: Number(lowAt) >= 0 ? Number(lowAt) : CONFIG.lowStockDefault, active: true };
      db.products.push(p); save(db); return { ok: true, p };
    },
    lowAtOf(product) { return (product && Number(product.lowAt) >= 0) ? Number(product.lowAt) : CONFIG.lowStockDefault; },
    updateProduct(id, patch) { const p = this.productById(id); if (!p) return; Object.assign(p, patch); save(db); return p; },
    setProductActive(id, active) { const p = this.productById(id); if (!p) return; p.active = !!active; save(db); return p; },
    // lista de cumpărături dintr-o solicitare (produs + cantitate + preț)
    consumablesList(req) {
      return (req.consumables || []).map(c => {
        const p = this.productById(c.productId);
        return p ? { name: p.name, unit: p.unit, qty: c.qty, priceRon: p.priceRon, lineRon: p.priceRon * c.qty } : null;
      }).filter(Boolean);
    },

    // ---- Stoc Agenți Cleaning (bază comună admin ↔ Agent Cleaning) ----
    executors() { return db.users.filter(u => u.role === "executant"); },
    // stocul unui Agent Cleaning, pentru toate produsele active
    stockList(executorId) {
      const u = this.userById(executorId); const stock = (u && u.stock) || {};
      return this.activeProducts().map(p => {
        const qty = Number(stock[p.id] || 0), low = this.lowAtOf(p);
        return { productId: p.id, name: p.name, unit: p.unit, qty, low, isLow: qty <= low };
      });
    },
    stockQty(executorId, productId) {
      const u = this.userById(executorId); return Number((u && u.stock && u.stock[productId]) || 0);
    },
    // valoarea stocului curent (lei) — plătită de Agent Cleaning (el cumpără produsele)
    stockValueRon(executorId) {
      return this.stockList(executorId).reduce((s, x) => {
        const p = this.productById(x.productId); return s + (p ? p.priceRon * x.qty : 0);
      }, 0);
    },
    // alerte de stoc scăzut către admin: Agent Cleaning × produs unde stocul ≤ pragul produsului
    stockAlerts() {
      const alerts = [];
      this.executors().forEach(ex => {
        this.activeProducts().forEach(p => {
          const qty = this.stockQty(ex.id, p.id);
          const low = this.lowAtOf(p);
          if (qty <= low) alerts.push({ executorId: ex.id, executorName: ex.name, productId: p.id, productName: p.name, qty, low });
        });
      });
      return alerts;
    },
    // adminul reaprovizionează stocul unui Agent Cleaning (+cantitate)
    supplyStock(executorId, productId, qty) {
      const u = this.userById(executorId); if (!u) return { ok: false };
      if (!u.stock) u.stock = {};
      u.stock[productId] = Number(u.stock[productId] || 0) + Number(qty || 0);
      u.stockSuppliedAt = Date.now();
      save(db); return { ok: true, qty: u.stock[productId] };
    },
    // scade din stoc consumabilele folosite la o lucrare
    deductStock(executorId, consumables) {
      const u = this.userById(executorId); if (!u || !consumables) return;
      if (!u.stock) u.stock = {};
      consumables.forEach(c => {
        u.stock[c.productId] = Math.max(0, Number(u.stock[c.productId] || 0) - Number(c.qty || 0));
      });
      save(db);
    },

    // ---- Recenzii (solicitant → Agent Cleaning, 1–5 stele) ----
    reviews() { return (db.reviews || []).slice(); },
    reviewsForExecutor(execId) { return this.reviews().filter(r => r.toId === execId).sort((a, b) => b.createdAt - a.createdAt); },
    ratingOf(execId) {
      const rs = this.reviews().filter(r => r.toId === execId);
      if (!rs.length) return { avg: 0, count: 0 };
      const sum = rs.reduce((s, r) => s + Number(r.stars || 0), 0);
      return { avg: Math.round((sum / rs.length) * 10) / 10, count: rs.length };
    },
    reviewByRequest(requestId, fromId) {
      return this.reviews().find(r => r.requestId === requestId && r.fromId === fromId) || null;
    },
    // câte solicitări (necanulate) are un solicitant într-o lună „AAAA-LL"
    requestsInMonth(requesterId, ym) {
      return db.requests.filter(r => r.requesterId === requesterId && r.status !== STATUS.ANULAT && String(r.date || "").slice(0, 7) === ym).length;
    },
    // eligibilitate recenzie: ≥ reviewMinPerMonth solicitări în luna lucrării
    canReview(requesterId, req) {
      const ym = String((req && req.date) || "").slice(0, 7);
      const count = this.requestsInMonth(requesterId, ym);
      const need = CONFIG.reviewMinPerMonth;
      return { ok: count >= need, count, need, ym };
    },
    addReview({ requestId, fromId, toId, stars, comment }) {
      if (!toId || !stars) return { ok: false, error: "Alege numărul de stele." };
      if (requestId && this.reviewByRequest(requestId, fromId)) return { ok: false, error: "Ai evaluat deja această lucrare." };
      const req = requestId ? this.requestById(requestId) : null;
      if (req) {
        const el = this.canReview(fromId, req);
        if (!el.ok) return { ok: false, error: `Poți lăsa recenzii doar cu minim ${el.need} solicitări în luna respectivă (ai ${el.count}).` };
      }
      if (!db.reviews) db.reviews = [];
      const rev = { id: uid("rev"), requestId: requestId || null, fromId, toId, stars: Number(stars), comment: comment || "", createdAt: Date.now() };
      db.reviews.push(rev); save(db); return { ok: true, rev };
    },

    // ---- Solicitări ----
    requests() { return db.requests.slice().sort((a, b) => b.createdAt - a.createdAt); },
    requestById(id) { return db.requests.find(r => r.id === id) || null; },

    createRequest(data) {
      // solicitările se pot trimite doar până la ora 20:00
      if (new Date().getHours() >= CONFIG.bookingCutoffHour)
        return { ok: false, error: `Solicitările se pot trimite doar până la ora ${CONFIG.bookingCutoffHour}:00. Te așteptăm mâine!` };
      // suprafața și locația provin dintr-o locație APROBATĂ (cu document validat de admin)
      const loc = this.locationById(data.locationId);
      if (!loc || loc.status !== "approved") return { ok: false, error: "Alege o locație aprobată." };
      const slot = validateSlot(data.startTime, data.endTime);
      if (!slot.ok) return { ok: false, error: slot.error };
      const req = {
        id: uid("r"),
        requesterId: db.session,
        executorId: null,
        locationId: loc.id,
        area: loc.area,
        address: loc.address,
        mapsUrl: loc.mapsUrl || "",   // snapshot link Google Maps
        sqm: Number(loc.sqm),      // exact din documentul aprobat
        linens: !!data.linens,     // cu lenjerie (tarif) / fără (lenjeria proprie a clientului)
        linenSets: Number(data.linenSets || 0),
        // serviciul de lenjerie poate fi preluat separat de un Agent Cleaning
        linenExecutorId: null, linenDone: false, linenPayoutStatus: "pending",
        date: data.date,
        startTime: data.startTime,
        endTime: data.endTime,
        notes: data.notes || "",
        status: STATUS.NOU,
        createdAt: Date.now(),
        paidAt: null,
        payoutStatus: "pending",   // pending → released (după finalizarea curățeniei)
        releasedAt: null,
        readyNotified: false, readyAt: null,  // Agentul Cleaning a anunțat că locația e gata pentru oaspeți
        workStartedAt: null, workFinishedAt: null,  // pontaj: început/terminat efectiv de Agent Cleaning
        applicants: [],   // Agenți Cleaning înscriși la curățenie; solicitantul alege unul
        // consumabile cerute de solicitant: [{productId, qty}] — Agentul Cleaning le cumpără
        consumables: (data.consumables || []).filter(c => Number(c.qty) > 0).map(c => ({ productId: c.productId, qty: Number(c.qty) })),
      };
      db.requests.push(req); save(db); return { ok: true, req };
    },

    payRequest(id) {
      const r = this.requestById(id); if (!r) return;
      r.status = STATUS.PLATIT; r.paidAt = Date.now(); save(db); return r;
    },

    // Agentul Cleaning se ÎNSCRIE la o solicitare (nu o preia direct — solicitantul alege)
    applyToRequest(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.status !== STATUS.PLATIT || r.executorId) return { ok: false };
      if (r.area !== (this.userById(executorId) || {}).area) return { ok: false };
      if (!r.applicants) r.applicants = [];
      if (!r.applicants.includes(executorId)) r.applicants.push(executorId);
      save(db); return { ok: true, r };
    },
    withdrawApplication(id, executorId) {
      const r = this.requestById(id); if (!r || !r.applicants) return;
      r.applicants = r.applicants.filter(x => x !== executorId); save(db); return r;
    },
    hasApplied(id, executorId) {
      const r = this.requestById(id); return !!(r && r.applicants && r.applicants.includes(executorId));
    },
    applicantsOf(id) {
      const r = this.requestById(id); return (r && r.applicants ? r.applicants : []).map(eid => this.userById(eid)).filter(Boolean);
    },
    // solicitantul ALEGE un Agent Cleaning dintre cei înscriși
    chooseExecutor(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.status !== STATUS.PLATIT || r.executorId) return { ok: false };
      if (!r.applicants || !r.applicants.includes(executorId)) return { ok: false, error: "Agentul Cleaning nu mai este disponibil." };
      r.executorId = executorId; r.status = STATUS.ACCEPTAT; save(db); return { ok: true, r };
    },
    setStatus(id, status) {
      const r = this.requestById(id); if (!r) return;
      r.status = status;
      // la finalizare, plata Agentului Cleaning este eliberată din suma încasată în avans
      if (status === STATUS.FINALIZAT && r.payoutStatus !== "released") {
        r.payoutStatus = "released"; r.releasedAt = Date.now();
      }
      save(db); return r;
    },
    cancelRequest(id) { return this.setStatus(id, STATUS.ANULAT); },
    // Agentul Cleaning PORNEȘTE lucrul → status în progres + pontaj (ora de început)
    startWork(id, executorId) {
      const r = this.requestById(id);
      if (!r || r.executorId !== executorId) return { ok: false };
      r.status = STATUS.IN_PROGRES;
      if (!r.workStartedAt) r.workStartedAt = Date.now();
      save(db); return { ok: true, r };
    },
    // Agentul Cleaning finalizează curățenia ȘI anunță clientul că locația e gata pentru oaspeți
    markReady(id) {
      const r = this.requestById(id); if (!r) return;
      this.setStatus(id, STATUS.FINALIZAT);   // finalizează + eliberează plata
      r.readyNotified = true; r.readyAt = Date.now();
      r.workFinishedAt = Date.now();          // pontaj: ora de terminare
      if (!r.workStartedAt) r.workStartedAt = r.workFinishedAt;  // fallback dacă n-a apăsat «Începe lucrul»
      // scade consumabilele folosite din stocul Agentului Cleaning de curățenie
      if (r.executorId && r.consumables && r.consumables.length) this.deductStock(r.executorId, r.consumables);
      save(db); return r;
    },
    // ---- Pontaj Agent Cleaning (statistici de timp) ----
    workSessionsOf(executorId) {
      return this.requests()
        .filter(r => r.executorId === executorId && r.workStartedAt)
        .map(r => ({
          id: r.id, address: r.address, area: r.area, date: r.date,
          startedAt: r.workStartedAt, finishedAt: r.workFinishedAt || null,
          minutes: r.workFinishedAt ? Math.max(0, Math.round((r.workFinishedAt - r.workStartedAt) / 60000)) : null,
          inProgress: !r.workFinishedAt,
        }))
        .sort((a, b) => b.startedAt - a.startedAt);
    },
    workStatsOf(executorId) {
      const done = this.workSessionsOf(executorId).filter(s => s.minutes != null);
      const totalMinutes = done.reduce((a, s) => a + s.minutes, 0);
      return { count: done.length, totalMinutes, avgMinutes: done.length ? Math.round(totalMinutes / done.length) : 0 };
    },
    // pentru admin: toate sesiunile de lucru, cu numele Agentului Cleaning
    allWorkSessions() {
      return this.requests()
        .filter(r => r.executorId && r.workStartedAt)
        .map(r => {
          const ex = this.userById(r.executorId);
          return {
            id: r.id, executorId: r.executorId, executorName: ex ? ex.name : "?",
            address: r.address, area: r.area, date: r.date,
            startedAt: r.workStartedAt, finishedAt: r.workFinishedAt || null,
            minutes: r.workFinishedAt ? Math.max(0, Math.round((r.workFinishedAt - r.workStartedAt) / 60000)) : null,
            inProgress: !r.workFinishedAt,
          };
        })
        .sort((a, b) => b.startedAt - a.startedAt);
    },

    // curățenii disponibile: plătite, fără Agent Cleaning de curățenie, în zona lui
    availableForExecutor(executor) {
      return this.requests().filter(r =>
        r.status === STATUS.PLATIT && !r.executorId && r.area === executor.area);
    },
    // solicitări de curățenie la care se pot înscrie Agenții Cleaning din zonă (nu sunt deja atribuite mie)
    openForExecutor(executor) {
      return this.availableForExecutor(executor)
        .filter(r => r.executorId !== executor.id)
        .sort((a, b) => b.createdAt - a.createdAt);
    },
    // lucrările mele: unde sunt Agent Cleaning de curățenie SAU de lenjerie
    jobsOfExecutor(executorId) {
      return this.requests().filter(r => r.executorId === executorId || r.linenExecutorId === executorId);
    },
    requestsOfRequester(requesterId) {
      return this.requests().filter(r => r.requesterId === requesterId);
    },

    // ---- Locații (cu document + aprobare admin) ----
    locations() { return (db.locations || []).slice().sort((a, b) => b.createdAt - a.createdAt); },
    locationById(id) { return (db.locations || []).find(l => l.id === id) || null; },
    locationsOfOwner(ownerId) { return this.locations().filter(l => l.ownerId === ownerId); },
    approvedLocationsOfOwner(ownerId) { return this.locations().filter(l => l.ownerId === ownerId && l.status === "approved"); },
    // locații aprobate ȘI cu Agent Cleaning activ în zonă (utilizabile pentru solicitări)
    usableLocationsOfOwner(ownerId) { return this.approvedLocationsOfOwner(ownerId).filter(l => this.hasActiveExecutorInArea(l.area)); },
    pendingLocations() { return this.locations().filter(l => l.status === "pending"); },

    createLocation(data) {
      if (!data.name || !data.address || !data.sqm) return { ok: false, error: "Completează denumirea, adresa și suprafața." };
      if (!data.doc || !data.doc.name) return { ok: false, error: "Atașează documentul cu dimensiunea locației." };
      if (!data.mapsUrl) return { ok: false, error: "Adaugă linkul Google Maps al locației." };
      const ci = data.checkin || {};
      if (!ci.interfon || !ci.lockbox) return { ok: false, error: "Completează detaliile de check-in: cod interfon și cod lockbox / yală electrică." };
      const loc = {
        id: uid("loc"), ownerId: db.session,
        name: data.name, address: data.address, area: data.area,
        mapsUrl: data.mapsUrl,     // link Google Maps (obligatoriu) — vizibil Agentului Cleaning și serviciului de lenjerie
        sqm: Number(data.sqm),
        doc: { name: data.doc.name, type: data.doc.type || "", dataUrl: data.doc.dataUrl || null },
        checkin: { interfon: ci.interfon, lockbox: ci.lockbox, notes: ci.notes || "" },
        status: "pending", createdAt: Date.now(), reviewedAt: null, rejectReason: "",
      };
      if (!db.locations) db.locations = [];
      db.locations.push(loc); save(db); return { ok: true, loc };
    },
    approveLocation(id) {
      const l = this.locationById(id); if (!l) return;
      l.status = "approved"; l.reviewedAt = Date.now(); l.rejectReason = ""; save(db); return l;
    },
    rejectLocation(id, reason) {
      const l = this.locationById(id); if (!l) return;
      l.status = "rejected"; l.reviewedAt = Date.now(); l.rejectReason = reason || ""; save(db); return l;
    },

    // câștigurile unui executant: curățenie (unde e executorId) + lenjerie (unde e linenExecutorId)
    earningsOfExecutor(executorId) {
      let released = 0, pending = 0;
      this.requests().filter(r => r.status !== STATUS.ANULAT).forEach(r => {
        const b = breakdown(r);
        if (r.executorId === executorId) {
          // curățenie + 50% adaos consumabile — Agentul Cleaning de curățenie
          const part = b.cleaningPayout + b.consExecutantPayout;
          if (r.payoutStatus === "released") released += part; else pending += part;
        }
        if (r.linens && r.linenExecutorId === executorId) {
          if (r.linenPayoutStatus === "released") released += b.linenPayout; else pending += b.linenPayout;
        }
        // serviciul de lenjerie primește și partea de consumabile (achiziție + 30% adaos)
        if (r.linenExecutorId === executorId && b.consLaundryPayout > 0) {
          if (r.payoutStatus === "released") released += b.consLaundryPayout; else pending += b.consLaundryPayout;
        }
      });
      return { released: round2(released), pending: round2(pending), total: round2(released + pending) };
    },

    // ---- Statistici admin ----
    stats() {
      const rs = db.requests;
      const paid = rs.filter(r => r.status !== STATUS.NOU && r.status !== STATUS.ANULAT);
      let revenue = 0, commission = 0, payoutReleased = 0, payoutPending = 0;
      paid.forEach(r => {
        const b = breakdown(r);
        revenue += b.total;
        commission += b.commission;
        // partea de curățenie + 50% adaos consumabile — doar dacă e preluată de un Agent Cleaning
        if (r.executorId) {
          const part = b.cleaningPayout + b.consExecutantPayout;
          if (r.payoutStatus === "released") payoutReleased += part; else payoutPending += part;
        }
        // partea de lenjerie — doar dacă a fost preluată de un Agent Cleaning
        if (b.linenTaken) {
          if (r.linenPayoutStatus === "released") payoutReleased += b.linenPayout; else payoutPending += b.linenPayout;
        }
        // consumabile preluate de serviciul de lenjerie (achiziție + 30% adaos)
        if (b.consLaundryPayout > 0) {
          if (r.payoutStatus === "released") payoutReleased += b.consLaundryPayout; else payoutPending += b.consLaundryPayout;
        }
      });
      return {
        totalRequests: rs.length,
        active: rs.filter(r => [STATUS.PLATIT, STATUS.ACCEPTAT, STATUS.IN_PROGRES].includes(r.status)).length,
        completed: rs.filter(r => r.status === STATUS.FINALIZAT).length,
        revenue: round2(revenue),
        commission: round2(commission),
        payoutReleased: round2(payoutReleased),
        payoutPending: round2(payoutPending),
        commissionPct: commissionPct(),
        executors: db.users.filter(u => u.role === "executant").length,
        requesters: db.users.filter(u => u.role === "solicitant").length,
      };
    },

    resetDemo() { if (MODE === "api") return { ok: false, error: "Indisponibil pe server." }; db = seed(); save(db); return { ok: true }; },
  };

  window.Store = Store;
})();

</script>
<script>
/* =========================================================
   Sleep & Go Cleaning — UI / logica aplicației
   ========================================================= */
(function () {
  const app = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  const S = window.Store;
  const C = S.CONFIG;

  /* ---------- helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (html) => {
    const t = document.createElement("template"); t.innerHTML = html.trim();
    // return the whole fragment when the template has several top-level nodes,
    // otherwise return the single root element
    return t.content.childElementCount > 1 ? t.content : t.content.firstElementChild;
  };
  const money = (n) => `${C.currency}${Number(n).toFixed(2)}`;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const fmtWhen = (ts) => { try { const d = new Date(ts); return d.toLocaleDateString("ro-RO") + " " + d.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  const fmtClock = (ts) => { try { return new Date(ts).toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return "—"; } };

  let solTab = "new";
  let reqLinenMode = "with";
  function renderSolicitant(u) {
    app.innerHTML = "";
    const pendingLoc = S.locationsOfOwner(u.id).filter(l => l.status === "pending").length;
    const ready = S.requestsOfRequester(u.id).filter(r => r.readyNotified);
    app.appendChild(el(`
      <div class="page-head">
        <h1>Salut, ${esc(u.name.split(" ")[0])} 👋</h1>
        <p>Adaugă-ți locația (cu document de suprafață), așteaptă aprobarea, apoi trimite o solicitare și plătește în avans.</p>
      </div>
      ${ready.length ? `<div class="notif-bar" id="notifBar">
        <span class="nb-ico">🔔</span>
        <span><strong>${ready.length} ${ready.length === 1 ? "locație este gată" : "locații sunt gata"} pentru oaspeți!</strong>
        ${ready.map(r => esc(r.address)).join(" · ")}</span>
        <span class="link" id="notifSee">Vezi</span>
      </div>` : ""}
      <div class="navtabs">
        <button data-t="new" class="${solTab === "new" ? "active" : ""}">➕ Solicitare nouă</button>
        <button data-t="locations" class="${solTab === "locations" ? "active" : ""}">📍 Locațiile mele${pendingLoc ? ` (${pendingLoc} în așteptare)` : ""}</button>
        <button data-t="mine" class="${solTab === "mine" ? "active" : ""}">📋 Solicitările mele</button>
      </div>
      <div id="solBody"></div>
    `));
    app.querySelectorAll(".navtabs button").forEach(b => b.onclick = () => { solTab = b.dataset.t; renderSolicitant(u); });
    const seeBtn = $("#notifSee");
    if (seeBtn) seeBtn.onclick = () => { solTab = "mine"; renderSolicitant(u); };
    if (solTab === "new") renderNewRequest(u);
    else if (solTab === "locations") renderMyLocations(u);
    else renderMyRequests(u);
  }

  // opțiuni de oră pentru sloturi
  const hourOpts = (from, to, sel) => {
    let s = "";
    for (let h = from; h <= to; h++) {
      const v = String(h).padStart(2, "0") + ":00";
      s += `<option value="${v}" ${v === sel ? "selected" : ""}>${v}</option>`;
    }
    return s;
  };

  function renderNewRequest(u) {
    const body = $("#solBody");
    const sch = C.schedule;
    const approved = S.usableLocationsOfOwner(u.id);   // aprobate ȘI cu Agent Cleaning activ în zonă
    const waiting = S.approvedLocationsOfOwner(u.id).filter(l => !S.hasActiveExecutorInArea(l.area));

    if (!approved.length) {
      body.appendChild(emptyState(
        "Nicio locație disponibilă pentru solicitare.",
        waiting.length
          ? "Locațiile tale sunt în așteptare — momentan nu avem Agenți Cleaning activi în zonele lor. Vei putea trimite solicitări imediat ce apare un Agent Cleaning."
          : "Adaugă o locație cu documentul de suprafață în tabul «Locațiile mele». După ce administratorul o aprobă, poți trimite o solicitare."));
      return;
    }

    const lastStart = sch.close - sch.minHours; // ultima oră de început validă
    body.appendChild(el(`
      <div class="grid cols-2">
        <div class="card">
          <form id="reqForm">
            <div class="field">
              <label>Locație (aprobată)</label>
              <select name="locationId" required>
                ${approved.map(l => `<option value="${l.id}" data-sqm="${l.sqm}">${esc(l.name)} — ${l.sqm} m² · ${esc(l.area)}</option>`).join("")}
              </select>
              <div class="hint">Suprafața provine din documentul aprobat de administrator.</div>
            </div>
            <div class="field">
              <label>Data dorită</label>
              <input type="date" name="date" required />
            </div>
            <div class="row-2">
              <div class="field">
                <label>Ora început</label>
                <select name="startTime">${hourOpts(sch.open, lastStart, "10:00")}</select>
              </div>
              <div class="field">
                <label>Ora sfârșit</label>
                <select name="endTime">${hourOpts(sch.open + sch.minHours, sch.close, "14:00")}</select>
              </div>
            </div>
            <div class="field">
              <label>Lenjerie</label>
              <div class="role-picker" id="linenMode">
                <div class="role-opt ${reqLinenMode === "with" ? "active" : ""}" data-linen="with">
                  <strong>Cu lenjerie</strong><br><small>${money(S.ronToEur(C.linenSetPriceRon))}/set (${C.linenSetPriceRon} lei) · spălat &amp; călcat</small>
                </div>
                <div class="role-opt ${reqLinenMode === "without" ? "active" : ""}" data-linen="without">
                  <strong>Fără lenjerie</strong><br><small>folosesc lenjeria mea</small>
                </div>
              </div>
              <div class="linen-compo">🧺 O lenjerie (set) = ${C.linenComposition.join(" · ")}</div>
            </div>
            <div class="field">
              <label>Câte lenjerii (seturi)</label>
              <input type="number" name="linenSets" min="0" value="1" />
              <div class="hint" id="linenNote"></div>
            </div>
            <div class="field">
              <label>Alimentare consumabile (opțional)</label>
              <div class="consumables-pick">
                ${S.activeProducts().map(p => `
                  <div class="cp-row">
                    <div class="cp-info"><strong>${esc(p.name)}</strong><small>${esc(p.unit)} · ${p.priceRon} lei</small></div>
                    <input type="number" name="cons_${p.id}" min="0" value="0" class="cp-qty" />
                  </div>`).join("")}
              </div>
              <div class="hint">Agentul Cleaning le cumpără și le reaprovizionează la intervenție. Costul e plătit în avans.</div>
            </div>
            <div class="field">
              <label>Observații (opțional)</label>
              <textarea name="notes" rows="2" placeholder="Detalii utile pentru Agent Cleaning"></textarea>
            </div>
            <button class="btn btn-block" type="submit">Continuă spre plată →</button>
          </form>
        </div>
        <div>
          <div class="card">
            <div class="section-title" style="margin-top:0">Rezumat cost</div>
            <div class="summary" id="summary"></div>
            <div class="pricing-legend">
              <div class="pl-row"><span class="pl-dot peak"></span> Vârf ${sch.peakStart}:00–${sch.peakEnd}:00 · ${money(C.pricePerSqm)}/m²</div>
              <div class="pl-row"><span class="pl-dot off"></span> Înainte de ${sch.peakStart}:00 sau de la ${sch.peakEnd}:00 · <strong>${money(C.pricePerSqm * (1 - sch.discountPct / 100))}/m²</strong> (−${sch.discountPct}%)</div>
              <div class="pl-row"><span class="pl-dot" style="background:var(--warn)"></span> Weekend / sărbători legale · <strong>+${C.weekendHolidaySurchargePct}%</strong></div>
            </div>
            <p class="hint" style="margin-top:12px">Program ${sch.open}:00–${sch.close}:00 · interval minim ${sch.minHours} ore. ⏰ Solicitările se trimit până la ora <strong>${C.bookingCutoffHour}:00</strong>. Plata în avans; solicitarea devine vizibilă Agenților Cleaning din zonă după confirmare.</p>
          </div>
        </div>
      </div>
    `));

    const form = $("#reqForm");
    const readConsumables = () => S.activeProducts()
      .map(pr => ({ productId: pr.id, qty: Number((form["cons_" + pr.id] || {}).value) || 0 }))
      .filter(c => c.qty > 0);
    const updateSummary = () => {
      const f = new FormData(form);
      const opt = form.locationId.selectedOptions[0];
      const sqm = opt ? Number(opt.dataset.sqm) : 0;
      const linenSets = Number(f.get("linenSets")) || 0;
      const withLinen = reqLinenMode === "with";
      const startTime = f.get("startTime");
      const consumables = readConsumables();
      const reqDate = f.get("date");
      const draft = { sqm, linens: withLinen, linenSets, startTime, consumables, date: reqDate };
      const p = S.priceOf(draft);
      $("#linenNote").textContent = withLinen
        ? `Se plătește ${C.linenSetPriceRon} lei/set. Agentul Cleaning o poate spăla și călca.`
        : "Lenjeria proprie trebuie găsită de Agent Cleaning la începerea activității; altfel nu se pune pe pat.";
      $("#summary").innerHTML = `
        <div class="line"><span>Curățenie (${sqm} m²)</span><span>${money(p.cleaning)}</span></div>
        ${p.discPct ? `<div class="line disc"><span>Reducere interval orar (−${p.discPct}%)</span><span>−${money(p.discount)}</span></div>`
          : `<div class="line"><span>Interval de vârf</span><span class="pill">preț întreg</span></div>`}
        ${p.surPct ? `<div class="line" style="color:var(--warn)"><span>Weekend / sărbătoare (+${p.surPct}%)</span><span>+${money(p.surcharge)}</span></div>` : ""}
        ${withLinen && linenSets > 0
          ? `<div class="line"><span>Lenjerie (${linenSets} × ${C.linenSetPriceRon} lei)</span><span>${p.linenRon} lei ≈ ${money(p.linenEur)}</span></div>`
          : `<div class="line"><span>Lenjerie</span><span class="pill">${withLinen ? "0 seturi" : "fără (proprie)"}</span></div>`}
        ${p.consumablesRon > 0 ? `<div class="line"><span>Consumabile (achiziție ${p.consumablesCostRon} + ${p.markupPct}% adaos)</span><span>${p.consumablesRon} lei ≈ ${money(p.consumablesEur)}</span></div>` : ""}
        <div class="line total"><span>Total de plată</span><span class="amt">${money(p.total)}</span></div>`;
    };

    body.querySelectorAll("#linenMode .role-opt").forEach(o => o.onclick = () => {
      reqLinenMode = o.dataset.linen;
      body.querySelectorAll("#linenMode .role-opt").forEach(x => x.classList.toggle("active", x.dataset.linen === reqLinenMode));
      updateSummary();
    });
    form.addEventListener("input", updateSummary);
    form.addEventListener("change", updateSummary);
    updateSummary();

    form.onsubmit = (e) => {
      e.preventDefault();
      const f = new FormData(form);
      const res = S.createRequest({
        locationId: f.get("locationId"),
        linens: reqLinenMode === "with", linenSets: f.get("linenSets"),
        date: f.get("date"), startTime: f.get("startTime"), endTime: f.get("endTime"),
        notes: f.get("notes"), consumables: readConsumables(),
      });
      if (!res.ok) return toast(res.error, "err");
      openPayment(res.req.id, u);
    };
  }

  /* ---------- Locațiile solicitantului ---------- */
  function renderMyLocations(u) {
    const body = $("#solBody");
    const locs = S.locationsOfOwner(u.id);
    body.appendChild(el(`
      <div class="grid cols-2">
        <div class="card">
          <div class="section-title" style="margin-top:0">Adaugă o locație</div>
          <form id="locForm">
            <div class="field"><label>Denumire</label><input name="name" required placeholder="Ex: Apartament Unirii" /></div>
            <div class="field">
              <label>Zona / Localitatea</label>
              <select name="area" required>${C.areas.map(a => `<option ${!S.hasActiveExecutorInArea(a) ? "" : ""}>${a}</option>`).join("")}</select>
              <div id="zoneWarn"></div>
            </div>
            <div class="field"><label>Adresa exactă</label><input name="address" required placeholder="Str., număr, bloc, apartament" /></div>
            <div class="field">
              <label>Link Google Maps</label>
              <input name="mapsUrl" type="url" required placeholder="https://maps.app.goo.gl/... sau https://maps.google.com/?q=..." />
              <div class="hint">Obligatoriu. Deschide locația în Google Maps și copiază linkul de la «Distribuie». Ajută Agentul Cleaning și serviciul de lenjerie să găsească rapid adresa.</div>
            </div>
            <div class="field">
              <label>Suprafață declarată (m²)</label>
              <input type="number" name="sqm" min="1" required placeholder="ex: 60" />
              <div class="hint">Valoarea trebuie să corespundă documentului. Administratorul o validează.</div>
            </div>
            <div class="field">
              <label>Document dimensiune (plan, schiță, act cadastral)</label>
              <input type="file" name="doc" accept=".pdf,.jpg,.jpeg,.png" required />
              <div class="hint">PDF sau imagine, max ${Math.round(C.maxDocBytes / 1024 / 1024)} MB.</div>
            </div>
            <div class="divider"></div>
            <div class="section-title" style="margin-top:0">🔑 Detalii check-in (obligatoriu)</div>
            <div class="row-2">
              <div class="field"><label>Cod interfon</label><input name="interfon" required placeholder="ex: 12B" /></div>
              <div class="field"><label>Cod lockbox / yală electrică</label><input name="lockbox" required placeholder="ex: 4417" /></div>
            </div>
            <div class="field">
              <label>Instrucțiuni acces (opțional)</label>
              <textarea name="checkinNotes" rows="2" placeholder="Ex: lockbox pe gardul din dreapta ușii, etajul 3."></textarea>
              <div class="hint">Vizibile Agentului Cleaning (după preluare) și administratorului.</div>
            </div>
            <button class="btn btn-block" type="submit">Trimite spre aprobare</button>
          </form>
        </div>
        <div>
          <div class="section-title" style="margin-top:0">Locațiile mele (${locs.length})</div>
          <div id="locList" class="req"></div>
        </div>
      </div>
    `));

    const listWrap = $("#locList");
    if (!locs.length) listWrap.appendChild(el(`<p class="hint">Nu ai adăugat nicio locație încă.</p>`));
    else locs.forEach(l => listWrap.appendChild(locationCard(l, "owner")));

    const locForm = $("#locForm");
    const updateZoneWarn = () => {
      const area = locForm.area.value;
      $("#zoneWarn").innerHTML = S.hasActiveExecutorInArea(area) ? ""
        : `<div class="zone-warn">⚠️ Momentan nu avem Agenți Cleaning activi în <strong>${esc(area)}</strong>. Poți înregistra locația, dar va rămâne <strong>în așteptare</strong> până când un Agent Cleaning devine activ în zonă.</div>`;
    };
    locForm.area.onchange = updateZoneWarn;
    updateZoneWarn();

    locForm.onsubmit = (e) => {
      e.preventDefault();
      const form = e.target;
      const file = form.doc.files[0];
      if (!file) return toast("Atașează documentul de suprafață.", "err");
      if (file.size > C.maxDocBytes) return toast("Documentul e prea mare (max " + Math.round(C.maxDocBytes / 1024 / 1024) + " MB).", "err");
      const reader = new FileReader();
      reader.onload = () => {
        const res = S.createLocation({
          name: form.name.value, area: form.area.value, address: form.address.value, sqm: form.sqm.value,
          mapsUrl: form.mapsUrl.value,
          doc: { name: file.name, type: file.type, dataUrl: reader.result },
          checkin: { interfon: form.interfon.value, lockbox: form.lockbox.value, notes: form.checkinNotes.value },
        });
        if (!res.ok) return toast(res.error, "err");
        toast(S.hasActiveExecutorInArea(form.area.value)
          ? "Locație trimisă spre aprobare."
          : "Locație înregistrată — rămâne în așteptare (fără Agenți Cleaning în zonă).", "ok");
        renderSolicitant(u);
      };
      reader.readAsDataURL(file);
    };
  }

  function linenCard(r, ctx, u) {

    else if (mine) actions = r.linenDone ? `<span class="pill">✅ Lenjerie gata</span>` : `<button class="btn btn-ok btn-sm" data-act="finishLinen">Lenjerie gata (adusă)</button>`;
    // logistică: adresa de ridicare (aleasă de Agent Cleaning) + Waze + contact Agent Cleaning
    const execUser = r.executorId ? S.userById(r.executorId) : null;
    const pickupAddr = (r.linenPickup && r.linenPickup.address) || r.address;
    const pickupType = r.linenPickup ? ({ executant: "adresa Agentului Cleaning", next: "următoarea adresă", other: "altă adresă" }[r.linenPickup.type] || "") : "";
    const card = el(`
      <div class="req-item">
        <div class="req-top">
          <div>
            <h3>🧺 Lenjerie · ${r.linenSets} seturi <span class="badge ${mine && r.linenDone ? "finalizat" : "acceptat"}">${mine ? (r.linenDone ? "gata" : "preluată de tine") : "de preluat"}</span></h3>
            <div class="req-meta">
              <span>📍 ${esc(r.area)}</span>
              <span>📅 ${esc(r.date)}</span>

          </div>
        </div>
        <div class="linen-logistics">
          <div class="ll-row"><span class="ll-k">📍 Ridicare de la${pickupType ? ` <small>(${pickupType})</small>` : ""}</span>
            <span class="ll-v">${esc(pickupAddr)} <a class="waze-link" href="${wazeUrl(pickupAddr)}" target="_blank" rel="noopener">🧭 Deschide în Waze</a></span></div>
          ${r.mapsUrl ? `<div class="ll-row"><span class="ll-k">🗺️ Locația (client)</span><span class="ll-v">${mapsLink(r.mapsUrl)}</span></div>` : ""}
          ${execUser ? `<div class="ll-row"><span class="ll-k">🧹 Agent Cleaning curățenie</span><span class="ll-v">${contactPill(execUser, "sună")}</span></div>` : ""}
        </div>
        <div class="payout">
          <div class="prow"><span>Serviciu lenjerie (client)</span><span>${b.linenRon} lei ≈ ${money(b.linenEur)}</span></div>

      </div>
    `);

      const act = btn.dataset.act;

        else toast("Lenjeria nu mai este disponibilă.", "err");

    });
    return card;
  }

  // Agentul Cleaning refuză lenjeria → alege de unde o ridică Serviciul de lenjerie
  function declineLinenModal(r, u) {
    const myAddr = u.address || "";
    // următoarea adresă programată a Agentului Cleaning (alt job viitor)
    const nextJob = S.jobsOfExecutor(u.id)
      .filter(j => j.id !== r.id && j.address && j.executorId === u.id)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .find(j => j.date >= r.date);
    const nextAddr = nextJob ? nextJob.address : "";
    modal(`
      <h2>De unde se ridică lenjeria?</h2>
      <p class="sub">Nu preiei lenjeria la spălat — Serviciul de lenjerie o va ridica de la adresa indicată (cele ${r.linenSets} seturi).</p>
      <div class="field pk-opts">
        <label class="pk-opt"><input type="radio" name="pk" value="executant" checked> <span><strong>Adresa mea (Agent Cleaning)</strong><small>${esc(myAddr || "necompletată — scrie mai jos")}</small></span></label>
        <label class="pk-opt"><input type="radio" name="pk" value="next"> <span><strong>Următoarea adresă programată</strong><small>${esc(nextAddr || "nicio lucrare viitoare — scrie mai jos")}</small></span></label>
        <label class="pk-opt"><input type="radio" name="pk" value="other"> <span><strong>Altă adresă</strong><small>o completezi tu</small></span></label>
      </div>
      <div class="field"><label>Adresa de ridicare</label><input id="pkAddr" placeholder="Stradă, nr., oraș" value="${esc(myAddr)}" /></div>
      <div class="btn-row"><button class="btn btn-soft" onclick="_closeModal()">Renunță</button>
      <button class="btn" style="flex:1" id="pkConfirm">Confirmă · trimite la spălătorie</button></div>
    `);
    const addrInput = $("#pkAddr");
    const prefill = { executant: myAddr, next: nextAddr, other: "" };
    document.querySelectorAll('input[name="pk"]').forEach(radio => radio.onchange = () => {
      if (radio.checked) addrInput.value = prefill[radio.value] || "";
    });
    $("#pkConfirm").onclick = () => {
      const type = (document.querySelector('input[name="pk"]:checked') || {}).value || "other";
      const address = addrInput.value.trim();
      if (!address) return toast("Completează adresa de ridicare.", "err");
      const res = S.declineLinenService(r.id, u.id, { type, address });
      if (!res.ok) return toast(res.error || "Nu s-a putut trimite.", "err");
      closeModal(); toast("Lenjeria a fost trimisă către Serviciul de lenjerie.", "ok"); renderApp();
    };
  }
